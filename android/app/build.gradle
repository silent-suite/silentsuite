import com.slack.keeper.KeeperVariantMarker

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.slack.keeper'
// kotlin-kapt removed — was only used by Requery ORM (now deleted)

android {
    namespace 'io.silentsuite.sync'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.silentsuite.android"

        minSdkVersion 21
        targetSdkVersion 36

        versionCode 19
        versionName "0.5.5-beta"

        buildConfigField "boolean", "customCerts", "true"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt', 'proguard-debug-test-rules.pro'
            testProguardFile 'proguard-rules.txt'

            /*
             * To override the server's url (for example when developing),
             * create file gradle.properties in ~/.gradle/ with this content:
             *
             * appDebugRemoteUrl="http://localserver:8080/"
             */
            if (project.hasProperty('appDebugRemoteUrl')) {
                buildConfigField 'String', 'DEBUG_REMOTE_URL', appDebugRemoteUrl
            } else {
                buildConfigField 'String', 'DEBUG_REMOTE_URL', 'null'
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            testProguardFile 'proguard-rules.txt'
            buildConfigField 'String', 'DEBUG_REMOTE_URL', 'null'
        }
    }


    packagingOptions {
        resources {
            excludes += ['LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }


    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        testInstrumentationRunner "io.silentsuite.sync.SilentSuiteTestRunner"
    }

    /*
     * To sign release build, create file gradle.properties in ~/.gradle/ with this content:
     *
     * signingStoreLocation=/home/key.store
     * signingKeyAlias=alias
     *
     * and set the KSTOREPWD env var to the store and key passwords (should be the same)
     */
    if (project.hasProperty('signingStoreLocation') &&
            project.hasProperty('signingKeyAlias')) {
        println "Found sign properties in gradle.properties! Signing build…"

        signingConfigs {
            release {
                storeFile file(signingStoreLocation)
                storePassword System.getenv("KSTOREPWD")
                keyAlias signingKeyAlias
                keyPassword System.getenv("KSTOREPWD")
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    } else {
        buildTypes.release.signingConfig = null
    }
    compileOptions {
        // enable because ical4android requires desugaring
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
         dataBinding = true
         viewBinding = true
         buildConfig = true
    }
    lint {
        baseline file('lint-baseline.xml')
        disable 'GoogleAppIndexingWarning', 'GradleDependency', 'GradleDynamicVersion', 'IconColors', 'IconLauncherShape', 'IconMissingDensityFolder', 'ImpliedQuantity', 'MissingQuantity', 'MissingTranslation', 'ExtraTranslation', 'Recycle', 'RtlEnabled', 'RtlHardcoded', 'Typos', 'RestrictedApi'
    }
}

// Only the minified debug variant that is exercised by instrumentation tests may inherit
// androidTest keep rules. Production release assemblies remain independent of test sources.
androidComponents {
    beforeVariants(selector().withBuildType('debug')) { builder ->
        builder.registerExtension(KeeperVariantMarker.class, KeeperVariantMarker.INSTANCE)
    }
}

// Kotlin 2.2 removes the legacy compiler-options DSL; retain release-only optimisations.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    if (name.toLowerCase().contains('release')) {
        compilerOptions.freeCompilerArgs.addAll(
                '-Xno-param-assertions',
                '-Xno-call-assertions',
                '-Xno-receiver-assertions'
        )
    }
}

dependencies {
    def androidX = rootProject.ext.androidXVersions

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:${rootProject.ext.desugarJdkLibsVersion}"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${androidX.coroutines}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${androidX.coroutines}"

    // Legacy journalmanager dependency removed — Etebase-only sync
    def etebaseVersion = '2.3.2'
    def etebase16KbAar = file("libs/client-${etebaseVersion}-16kb.aar")
    def etebase16KbRequired = providers.gradleProperty('requireEtebase16Kb')
            .map { it.toBoolean() }
            .getOrElse(false)
    def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
        def normalized = taskName.toLowerCase()
        normalized == 'assemblerelease' || normalized.endsWith(':assemblerelease') ||
                normalized == 'bundlerelease' || normalized.endsWith(':bundlerelease')
    }

    if (etebase16KbAar.exists()) {
        implementation files(etebase16KbAar)
        // Direct dependencies from com.etebase:client:2.3.2, kept explicit because
        // a local AAR does not carry Maven transitive metadata. The upstream
        // okhttp/logging-interceptor dependency is satisfied by this app's
        // direct OkHttp dependencies below.
        implementation "androidx.annotation:annotation:${androidX.annotation}"
    } else if (etebase16KbRequired || releaseBuildRequested) {
        throw new GradleException("Missing ${etebase16KbAar}. Run android/scripts/build-etebase-client-16kb.sh before release builds, or pass -PrequireEtebase16Kb=false only for local non-release builds.")
    } else {
        logger.warn("Using Maven com.etebase:client:${etebaseVersion}; run android/scripts/build-etebase-client-16kb.sh to build the 16 KB-aligned local AAR.")
        implementation "com.etebase:client:$etebaseVersion"
    }

    // ACRA crash reporting removed - will be replaced with Sentry in Phase 2
    // def acraVersion = '5.7.0'
    // implementation "ch.acra:acra-http:$acraVersion"
    // implementation "ch.acra:acra-dialog:$acraVersion"
    implementation "androidx.core:core:${androidX.core}"
    implementation "androidx.appcompat:appcompat:${androidX.appcompat}"
    implementation "androidx.cardview:cardview:${androidX.cardview}"
    // KTX extensions
    implementation "androidx.core:core-ktx:${androidX.core}"
    implementation "androidx.fragment:fragment-ktx:${androidX.fragment}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${androidX.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${androidX.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:${androidX.lifecycle}"


    implementation "com.google.android.material:material:${androidX.material}"
    // Pull-to-refresh gesture for collection/account list screens (issue #297)
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation "androidx.preference:preference:${androidX.preference}"
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    // Requery ORM removed — Etebase uses EtebaseLocalCache for data persistence
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    def okhttp3Version = "4.8.1"
    implementation "com.squareup.okhttp3:okhttp:$okhttp3Version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp3Version"

    implementation 'com.google.code.gson:gson:1.7.2'
    implementation 'org.apache.commons:commons-collections4:4.1'
    implementation 'org.apache.commons:commons-lang3:3.8.1'

    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    implementation project(':cert4android')
    implementation project(':ical4android')
    implementation project(':vcard4android')
    // for tests
    androidTestImplementation "androidx.test:runner:${androidX.testRunner}"
    androidTestImplementation "androidx.test:rules:${androidX.testRules}"
    androidTestImplementation "androidx.test:core:${androidX.testCore}"
    androidTestImplementation "androidx.test.ext:junit:${androidX.testExtJunit}"
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:$okhttp3Version"
    // UIAutomator for store screenshot capture instrumentation tests
    androidTestImplementation "androidx.test.uiautomator:uiautomator:${androidX.uiAutomator}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidX.espresso}"
    androidTestImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttp3Version"
}
