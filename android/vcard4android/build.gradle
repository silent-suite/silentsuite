
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'at.bitfire.vcard4android'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 16        // Android 4.1
        targetSdkVersion 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }
    buildFeatures {
        buildConfig = true
    }
    
    lint {
        disable 'AllowBackup', 'InvalidPackage'
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    def androidX = rootProject.ext.androidXVersions

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"

    implementation "androidx.annotation:annotation:${androidX.annotation}"
    // StringUtils and the builders in AndroidContact, AndroidGroup and Contact. Commons Text used
    // to bring this in transitively; the app ships 3.8.1.
    implementation 'org.apache.commons:commons-lang3:3.8.1'

    // ez-vcard to parse/generate vCards
    api('com.googlecode.ez-vcard:ez-vcard:0.11.2') {
        // hCard functionality not needed
        exclude group: 'org.jsoup'
        exclude group: 'org.freemarker'
        // jCard functionality not needed
        exclude group: 'com.fasterxml.jackson.core'
    }

    // vcard4android retains its upstream API-16 library contract. AndroidX
    // Test 1.6/3.6 require API 19, so keep this module's instrumentation lane
    // on the last compatible versions rather than raising its published floor.
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"

    testImplementation 'junit:junit:4.13'
}
