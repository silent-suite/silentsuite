ext {
    kotlin_version = '2.2.20'
    gradle_version = '8.11.1'
    compileSdkVersion = 36
    buildToolsVersion = '36.0.0'
    // AGP 8.11 supports desugar_jdk_libs 2.1.x (AGP 8.0+ is required). Keep
    // every desugaring consumer on one runtime API surface: Fragment 1.4.1
    // calls DesugarCollections.synchronizedMap(), which 1.1.x lacks.
    desugarJdkLibsVersion = '2.1.5'
    keeperVersion = '0.16.1'

    // cert4android is app-internal and shares SilentSuite's API-21 product floor.
    // Keep the Material 1.13-compatible AndroidX/test cohort explicit so resolved
    // graphs cannot silently drift across app and certificate code paths.
    androidXVersions = [
        annotation: '1.7.1',
        core: '1.15.0',
        appcompat: '1.7.1',
        cardview: '1.0.0',
        fragment: '1.8.5',
        lifecycle: '2.8.7',
        material: '1.13.0',
        preference: '1.2.1',
        coroutines: '1.7.3',
        testCore: '1.6.1',
        testRunner: '1.6.2',
        testRules: '1.6.1',
        testExtJunit: '1.2.1',
        espresso: '3.6.1',
        uiAutomator: '2.3.0'
    ]
    // vcard4android is published with minSdk 16. AndroidX Test 1.6/3.6 needs
    // API 19, so keep its instrumentation artifact cohort explicit instead of
    // incorrectly applying the app/cert4android API-21 verification contract.
    vcardAndroidTestVersions = [runner: '1.5.2', rules: '1.5.0']
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.20'
    ext.gradle_version = '8.11.1'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Keeper is on Maven Central; 0.16.1 is the final Slack release with
        // automatic L8 rule sharing for androidTest and its tested variant.
        classpath 'com.slack.keeper:keeper:0.16.1'
    }
}

allprojects {
    repositories {
        maven { url uri("$rootDir/build/conscrypt-m2")
            content {
                includeModule("org.conscrypt", "conscrypt-android")
            }
        }
        mavenCentral()
        maven { url 'https://jitpack.io' }
        google()
    }
}

subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

// ─────────────────────────────────────────────────────────────────────
// Reproducible release compiler contract.
//
// F-Droid rebuilds this app on its own Debian buildserver and publishes the
// developer-signed APK only when the result matches ours byte for byte. javac,
// not the JVM that happens to run Gradle, decides the class-file attributes
// that survive R8 into classes.dex, and Temurin and Debian's OpenJDK do not
// agree on all of them: one 8-byte MethodParameters attribute was the entire
// remaining delta that failed the 0.5.4-beta comparison.
//
// Release Java therefore compiles with the exact JDK pinned by
// android/scripts/reproducible-build-contract.sh, forked by absolute path so
// the daemon's own JVM is irrelevant.
//
// The binding is on the compile task, not on the requested task name. An
// external recipe reaches the same JavaCompile through `gradle build`,
// `gradle assemble` or the abbreviation `aR`, none of which spell
// "assembleRelease"; a name-matching gate would wave all three through with an
// unpinned compiler and no error. Presence and identity of the JDK are checked
// when a release class file is actually about to be compiled, so the failure
// is impossible to route around and impossible to reach silently.
// ─────────────────────────────────────────────────────────────────────
ext.reproducibleBuildRoot = '/tmp/silentsuite-reproducible-build'
ext.reproducibleJdkRelease = 'jdk-17.0.20.1+1'
ext.reproducibleJdkJavaVersion = '17.0.20.1'
ext.reproducibleJdkImplementorVersion = 'Temurin-17.0.20.1+1'

def configuredReproducibleJdkHome = System.getenv('SILENTSUITE_RELEASE_JDK_HOME')
ext.reproducibleJdkHome = file(configuredReproducibleJdkHome?.trim() ?
        configuredReproducibleJdkHome.trim() :
        "${reproducibleBuildRoot}/jdk/${reproducibleJdkRelease}")

def verifyReproducibleJdk = { File jdkHome ->
    def hint = 'Run android/scripts/reproducible-build-contract.sh provision-jdk first.'
    if (!new File(jdkHome, 'bin/javac').canExecute())
        throw new GradleException("Missing pinned release JDK ${rootProject.ext.reproducibleJdkRelease} at ${jdkHome}. ${hint}")

    def releaseManifest = new File(jdkHome, 'release')
    if (!releaseManifest.isFile())
        throw new GradleException("Pinned release JDK at ${jdkHome} has no release manifest. ${hint}")

    def jdkMetadata = [:]
    releaseManifest.eachLine('UTF-8') { line ->
        def separator = line.indexOf('=')
        if (separator > 0)
            jdkMetadata[line.substring(0, separator)] = line.substring(separator + 1).replaceAll('^"|"$', '')
    }
    // A JDK 17 is not the contract; this exact build is. Vendor and patch level
    // are both checked, because either one changes javac's output.
    [
        IMPLEMENTOR_VERSION: rootProject.ext.reproducibleJdkImplementorVersion,
        JAVA_VERSION: rootProject.ext.reproducibleJdkJavaVersion
    ].each { key, expected ->
        if (jdkMetadata[key] != expected)
            throw new GradleException("Pinned release JDK at ${jdkHome} reports ${key}=${jdkMetadata[key]}, expected ${expected}. ${hint}")
    }
}

// -PrequireReproducibleJdk=true extends the same compiler to every variant, so
// a lane that wants one toolchain for the whole build can ask for it.
def pinEveryJavaCompile = providers.gradleProperty('requireReproducibleJdk')
        .map { it.toBoolean() }
        .getOrElse(false)

allprojects {
    tasks.withType(JavaCompile).configureEach { compileTask ->
        if (!pinEveryJavaCompile && !compileTask.name.toLowerCase().contains('release'))
            return

        compileTask.options.fork = true
        compileTask.options.forkOptions.javaHome = rootProject.ext.reproducibleJdkHome
        compileTask.doFirst {
            verifyReproducibleJdk(rootProject.ext.reproducibleJdkHome)
        }
    }
}

tasks.register('verifySlice4DependencyCohort') {
    group = 'verification'
    description = 'Checks the API-21 AndroidX/Material 1.13 graph and default-preference continuity contracts.'

    doLast {
        def versions = rootProject.ext.androidXVersions
        def required = [
            ':app': [
                debugRuntimeClasspath: [
                    'androidx.core:core': versions.core,
                    'androidx.appcompat:appcompat': versions.appcompat,
                    'androidx.lifecycle:lifecycle-runtime': versions.lifecycle,
                    'androidx.preference:preference': versions.preference,
                    'com.google.android.material:material': versions.material,
                    'org.jetbrains.kotlinx:kotlinx-coroutines-android': versions.coroutines
                ],
                releaseRuntimeClasspath: [
                    'androidx.core:core': versions.core,
                    'androidx.appcompat:appcompat': versions.appcompat,
                    'androidx.preference:preference': versions.preference
                ],
                debugAndroidTestRuntimeClasspath: [
                    'androidx.test:runner': versions.testRunner,
                    'androidx.test:rules': versions.testRules,
                    'androidx.test:core': versions.testCore,
                    'androidx.test.ext:junit': versions.testExtJunit,
                    'androidx.test.espresso:espresso-core': versions.espresso,
                    'androidx.test.uiautomator:uiautomator': versions.uiAutomator
                ]
            ],
            ':cert4android': [
                debugRuntimeClasspath: [
                    'androidx.core:core': versions.core,
                    'androidx.appcompat:appcompat': versions.appcompat,
                    'androidx.lifecycle:lifecycle-runtime': versions.lifecycle,
                    'com.google.android.material:material': versions.material
                ],
                debugAndroidTestRuntimeClasspath: [
                    'androidx.test:runner': versions.testRunner,
                    'androidx.test:rules': versions.testRules,
                    'androidx.test:core': versions.testCore,
                    'androidx.test.ext:junit': versions.testExtJunit,
                    'androidx.test.espresso:espresso-core': versions.espresso
                ]
            ],
            ':ical4android': [
                debugRuntimeClasspath: ['androidx.core:core': versions.core],
                debugAndroidTestRuntimeClasspath: [
                    'androidx.test:runner': versions.testRunner,
                    'androidx.test:rules': versions.testRules,
                    'androidx.test:core': versions.testCore
                ]
            ],
            ':vcard4android': [
                debugRuntimeClasspath: ['androidx.annotation:annotation': versions.annotation],
                debugAndroidTestRuntimeClasspath: [
                    'androidx.test:runner': rootProject.ext.vcardAndroidTestVersions.runner,
                    'androidx.test:rules': rootProject.ext.vcardAndroidTestVersions.rules
                ]
            ]
        ]
        def forbidden = [
            'androidx.lifecycle:lifecycle-extensions',
            'androidx.legacy:legacy-support-core-ui',
            'androidx.legacy:legacy-preference-v14'
        ]

        // Core-library desugaring is packaged into each consuming APK. A
        // mismatched library is therefore a runtime compatibility bug, not
        // merely a dependency-report discrepancy.
        [':app', ':ical4android'].each { projectPath ->
            def project = project(projectPath)
            def buildFile = project.buildFile.text
            if (!buildFile.contains('coreLibraryDesugaringEnabled true') || !buildFile.contains('coreLibraryDesugaring'))
                throw new GradleException("$projectPath must enable core-library desugaring")

            def resolved = project.configurations.getByName('coreLibraryDesugaring')
                    .incoming.resolutionResult.allDependencies
                    .find { dependency -> dependency.hasProperty('selected') && dependency.selected.id.displayName == "com.android.tools:desugar_jdk_libs:${rootProject.ext.desugarJdkLibsVersion}" }
            if (resolved == null)
                throw new GradleException("coreLibraryDesugaring in $projectPath does not resolve desugar_jdk_libs:${rootProject.ext.desugarJdkLibsVersion}")
        }

        required.each { projectPath, configurations ->
            def project = project(projectPath)
            configurations.each { configurationName, expected ->
                def selected = project.configurations.getByName(configurationName)
                        .incoming.resolutionResult.allDependencies
                        .collectEntries { dependency ->
                            if (!dependency.hasProperty('selected'))
                                return [:]
                            def coordinates = dependency.selected.id.displayName.split(':', 3)
                            coordinates.length == 3 ?
                                    [("${coordinates[0]}:${coordinates[1]}".toString()): coordinates[2]] : [:]
                        }
                forbidden.each { coordinate ->
                    if (selected.containsKey(coordinate))
                        throw new GradleException("$configurationName in $projectPath contains obsolete $coordinate")
                }
                expected.each { coordinate, version ->
                    if (selected[coordinate] != version)
                        throw new GradleException("$configurationName in $projectPath resolves $coordinate as ${selected[coordinate]}, expected $version")
                }
            }
        }

        def logger = file('app/src/main/java/io/silentsuite/sync/log/Logger.kt').text
        def appPreferences = file('app/src/main/java/io/silentsuite/sync/ui/settings/AppPreferences.kt').text
        def preferences = file('app/src/main/java/io/silentsuite/sync/utils/AsyncUtils.kt').text
        ['import io.silentsuite.sync.ui.settings.AppPreferences',
         'AppPreferences(context).sharedPreferences',
         'AppPreferences.KEY_LOG_TO_FILE',
         'AppPreferences.KEY_LOG_VERBOSE'].each { contract ->
            if (!logger.contains(contract))
                throw new GradleException("Typed Logger preferences continuity contract missing: $contract")
        }
        if (logger.contains('PreferenceManager'))
            throw new GradleException('Logger must use AppPreferences, not PreferenceManager')
        ['const val KEY_LOG_TO_FILE', 'const val KEY_LOG_VERBOSE'].each { contract ->
            if (!appPreferences.contains(contract))
                throw new GradleException("Typed AppPreferences logging contract missing: $contract")
        }
        ['import androidx.preference.PreferenceManager', 'PreferenceManager.getDefaultSharedPreferences('].each { contract ->
            if (!preferences.contains(contract))
                throw new GradleException("Legacy default SharedPreferences extension contract missing: $contract")
        }
    }
}

// Keeper gives the target APK the merged target+androidTest L8 rules and removes the
// androidTest backport DEX. Verify that single-runtime ownership, not a source-level anchor.
tasks.register('verifyDebugAndroidTestDesugarRuntime', Exec) {
    group = 'verification'
    description = 'Verifies that debug owns the shared desugar runtime and androidTest owns none.'
    dependsOn(':app:packageDebug', ':app:packageDebugAndroidTest')
    commandLine 'python3', 'scripts/verify-androidtest-desugar-runtime.py',
            'app/build/outputs/apk/debug/app-debug.apk',
            'app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
}

project(':app').tasks.matching { it.name == 'testDebugUnitTest' }.configureEach {
    dependsOn(rootProject.tasks.named('verifySlice4DependencyCohort'))
}


apply plugin: 'android-reporting'
