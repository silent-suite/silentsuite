
buildscript {
    ext.versions = [
        conscrypt: '2.6.3'
    ]
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'at.bitfire.cert4android'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        // cert4android is consumed only by this API-21 application.
        minSdkVersion 21            // Android 5.0
        targetSdkVersion 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
        aidl = true
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }


    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

// Keep release-library packaging unchanged. Only the generated androidTest APK
// exceeds the single-DEX reference limit (68,523 references). API 21 natively
// loads the additional DEX files, so no legacy multidex support library is needed.
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        variantBuilder.androidTest?.enableMultiDex = true
    }
}

dependencies {
    def androidX = rootProject.ext.androidXVersions
    def conscryptR28Artifact = rootProject.file(
            "build/conscrypt-m2/org/conscrypt/conscrypt-android/${versions.conscrypt}-r28/conscrypt-android-${versions.conscrypt}-r28.aar"
    )
    def conscryptR28Required = providers.gradleProperty('requireConscryptR28')
            .map { it.toBoolean() }
            .getOrElse(false)
    def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
        def normalized = taskName.toLowerCase()
        normalized == 'assemblerelease' || normalized.endsWith(':assemblerelease') ||
                normalized == 'bundlerelease' || normalized.endsWith(':bundlerelease')
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"

    implementation "androidx.core:core:${androidX.core}"
    implementation "androidx.appcompat:appcompat:${androidX.appcompat}"
    implementation "androidx.cardview:cardview:${androidX.cardview}"
    implementation "androidx.lifecycle:lifecycle-livedata:${androidX.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${androidX.lifecycle}"
    implementation "com.google.android.material:material:${androidX.material}"
    if (conscryptR28Artifact.exists()) {
        implementation "org.conscrypt:conscrypt-android:${versions.conscrypt}-r28"
    } else if (conscryptR28Required || releaseBuildRequested) {
        throw new GradleException("Missing ${conscryptR28Artifact}. Run android/scripts/build-conscrypt-android-r28.sh before release builds.")
    } else {
        logger.warn("Using Maven org.conscrypt:conscrypt-android:${versions.conscrypt}; run android/scripts/build-conscrypt-android-r28.sh to build the NDK r28 AAR.")
        implementation "org.conscrypt:conscrypt-android:${versions.conscrypt}"
    }

    androidTestImplementation "androidx.test:runner:${androidX.testRunner}"
    androidTestImplementation "androidx.test:rules:${androidX.testRules}"
    androidTestImplementation "androidx.test:core:${androidX.testCore}"
    androidTestImplementation "androidx.test.ext:junit:${androidX.testExtJunit}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidX.espresso}"
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.9.0'

    testImplementation 'junit:junit:4.13'
}
