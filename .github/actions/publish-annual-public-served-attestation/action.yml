name: Publish exact annual-only public served attestation
description: Reserves, signs, and finalizes the one immutable run-scoped Stage B artifact. It runs as a JavaScript action because only that runtime natively receives the Actions artifact runtime variables; a plain shell run step does not.
runs:
  using: node24
  main: index.mjs
outputs:
  artifact_id:
    description: Exact immutable reserved and finalized Stage B artifact ID.
  artifact_digest:
    description: SHA-256 digest of the finalized Stage B artifact archive.
