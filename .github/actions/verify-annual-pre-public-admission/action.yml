name: Verify exact annual-only private pre-public admission
description: Fetches one immutable private artifact by exact run/attempt/ID and verifies its closed Stage A signature before any public deployment work.
inputs:
  token: { required: true }
  private_run_id: { required: true }
  private_run_attempt: { required: true }
  private_artifact_id: { required: true }
  expected_public_sha: { required: true }
  private_admission_hmac_key: { required: true }
  public_review_hmac_key: { required: true }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PRIVATE_REPOSITORY: silent-suite/silentsuite-internal
        PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
        PRIVATE_RUN_ATTEMPT: ${{ inputs.private_run_attempt }}
        PRIVATE_ARTIFACT_ID: ${{ inputs.private_artifact_id }}
        EXPECTED_PUBLIC_SHA: ${{ inputs.expected_public_sha }}
        ANNUAL_PRIVATE_ADMISSION_HMAC_KEY: ${{ inputs.private_admission_hmac_key }}
        ANNUAL_PUBLIC_REVIEW_HMAC_KEY: ${{ inputs.public_review_hmac_key }}
      run: |
        set -euo pipefail
        [[ "$PRIVATE_RUN_ID" =~ ^[1-9][0-9]*$ && "$PRIVATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$PRIVATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$EXPECTED_PUBLIC_SHA" =~ ^[0-9a-f]{40}$ ]]
        private_repository="$(gh api "repos/$PRIVATE_REPOSITORY")"
        test "$(jq -r .full_name <<<"$private_repository")" = "$PRIVATE_REPOSITORY"
        test "$(jq -r .private <<<"$private_repository")" = true
        test "$(jq -r .fork <<<"$private_repository")" = false
        private_run="$(gh api "repos/$PRIVATE_REPOSITORY/actions/runs/$PRIVATE_RUN_ID")"
        test "$(jq -r .id <<<"$private_run")" = "$PRIVATE_RUN_ID"
        test "$(jq -r .repository.full_name <<<"$private_run")" = "$PRIVATE_REPOSITORY"
        test "$(jq -r .repository.private <<<"$private_run")" = true
        test "$(jq -r .repository.fork <<<"$private_run")" = false
        test "$(jq -r .run_attempt <<<"$private_run")" = "$PRIVATE_RUN_ATTEMPT"
        test "$(jq -r .event <<<"$private_run")" = workflow_dispatch
        test "$(jq -r .conclusion <<<"$private_run")" = success
        private_head_sha="$(jq -r .head_sha <<<"$private_run")"
        [[ "$private_head_sha" =~ ^[0-9a-f]{40}$ ]]
        PRIVATE_WORKFLOW_ID="$(jq -r .workflow_id <<<"$private_run")"
        [[ "$PRIVATE_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
        private_workflow="$(gh api "repos/$PRIVATE_REPOSITORY/actions/workflows/$PRIVATE_WORKFLOW_ID")"
        test "$(jq -r .id <<<"$private_workflow")" = "$PRIVATE_WORKFLOW_ID"
        test "$(jq -r .path <<<"$private_workflow")" = .github/workflows/deploy.yml
        private_artifact_name="annual-only-pre-public-admission-${PRIVATE_RUN_ID}-${PRIVATE_RUN_ATTEMPT}"
        private_artifact="$(gh api "repos/$PRIVATE_REPOSITORY/actions/artifacts/$PRIVATE_ARTIFACT_ID")"
        test "$(jq -r .id <<<"$private_artifact")" = "$PRIVATE_ARTIFACT_ID"
        test "$(jq -r .workflow_run.id <<<"$private_artifact")" = "$PRIVATE_RUN_ID"
        test "$(jq -r .workflow_run.head_sha <<<"$private_artifact")" = "$private_head_sha"
        test "$(jq -r .name <<<"$private_artifact")" = "$private_artifact_name"
        test "$(jq -r .expired <<<"$private_artifact")" = false
        expected_archive_digest="$(jq -r .digest <<<"$private_artifact")"
        [[ "$expected_archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        rm -rf .annual-only/pre-public
        mkdir -p .annual-only/pre-public
        gh api -H 'Accept: application/vnd.github+json' "repos/$PRIVATE_REPOSITORY/actions/artifacts/$PRIVATE_ARTIFACT_ID/zip" > .annual-only/pre-public.zip
        actual_archive_digest="sha256:$(sha256sum .annual-only/pre-public.zip | awk '{print $1}')"
        test "$actual_archive_digest" = "$expected_archive_digest"
        unzip -q .annual-only/pre-public.zip -d .annual-only/pre-public
        test "$(find .annual-only/pre-public -type f | wc -l)" -eq 1
        test "$(find .annual-only/pre-public -type f -name annual-only-pre-public-admission.json | wc -l)" -eq 1
        export ANNUAL_PRE_PUBLIC_ADMISSION=.annual-only/pre-public/annual-only-pre-public-admission.json
        export ANNUAL_PRIVATE_ADMISSION_REPOSITORY="$PRIVATE_REPOSITORY"
        export ANNUAL_PRIVATE_ADMISSION_RUN_ID="$PRIVATE_RUN_ID"
        export ANNUAL_PRIVATE_ADMISSION_RUN_ATTEMPT="$PRIVATE_RUN_ATTEMPT"
        export ANNUAL_PRIVATE_ADMISSION_ARTIFACT_ID="$PRIVATE_ARTIFACT_ID"
        export ANNUAL_PRIVATE_ADMISSION_ARTIFACT_NAME="$private_artifact_name"
        export ANNUAL_PRIVATE_ADMISSION_SOURCE_SHA="$private_head_sha"
        export ANNUAL_PRIVATE_ADMISSION_DIGEST="sha256:$(sha256sum "$ANNUAL_PRE_PUBLIC_ADMISSION" | awk '{print $1}')"
        node scripts/verify-annual-pre-public-admission.mjs
        echo "ANNUAL_PRIVATE_ADMISSION_SOURCE_SHA=$private_head_sha" >> "$GITHUB_ENV"
