name: Deploy Docs (production)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed live main commit to build and deploy
        required: true
        type: string

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docs-production
    permissions:
      contents: read
    env:
      DOCS_DEPLOY_APPROVED_SHA: ${{ vars.DOCS_DEPLOY_APPROVED_SHA }}

    steps:
      - name: Checkout exact approved commit for build
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify exact owner-approved live main commit for build
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DOCS_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$LIVE_MAIN_SHA" ] ||
             [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ] ||
             [ "$EXPECTED_SHA" != "$LIVE_MAIN_SHA" ] ||
             [ "$DOCS_DEPLOY_APPROVED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing docs build: commit is not the exact owner-approved live main head"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Android distribution documentation
        run: pnpm --filter @silentsuite/docs test:android-distribution

      - name: Build docs
        run: pnpm run build --filter=@silentsuite/docs
        env:
          SILENTSUITE_HOSTED_DOCS_ANALYTICS: '1'

      - name: Upload admitted docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-production-${{ inputs.expected_sha }}
          path: apps/docs/.vitepress/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docs-production
    permissions:
      contents: read
    env:
      DOCS_DEPLOY_APPROVED_SHA: ${{ vars.DOCS_DEPLOY_APPROVED_SHA }}

    steps:
      - name: Checkout exact approved commit for deployment
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Download admitted docs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-production-${{ inputs.expected_sha }}
          path: apps/docs/.vitepress/dist

      - name: Re-assert owner approval immediately before deployment
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DOCS_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$LIVE_MAIN_SHA" ] ||
             [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ] ||
             [ "$EXPECTED_SHA" != "$LIVE_MAIN_SHA" ] ||
             [ "$DOCS_DEPLOY_APPROVED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing docs deploy: commit is no longer the exact owner-approved live main head"
            exit 1
          fi

      - name: Deploy to production Worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: '4'
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
