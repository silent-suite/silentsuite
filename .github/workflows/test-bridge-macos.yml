name: Test Bridge (macOS, network profile / autostart)

# Focused native macOS execution of the #658 durable network profile tests:
# launchd plist rendering, install/remove semantics against a stateful fake
# launchctl, settings durability, and the --install-autostart -> clean-shell
# CLI journey. test_autostart_macos_native.py additionally drives the REAL
# launchctl with a unique throwaway label, temporary paths and a harmless
# child; it never addresses io.silentsuite.bridge. Real bridge startup and
# CalDAV/CardDAV readiness remain separate manual acceptance steps.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bridge/src/silentsuite_bridge/**'
      - 'bridge/tests/test_network_profile.py'
      - 'bridge/tests/test_autostart_profile.py'
      - 'bridge/tests/test_autostart_clean_shell_cli.py'
      - 'bridge/tests/test_autostart_macos_lifecycle.py'
      - 'bridge/tests/test_autostart_macos_native.py'
      - '.github/workflows/test-bridge-macos.yml'

permissions:
  contents: read

# A newer push to the same pull request cancels its superseded run. Every other
# event gets a group of its own run, so main pushes and manual dispatches are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused:
    name: Network profile / autostart tests (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: bridge
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest

      - name: Run network profile / autostart tests natively (#658)
        working-directory: bridge
        shell: bash
        run: python -m pytest tests/test_network_profile.py tests/test_autostart_profile.py tests/test_autostart_clean_shell_cli.py tests/test_autostart_macos_lifecycle.py -v --tb=short

      # The installed man page is the command contract for this runner. Print
      # the complete documentation only; never launchctl state/status output.
      - name: Record installed launchctl command contract (man page)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS $(sw_vers -productVersion)"
          man_text="$RUNNER_TEMP/launchctl-man.txt"
          man launchctl 2>/dev/null | col -bx > "$man_text" || true
          if [ ! -s "$man_text" ]; then
            echo "::error::launchctl man page is not available on this runner"
            exit 1
          fi
          cat "$man_text"

      - name: Run native launchd lifecycle tests (real launchctl, isolated label)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: bridge
        shell: bash
        run: python -m pytest tests/test_autostart_macos_native.py -v --tb=short
