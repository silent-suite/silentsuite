name: Release Self-Host Server Image

# Self-host server component of the protected-main release control plane.
#
# Reachable only through `workflow_call`, and only ever called by
# release-controller.yml with `uses: ./…`, which resolves this file at the
# controller's protected default-branch commit. The tag-push trigger this
# workflow used to carry is gone: a tag can no longer define the workflow that
# grants itself `packages: write`.
#
# Every job checks the candidate out at `candidate/` and the protected
# controller revision at `trusted/`. Candidate bytes are the build input;
# trusted bytes are everything that verifies, mutates or attaches.
#
# Boundaries this workflow keeps: it never publishes the release, never moves a
# mutable tag, declares no deployment environment, holds no hosted-deployment
# credential, and neither calls nor changes the manual hosted-production
# pipeline, which remains the only route to the hosted service.

on:
  workflow_call:
    inputs:
      release_tag:
        description: The admitted immutable release tag.
        required: true
        type: string
      source_sha:
        description: The admitted 40-hex source commit.
        required: true
        type: string

permissions: {}

env:
  IMAGE_NAME: ghcr.io/silent-suite/silentsuite-server
  WEB_IMAGE_NAME: ghcr.io/silent-suite/silentsuite-web-selfhost

jobs:
  build:
    name: Build and smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false

      # The smoke contract is trusted code so the candidate cannot weaken the
      # assertions made about the image it just produced.
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: no version or commit alias exists until both
      # architectures have passed their native smoke, so a half-built release can
      # never be selected by an operator. Buildx attestations are disabled here on
      # purpose — with push-by-digest they would make the recorded child digest an
      # intermediate index rather than the platform manifest, and the published
      # manifest identity is what the installer verifies. Provenance is instead
      # attested per child and for the index in `publish-index`, where it is
      # bound to the exact digests without adding a manifest to the index.
      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: candidate
          file: candidate/Dockerfile.server
          platforms: ${{ matrix.platform }}
          build-args: VCS_REF=${{ inputs.source_sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-server-${{ matrix.arch }}

      - name: Smoke the exact pushed content
        shell: bash
        env:
          CHILD_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CHILD_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not report an immutable child digest"
            exit 1
          fi
          # Pull the published bytes back so the smoke runs against exactly what
          # the index will reference, then give them a local-only name.
          docker pull "${IMAGE_NAME}@${CHILD_DIGEST}"
          LOCAL_TAG="silentsuite-server:release-smoke-${ARCH}"
          docker tag "${IMAGE_NAME}@${CHILD_DIGEST}" "$LOCAL_TAG"
          if ! docker image inspect "$LOCAL_TAG" --format '{{json .RepoDigests}}' | grep -Fq "${IMAGE_NAME}@${CHILD_DIGEST}"; then
            echo "Local image is not the registry content for ${CHILD_DIGEST}"
            exit 1
          fi
          trusted/scripts/self-host-image-smoke.sh \
            --image "$LOCAL_TAG" \
            --platform "$PLATFORM" \
            --expect-revision "$SOURCE_SHA"

      - name: Record the smoked child digest
        shell: bash
        env:
          CHILD_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s\n' "$CHILD_DIGEST" > "digests/${ARCH}.digest"

      - name: Publish the verified child digest to the merge job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 7

  build-web:
    name: Build web and smoke pair (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.web-registry-${{ matrix.arch }}
    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Download the verified native server digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: server-digest
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push owner-enabled web by digest
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: candidate
          file: candidate/Dockerfile.web
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.WEB_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VCS_REF=${{ inputs.source_sha }}
            NEXT_PUBLIC_SELF_HOSTED=true
            NEXT_PUBLIC_ETEBASE_SERVER_URL=
            NEXT_PUBLIC_OWNER_REGISTRATION=true
            NEXT_PUBLIC_BTCPAY_CHECKOUT_ENABLED=false
            NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_LOCAL_CACHE_ENABLED=false
      - name: Pull pair and smoke without registry credentials
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SERVER_DIGEST="$(tr -d '\n' < "server-digest/${ARCH}.digest")"
          for digest in "$WEB_DIGEST" "$SERVER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          docker pull "${WEB_IMAGE_NAME}@${WEB_DIGEST}"
          docker pull "${IMAGE_NAME}@${SERVER_DIGEST}"
          docker logout ghcr.io
          rm -rf -- "$DOCKER_CONFIG"
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" \
            bash trusted/scripts/umbrel-candidate-smoke.sh \
              "${WEB_IMAGE_NAME}@${WEB_DIGEST}" "${IMAGE_NAME}@${SERVER_DIGEST}" \
              --package-dir "$GITHUB_WORKSPACE/candidate/self-host/umbrel/silentsuite" \
              --platform "$PLATFORM" --expect-revision "$SOURCE_SHA"
      - name: Record the verified web producer identity
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir web-digests
          printf '%s\n' "$WEB_DIGEST" > "web-digests/${ARCH}.digest"
          printf '{"sourceCommit":"%s","controllerCommit":"%s","platform":"%s","digest":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$SOURCE_SHA" "$CONTROLLER_SHA" "$PLATFORM" "$WEB_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "web-digests/${ARCH}.producer.json"
      - name: Upload the verified web digest and run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-image-digest-${{ matrix.arch }}
          path: web-digests/
          if-no-files-found: error
          retention-days: 14

  publish-index:
    name: Merge, verify and bundle
    needs: [build, build-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Every alias and index write for one release tag is serialized here, by the
    # admitted tag rather than by a commit: two dispatches naming the same tag
    # must never write the same alias concurrently, and GHCR has no
    # compare-and-swap for tag writes. Never cancels, and never discards a
    # pending run — an evicted publication would leave the release without an
    # index while nothing failed.
    concurrency:
      group: silentsuite-server-registry-${{ github.event.client_payload.release_tag }}
      cancel-in-progress: false
      queue: max
    outputs:
      index-digest: ${{ steps.verify.outputs.index-digest }}
      amd64-digest: ${{ steps.digests.outputs.amd64 }}
      arm64-digest: ${{ steps.digests.outputs.arm64 }}
      web-index-digest: ${{ steps.verify-web.outputs.index-digest }}
      web-amd64-digest: ${{ steps.digests.outputs.web-amd64 }}
      web-arm64-digest: ${{ steps.digests.outputs.web-arm64 }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.source_sha }}

    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false

      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Download verified child digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: server-image-digest-*
          merge-multiple: true

      - name: Download verified web digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: web-digests
          pattern: web-image-digest-*
          merge-multiple: true

      - name: Read child digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          AMD64="$(tr -d '\n' < digests/amd64.digest)"
          ARM64="$(tr -d '\n' < digests/arm64.digest)"
          for digest in "$AMD64" "$ARM64"; do
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Refusing merge: '$digest' is not an immutable child digest"
              exit 1
            fi
          done
          if [ "$AMD64" = "$ARM64" ]; then
            echo "Refusing merge: both architectures reported the same manifest"
            exit 1
          fi
          echo "amd64=$AMD64" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          WEB_AMD64="$(tr -d '\n' < web-digests/amd64.digest)"
          WEB_ARM64="$(tr -d '\n' < web-digests/arm64.digest)"
          for digest in "$WEB_AMD64" "$WEB_ARM64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          test "$WEB_AMD64" != "$WEB_ARM64"
          echo "web-amd64=$WEB_AMD64" >> "$GITHUB_OUTPUT"
          echo "web-arm64=$WEB_ARM64" >> "$GITHUB_OUTPUT"

      # The verifier talks to the GHCR API directly rather than through the
      # Docker client, so `docker/login-action` below does nothing for it: it
      # needs its own pull token, and it mints one from REGISTRY_USERNAME /
      # REGISTRY_PASSWORD. Without them it asks ghcr.io/token anonymously, which
      # a package that is not publicly readable answers with 403 — and the
      # verifier, being fail-closed, stops the release there.
      #
      # These two variables are set on each verifier-running step and nowhere
      # else: not at job scope, and not on any step that executes candidate
      # code. The password is the workflow token this job already holds, used
      # here only for the `:pull` scope it needs; the job's `packages: write`
      # ceiling is unchanged and no new secret is introduced.
      - name: Record the current latest reference
        id: latest-before
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="$(trusted/scripts/verify-server-image-release.sh --repository "$IMAGE_NAME" --resolve latest)"
          echo "digest=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "latest before merge: $BEFORE"
          WEB_BEFORE="$(trusted/scripts/verify-server-image-release.sh --repository "$WEB_IMAGE_NAME" --resolve latest)"
          echo "web-digest=$WEB_BEFORE" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The last thing that happens before the first alias write: the live tag
      # must still resolve to the admitted commit and both tag rulesets must
      # still be active. A tag that moved during the two native builds stops the
      # release here, before any operator-selectable reference exists.
      - name: Revalidate the live release identity before publishing aliases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash trusted/scripts/verify-release-identity.sh \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --stage server-registry-publication

      - name: Merge verified children into the release index
        shell: bash
        env:
          WEB_AMD64_DIGEST: ${{ steps.digests.outputs.web-amd64 }}
          WEB_ARM64_DIGEST: ${{ steps.digests.outputs.web-arm64 }}
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SERVER_REPOSITORY="$IMAGE_NAME"
          SERVER_AMD64_DIGEST="$AMD64_DIGEST"
          SERVER_ARM64_DIGEST="$ARM64_DIGEST"
          for component in server web; do
          if [ "$component" = "web" ]; then
            IMAGE_NAME="$WEB_IMAGE_NAME"
            AMD64_DIGEST="$WEB_AMD64_DIGEST"
            ARM64_DIGEST="$WEB_ARM64_DIGEST"
          fi
          COMMIT_REF="selfhost-${RELEASE_COMMIT}"
          ALIAS_DIR="$(mktemp -d)"
          trap 'rm -rf "$ALIAS_DIR"' EXIT

          # Called immediately before each alias write, and only when a write is
          # actually about to happen. Resolving and verifying an alias that
          # already exists mutates nothing, so it needs no gate; creating one is
          # irreversible for an operator who may already be pulling it. Trusted
          # verifier code, from the controller revision, with the read-only
          # workflow token.
          revalidate_identity() {
            bash trusted/scripts/verify-release-identity.sh \
              --tag "$RELEASE_TAG" \
              --commit "$RELEASE_COMMIT" \
              --stage "self-host-${component}-alias-write:$1"
          }

          # Resolve and fully verify any existing alias before a write. An
          # existing alias is recoverable only when it is the exact verified
          # index made from these children, platforms, and revisions.
          verify_alias() {
            local reference="$1" expected_digest="${2:-}" digest_file="$ALIAS_DIR/${1//\//_}.digest"
            local args=(
              --repository "$IMAGE_NAME"
              --verify-reference "$reference"
              --commit "$RELEASE_COMMIT"
              --amd64-digest "$AMD64_DIGEST"
              --arm64-digest "$ARM64_DIGEST"
              --index-digest-file "$digest_file"
            )
            if [ -n "$expected_digest" ]; then
              args+=(--expected-index-digest "$expected_digest")
            fi
            trusted/scripts/verify-server-image-release.sh "${args[@]}" >&2
            cat "$digest_file"
          }

          expected_index=""
          for reference in "$RELEASE_TAG" "$COMMIT_REF"; do
            existing="$(trusted/scripts/verify-server-image-release.sh --repository "$IMAGE_NAME" --resolve "$reference")"
            if [ "$existing" = "absent" ]; then
              printf 'absent\n' > "$ALIAS_DIR/${reference//\//_}.state"
              continue
            fi
            verified="$(verify_alias "$reference")"
            if [ -z "$expected_index" ]; then
              expected_index="$verified"
            elif [ "$verified" != "$expected_index" ]; then
              echo "Refusing release: aliases resolve to different verified indexes" >&2
              exit 1
            fi
            printf 'present\n' > "$ALIAS_DIR/${reference//\//_}.state"
          done

          publish_alias() {
            local reference="$1"
            if [ "$(cat "$ALIAS_DIR/${reference//\//_}.state")" = "present" ]; then
              return 0
            fi
            # imagetools may publish tags sequentially. Publish one alias at a
            # time and verify it before touching the next; this is recovery
            # logic, not a registry-level atomicity claim.
            #
            # The identity check sits here rather than once at the top of the
            # step so that the second alias write is gated too: the first write
            # plus its verification can take long enough for the tag to move
            # underneath the second.
            revalidate_identity "$reference"
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${reference}" \
              "${IMAGE_NAME}@${AMD64_DIGEST}" \
              "${IMAGE_NAME}@${ARM64_DIGEST}"
            if [ -z "$expected_index" ]; then
              expected_index="$(verify_alias "$reference")"
            else
              verify_alias "$reference" "$expected_index" >/dev/null
            fi
            printf 'present\n' > "$ALIAS_DIR/${reference//\//_}.state"
          }

          publish_alias "$RELEASE_TAG"
          publish_alias "$COMMIT_REF"

          # Both aliases are checked again after publication/recovery. Any
          # conflict is detected before a later alias write is attempted.
          for reference in "$RELEASE_TAG" "$COMMIT_REF"; do
            verified="$(verify_alias "$reference" "$expected_index")"
            if [ "$verified" != "$expected_index" ]; then
              echo "Refusing release: ${reference} changed during publication" >&2
              exit 1
            fi
          done

          rm -rf "$ALIAS_DIR"
          done
          IMAGE_NAME="$SERVER_REPOSITORY"
          AMD64_DIGEST="$SERVER_AMD64_DIGEST"
          ARM64_DIGEST="$SERVER_ARM64_DIGEST"

      - name: Verify the published release image
        id: verify
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trusted/scripts/verify-server-image-release.sh \
            --repository "$IMAGE_NAME" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST" \
            --index-digest-file index.digest
          echo "index-digest=$(cat index.digest)" >> "$GITHUB_OUTPUT"

      - name: Verify the published web image
        id: verify-web
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          WEB_AMD64_DIGEST: ${{ steps.digests.outputs.web-amd64 }}
          WEB_ARM64_DIGEST: ${{ steps.digests.outputs.web-arm64 }}
        run: |
          set -euo pipefail
          bash trusted/scripts/verify-server-image-release.sh \
            --repository "$WEB_IMAGE_NAME" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --amd64-digest "$WEB_AMD64_DIGEST" --arm64-digest "$WEB_ARM64_DIGEST" \
            --index-digest-file web-index.digest
          echo "index-digest=$(cat web-index.digest)" >> "$GITHUB_OUTPUT"

      - name: Assert latest was not moved
        shell: bash
        env:
          LATEST_BEFORE: ${{ steps.latest-before.outputs.digest }}
          WEB_LATEST_BEFORE: ${{ steps.latest-before.outputs.web-digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AFTER="$(trusted/scripts/verify-server-image-release.sh --repository "$IMAGE_NAME" --resolve latest)"
          if [ "$AFTER" != "$LATEST_BEFORE" ]; then
            echo "Refusing release: latest moved from ${LATEST_BEFORE} to ${AFTER}"
            exit 1
          fi
          echo "latest unchanged: $AFTER"
          WEB_AFTER="$(trusted/scripts/verify-server-image-release.sh --repository "$WEB_IMAGE_NAME" --resolve latest)"
          test "$WEB_AFTER" = "$WEB_LATEST_BEFORE"

      # Repository build provenance for the verified index and for each runnable
      # child. push-to-registry is left off so the evidence is stored by GitHub
      # and the OCI index keeps exactly the two runnable children the manifest
      # promises — attestations stay classified as evidence about a digest, not
      # as extra manifests inside the index an installer resolves.
      - name: Attest build provenance for the release index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.verify.outputs.index-digest }}
          push-to-registry: false

      - name: Attest build provenance for the linux/amd64 child
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          push-to-registry: false

      - name: Attest build provenance for the linux/arm64 child
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          push-to-registry: false

      # These attestations name the protected controller producer. The admitted
      # candidate and native runs are recorded separately in producer evidence.
      - name: Attest web index provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.verify-web.outputs.index-digest }}
          push-to-registry: false
      - name: Attest web amd64 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.web-amd64 }}
          push-to-registry: false
      - name: Attest web arm64 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.web-arm64 }}
          push-to-registry: false

      # The bundle carries the candidate's operator-facing self-host files, but
      # the packer, the manifest schema and the verifier are all trusted code.
      - name: Build the self-host release bundle
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          INDEX_DIGEST: ${{ steps.verify.outputs.index-digest }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/build-self-host-bundle.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_COMMIT" \
            --index-digest "$INDEX_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST" \
            --self-host-dir candidate/self-host \
            --output-dir release-assets

      - name: Verify the self-host release bundle
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          INDEX_DIGEST: ${{ steps.verify.outputs.index-digest }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify-self-host-bundle.py \
            --directory release-assets \
            --tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_COMMIT" \
            --index-digest "$INDEX_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST"

      - name: Build and verify the paired image identity
        env:
          WEB_INDEX: ${{ steps.verify-web.outputs.index-digest }}
          WEB_AMD64: ${{ steps.digests.outputs.web-amd64 }}
          WEB_ARM64: ${{ steps.digests.outputs.web-arm64 }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/umbrel_release_contract.py \
            --directory release-assets --tag "$RELEASE_TAG" --source-commit "$RELEASE_COMMIT" \
            --web-index-digest "$WEB_INDEX" --web-amd64-digest "$WEB_AMD64" \
            --web-arm64-digest "$WEB_ARM64" --write
          python3 trusted/scripts/umbrel_release_contract.py \
            --directory release-assets --tag "$RELEASE_TAG" --source-commit "$RELEASE_COMMIT" \
            --web-index-digest "$WEB_INDEX" --web-amd64-digest "$WEB_AMD64" \
            --web-arm64-digest "$WEB_ARM64"

      - name: Upload the verified self-host assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-self-host-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  attach-release-assets:
    name: Attach self-host assets to the draft release
    needs: publish-index
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    # One tag-scoped domain shared with the Android and Bridge attachment jobs.
    # Those live in other workflow files, so a workflow-level group cannot
    # serialize them; this one can, because concurrency groups are repository
    # scoped by name. Never cancel: a cancelled attachment leaves the umbrella
    # draft missing a component rather than merely late.
    #
    # queue: max is what makes "never cancel" true for all three. The default
    # (single) keeps one pending job per group and replaces it, so the third
    # component to arrive would evict the second while it was still waiting.
    # max queues them FIFO; it cannot be combined with cancel-in-progress: true.
    concurrency:
      group: umbrella-release-${{ github.event.client_payload.release_tag }}
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.source_sha }}

    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Download the verified self-host assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsuite-self-host-release-assets
          path: release-assets

      - name: Re-verify the assets before they leave the workflow
        shell: bash
        env:
          AMD64_DIGEST: ${{ needs.publish-index.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ needs.publish-index.outputs.arm64-digest }}
          INDEX_DIGEST: ${{ needs.publish-index.outputs.index-digest }}
        run: |
          set -euo pipefail
          python3 scripts/verify-self-host-bundle.py \
            --directory release-assets \
            --tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_COMMIT" \
            --index-digest "$INDEX_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST"

      - name: Re-verify the paired image identity
        env:
          WEB_INDEX: ${{ needs.publish-index.outputs.web-index-digest }}
          WEB_AMD64: ${{ needs.publish-index.outputs.web-amd64-digest }}
          WEB_ARM64: ${{ needs.publish-index.outputs.web-arm64-digest }}
        run: |
          python3 scripts/umbrel_release_contract.py \
            --directory release-assets --tag "$RELEASE_TAG" --source-commit "$RELEASE_COMMIT" \
            --web-index-digest "$WEB_INDEX" --web-amd64-digest "$WEB_AMD64" \
            --web-arm64-digest "$WEB_ARM64"

      # One credential, for exactly one purpose: the workflow token, used only
      # for the draft-release reads and writes the helper performs. The helper
      # revalidates the live tag and both rulesets on either side of the upload,
      # creates nothing but a draft bound to the admitted commit, refuses to
      # touch a published release, and never publishes one — the operator does
      # that by hand.
      - name: Attach the verified assets to the shared draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/attach-umbrella-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --expected-commit "$RELEASE_COMMIT" \
            --directory release-assets \
            --asset "silentsuite-self-host-${RELEASE_TAG}.tar.gz" \
            --asset "silentsuite-self-host-${RELEASE_TAG}.tar.gz.sha256" \
            --asset server-image.json \
            --asset umbrel-images.json
