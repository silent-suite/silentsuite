name: Release Android

# Android component of the protected-main release control plane.
#
# Reachable only through `workflow_call`, and only ever called by
# release-controller.yml with `uses: ./…`, which resolves this file at the
# controller's protected default-branch commit. There is no tag push, no
# dispatch and no ref selection that can substitute a different definition of
# this lane.
#
# The signing boundary this preserves is unchanged from the tag-triggered
# design and is enforced byte-for-byte by scripts/check-android-signing-boundary.py:
#
#   signing-policy         trusted structural gate, contents: read
#   conscrypt-r28          candidate build, contents: read
#   build-unsigned-release candidate Gradle, contents: read, no environment and
#                          no signing secret — the runner holds nothing worth
#                          taking, and hands over a closed, checksummed artifact
#   sign-release           a fresh runner that never checks out or executes
#                          candidate code; holds the keystore, binds the
#                          protected environment, contents: read
#   attach-release-assets  holds contents: write; no environment, no signing
#                          secret, no Gradle — only the closed artifact and the
#                          trusted attachment helper
#
# The job split is the load-bearing part. A GitHub-hosted runner grants every
# job passwordless sudo, so candidate code that shares a runner with signing
# material can replace trusted helper bytes, poison PATH or BASH_ENV through
# $GITHUB_ENV, and substitute the very tools that verify it. Ordering steps
# cannot close that; a separate runner can.

on:
  workflow_call:
    inputs:
      release_tag:
        description: The admitted immutable release tag.
        required: true
        type: string
      source_sha:
        description: The admitted 40-hex source commit.
        required: true
        type: string
    # These declarations are capabilities, not repository-scoped fallback
    # values. The controller grants only these names; the sign-release job's
    # android-release binding supplies the protected environment values.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64-encoded Android release keystore.
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: Password for the Android release keystore.
        required: true
      ANDROID_KEY_ALIAS:
        description: Alias of the Android release signing key.
        required: true

permissions: {}

jobs:
  signing-policy:
    name: Enforce Android signing boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install signing policy dependency
        run: |
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/android-signing-policy-requirements.txt"
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/android-signing-policy-requirements.txt"

      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Enforce Android signing boundary
        run: python "$GITHUB_WORKSPACE/scripts/check-android-signing-boundary.py"

  conscrypt-r28:
    name: Build Conscrypt with Android NDK r28
    needs: signing-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK r28 and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Conscrypt with Android NDK r28
        run: |
          chmod +x scripts/build-conscrypt-android-r28.sh
          scripts/build-conscrypt-android-r28.sh

      - name: Verify rebuilt Conscrypt AAR
        run: |
          python3 scripts/verify-native-16kb.py \
            --require-lib libconscrypt_jni.so \
            --require-android-ndk-major libconscrypt_jni.so=28 \
            build/conscrypt-m2/org/conscrypt/conscrypt-android/2.6.3-r28/conscrypt-android-2.6.3-r28.aar

      - name: Upload rebuilt Conscrypt AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conscrypt-r28-${{ inputs.source_sha }}
          path: android/build/conscrypt-m2
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # The lane's entry gate: `build-release` cannot start until this passes, so
  # the environment-gated job is never even scheduled for a tag that has already
  # moved. It runs trusted controller code on a runner with no candidate tree on
  # it at all, which is the one thing the in-job checks cannot claim.
  #
  # It is not the last word. A job boundary is not "immediately before" anything
  # — the signed build still has to check out, install an NDK and build an AAR
  # before it reaches the keystore — so `build-release` revalidates again at each
  # of its own irreversible boundaries, from its own trusted checkout.
  #
  # It waits on conscrypt-r28 deliberately: running it at the head of the lane
  # would put a half-hour native build between this gate and the signed job.
  # ─────────────────────────────────────────────────────────────────────
  revalidate-signing:
    name: Revalidate the release identity before signing
    needs: conscrypt-r28
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify the live release identity and tag rulesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-signing

  # ─────────────────────────────────────────────────────────────────────
  # Unsigned producer — candidate code, and nothing it could want.
  #
  # This is where the tag's own Gradle, its build scripts and its NDK toolchain
  # run. It holds no signing secret, binds no environment, and its token is
  # read-only, so there is nothing on this runner worth compromising it for.
  #
  # That separation is the whole point. A GitHub-hosted runner gives every job
  # passwordless sudo, so candidate code sharing a runner with signing material
  # can rewrite any file, any tool on PATH, and the environment of every later
  # step. No amount of ordering fixes that; only a fresh runner does. The
  # keystore is therefore decoded in `sign-release`, on a machine this job has
  # never touched.
  # ─────────────────────────────────────────────────────────────────────
  build-unsigned-release:
    name: Build (unsigned, admitted release)
    needs: [signing-policy, conscrypt-r28]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # javac decides the class-file attributes that reach classes.dex, so the
      # release APK is compiled by the exact checksummed JDK the contract pins
      # rather than by whichever 17 the runner image ships.
      - name: Provision the pinned reproducible JDK
        run: scripts/reproducible-build-contract.sh provision-jdk

      - name: Install Android NDK r28
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 16 KB-aligned Etebase client AAR
        run: scripts/build-etebase-client-16kb.sh

      - name: Download rebuilt Conscrypt AAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: conscrypt-r28-${{ inputs.source_sha }}
          path: android/build/conscrypt-m2

      # No -PsigningStoreLocation/-PsigningKeyAlias, so app/build.gradle leaves
      # the release build type unsigned and AGP emits app-release-unsigned.apk.
      - name: Build the unsigned release APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PrequireEtebase16Kb=true \
            -PrequireConscryptR28=true \
            -PrequireReproducibleJdk=true

      - name: Capture release dependency graph and unsigned split evidence
        env:
          BUNDLETOOL_VERSION: '1.18.1'
          BUNDLETOOL_SHA256: '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c'
        run: |
          set -euo pipefail
          mkdir -p build/privacy-evidence/dependencies build/privacy-evidence/build-metadata
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > build/privacy-evidence/dependencies/release-runtime.txt
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --output build/privacy-evidence/unsigned-release.apks \
            --mode universal
          unzip -q build/privacy-evidence/unsigned-release.apks \
            -d build/privacy-evidence/unsigned-release-splits
          test -s app/build/outputs/mapping/release/mapping.txt
          mkdir -p build/privacy-evidence/build-metadata/app/build/outputs/mapping/release
          cp app/build/outputs/mapping/release/mapping.txt \
            build/privacy-evidence/build-metadata/app/build/outputs/mapping/release/mapping.txt
          find app/build/intermediates -type f \
            \( -iname '*manifest*.xml' -o -iname '*mapping*.txt' -o -iname 'resources*.txt' -o -iname 'resources*.arsc' \) \
            -exec cp --parents {} build/privacy-evidence/build-metadata/ \;

      # The tracker scan belongs here, on the runner where the candidate code
      # that could introduce a tracker actually executed. Signing adds a
      # signature block; it cannot add an SDK.
      - name: Scan the unsigned build for tracker signatures
        run: |
          set -euo pipefail
          python3 scripts/scan-tracker-signatures.py \
            --manifest security/tracker-signatures.json \
            --summary build/privacy-evidence/tracker-scan-summary.json \
            build/privacy-evidence/dependencies \
            build/privacy-evidence/build-metadata \
            app/build/outputs/apk/release \
            app/build/outputs/bundle/release \
            build/privacy-evidence/unsigned-release.apks \
            build/privacy-evidence/unsigned-release-splits

      - name: Verify unsigned release native libraries
        run: |
          python3 scripts/verify-native-16kb.py \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            --require-android-ndk-major libetebase_android.so=28 \
            --require-android-ndk-major libconscrypt_jni.so=28 \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab

      # libconscrypt_jni.so and the upstream 32-bit libetebase_android.so ship
      # pre-stripped, so no symbols can be extracted for them; only the locally
      # rebuilt 64-bit Etebase libraries carry symbol tables. AGP 8.11.1 does
      # not emit a native-debug-symbols.zip for prebuilt-AAR-only native
      # libraries, so the ZIP is packaged manually from the rebuilt AAR.
      - name: Package release native debug symbols
        run: |
          python3 scripts/package-native-debug-symbols.py \
            --etebase-aar app/libs/client-2.3.2-16kb.aar \
            --output app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Verify release native debug symbols
        run: |
          python3 scripts/verify-native-debug-symbols.py \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            --require-symbol arm64-v8a/libetebase_android.so \
            --require-symbol x86_64/libetebase_android.so \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --symbols app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Upload unsigned tracker verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-tracker-scan-${{ inputs.source_sha }}
          path: android/build/privacy-evidence/
          retention-days: 30

      # Exactly eight files with fixed names, a producer-side checksum manifest
      # over the six payload files, and the commit this was built from. The
      # signing job re-derives all of it before the keystore is decoded.
      - name: Stage the closed unsigned handoff
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          unsigned_apks=(app/build/outputs/apk/release/*.apk)
          [ "${#unsigned_apks[@]}" -eq 1 ] \
            || { echo "expected exactly one unsigned release APK, found ${#unsigned_apks[@]}" >&2; exit 1; }
          rm -rf build/unsigned-handoff
          mkdir -p build/unsigned-handoff
          cp "${unsigned_apks[0]}" build/unsigned-handoff/app-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab build/unsigned-handoff/app-release.aab
          cp app/build/outputs/mapping/release/mapping.txt build/unsigned-handoff/mapping.txt
          cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            build/unsigned-handoff/native-debug-symbols.zip
          cp build/privacy-evidence/dependencies/release-runtime.txt \
            build/unsigned-handoff/release-runtime-dependencies.txt
          cp build/privacy-evidence/tracker-scan-summary.json \
            build/unsigned-handoff/tracker-scan-summary.json
          printf '%s\n' "$SOURCE_SHA" > build/unsigned-handoff/source-sha
          ( cd build/unsigned-handoff && chmod 0644 ./*
            for payload in \
              app-release-unsigned.apk \
              app-release.aab \
              mapping.txt \
              native-debug-symbols.zip \
              release-runtime-dependencies.txt \
              tracker-scan-summary.json; do
              [ -s "$payload" ] \
                || { echo "refusing empty unsigned handoff file: $payload" >&2; exit 1; }
            done
            sha256sum \
              app-release-unsigned.apk \
              app-release.aab \
              mapping.txt \
              native-debug-symbols.zip \
              release-runtime-dependencies.txt \
              tracker-scan-summary.json > SHA256SUMS )
          ls -l build/unsigned-handoff

      - name: Publish the unsigned build to the signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-android-unsigned-${{ inputs.source_sha }}
          path: android/build/unsigned-handoff/
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # The independent rebuild — the half of the reproducibility contract that
  # cannot be faked by building the same tree twice on the same machine.
  #
  # F-Droid does not accept a developer-signed APK because our CI says it is
  # deterministic. It rebuilds from the public source on its own Debian
  # buildserver and publishes only if every unsigned entry matches. The
  # 0.5.4-beta attempt discovered that after the release was cut, from someone
  # else's pipeline: 2509 of 2517 entries matched, which is a failure.
  #
  # This job is that second environment, before signing rather than after
  # publication. It is deliberately unlike `build-unsigned-release` on every
  # axis the contract has to survive:
  #
  #   Debian bookworm, not the Ubuntu runner image
  #   a container HOME, CARGO_HOME=/opt/rust/cargo, ANDROID_HOME=/opt/android-sdk
  #   Gradle running on Debian's openjdk-17, not Temurin
  #   its own Conscrypt, BoringSSL and Etebase native builds from source
  #
  # What it must NOT differ in is the pinned compiler, the canonical build root
  # and the prefix maps — those are the contract. If the APKs still match here,
  # the remaining distance to F-Droid's builder is the recipe, not the source.
  #
  # It holds nothing: no environment, no signing secret, no workflow token, and
  # a read-only checkout of the candidate, exactly like the producer it doubles.
  # ─────────────────────────────────────────────────────────────────────
  rebuild-fdroid-environment:
    name: Rebuild independently (F-Droid-representative environment)
    needs: signing-policy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    container:
      image: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_NDK_HOME: /opt/android-sdk/ndk/28.2.13676358
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # Before the checkout: a slim image has neither git nor a JDK, and the
      # Debian JDK here is the point — it is what runs Gradle, so the contract
      # is proven to survive a daemon JVM that is not the pinned compiler.
      - name: Install the Debian build environment
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl file git \
            openjdk-17-jdk-headless python3 unzip xz-utils zip
          "$JAVA_HOME/bin/javac" -version

      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install the Android SDK, NDK r28 and CMake
        env:
          CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --silent --show-error \
            "$CMDLINE_TOOLS_URL" --output /tmp/cmdline-tools.zip
          echo "$CMDLINE_TOOLS_SHA256  /tmp/cmdline-tools.zip" | sha256sum --check --strict
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          # Not `yes | sdkmanager --licenses`: sdkmanager stops reading once the
          # prompts are answered, `yes` takes SIGPIPE, and under pipefail the
          # pipeline returns 141 and kills the step. A regular file has no
          # writer to signal, so the acceptance is deterministic.
          for _ in $(seq 100); do echo y; done > /tmp/sdk-license-acceptance
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            < /tmp/sdk-license-acceptance > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          test -d "$ANDROID_NDK_HOME"

      - name: Install rustup
        env:
          RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "$RUSTUP_INIT_URL" --output /tmp/rustup-init
          echo "$RUSTUP_INIT_SHA256  /tmp/rustup-init" | sha256sum --check --strict
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # The same scripts the release producer runs. The pinned Rust toolchain,
      # the pinned JDK and the canonical build root all come from the contract
      # inside them, so nothing about this environment can select a different
      # toolchain than the release lane used.
      - name: Provision the pinned reproducible JDK
        working-directory: android
        shell: bash
        run: scripts/reproducible-build-contract.sh provision-jdk

      - name: Build 16 KB-aligned Etebase client AAR
        working-directory: android
        shell: bash
        run: scripts/build-etebase-client-16kb.sh

      - name: Build Conscrypt with Android NDK r28
        working-directory: android
        shell: bash
        run: scripts/build-conscrypt-android-r28.sh

      - name: Build the unsigned release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PrequireEtebase16Kb=true \
            -PrequireConscryptR28=true \
            -PrequireReproducibleJdk=true

      - name: Stage the independently rebuilt APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rebuilt=(app/build/outputs/apk/release/*.apk)
          [ "${#rebuilt[@]}" -eq 1 ] \
            || { echo "expected exactly one rebuilt APK, found ${#rebuilt[@]}" >&2; exit 1; }
          mkdir -p build/fdroid-rebuild
          cp "${rebuilt[0]}" build/fdroid-rebuild/app-release-unsigned.apk
          sha256sum build/fdroid-rebuild/app-release-unsigned.apk

      - name: Publish the independent rebuild to the reproducibility gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-android-fdroid-rebuild-${{ inputs.source_sha }}
          path: android/build/fdroid-rebuild/
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # The gate. `sign-release` cannot start until this passes, so an APK that
  # only this machine can produce is never signed and never published.
  #
  # It runs the comparison out of a checkout of the protected controller
  # revision, not the candidate tree: the check that decides whether a release
  # may be signed must not be defined by the thing being released.
  # ─────────────────────────────────────────────────────────────────────
  reproducibility-gate:
    name: Prove the release build is independently reproducible
    needs: [build-unsigned-release, rebuild-fdroid-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Download the release lane's unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsuite-android-unsigned-${{ inputs.source_sha }}
          path: release-lane

      - name: Download the independent rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsuite-android-fdroid-rebuild-${{ inputs.source_sha }}
          path: fdroid-rebuild

      - name: Compare both builds under the F-Droid byte contract
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/verify-android-build-reproducibility.py" \
            --reference "$GITHUB_WORKSPACE/release-lane/app-release-unsigned.apk" \
            --candidate "$GITHUB_WORKSPACE/fdroid-rebuild/app-release-unsigned.apk" \
            --report "$GITHUB_WORKSPACE/reproducibility/verdict.json"

      - name: Upload the reproducibility verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reproducibility-verdict-${{ inputs.source_sha }}
          path: reproducibility/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Signing — a fresh runner that never sees candidate code.
  #
  # No candidate checkout, no Gradle, no build script, no candidate PATH entry.
  # The only things executed here are the protected controller's own scripts,
  # JDK tools and Android build-tools resolved by absolute path, and the pinned
  # bundletool jar. The candidate contributes data — an APK, an AAB and their
  # evidence — which is admitted as hostile input before the keystore exists.
  #
  # Ordering inside the job: admit the data, prove the tools, revalidate the
  # live release identity, decode, verify the store, sign, prove the signature,
  # stage, hand off. The keystore is removed unconditionally at the end.
  # ─────────────────────────────────────────────────────────────────────
  sign-release:
    name: Sign (admitted release)
    needs:
      [signing-policy, conscrypt-r28, revalidate-signing, build-unsigned-release,
       reproducibility-gate]
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read

    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install the exact Android signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ] \
            || { echo "fixed Android sdkmanager is missing or not executable" >&2; exit 1; }
          CANONICAL_ANDROID_HOME="$(readlink -f -- "$ANDROID_HOME")"
          CANONICAL_SDKMANAGER="$(readlink -f -- "$SDKMANAGER")"
          case "$CANONICAL_SDKMANAGER" in
            "$CANONICAL_ANDROID_HOME"/*) ;;
            *) echo "fixed Android sdkmanager resolves outside ANDROID_HOME" >&2; exit 1 ;;
          esac
          "$SDKMANAGER" "build-tools;36.0.0"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          [ -d "$BUILD_TOOLS" ] \
            || { echo "build-tools;36.0.0 was not installed at its exact path" >&2; exit 1; }
          for tool in zipalign apksigner; do
            [ -f "$BUILD_TOOLS/$tool" ] && [ -x "$BUILD_TOOLS/$tool" ] \
              || { echo "build-tools;36.0.0/$tool is missing or not executable" >&2; exit 1; }
          done

      - name: Download the unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsuite-android-unsigned-${{ inputs.source_sha }}
          path: unsigned

      - name: Admit the unsigned build
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/admit-unsigned-android-artifact.sh" \
            --directory "$GITHUB_WORKSPACE/unsigned" \
            --source-sha "$SOURCE_SHA"

      - name: Fetch the pinned bundletool
        env:
          BUNDLETOOL_VERSION: '1.18.1'
          BUNDLETOOL_SHA256: '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict

      # The last gate before the release key exists on this runner.
      - name: Revalidate the release identity before decoding signing material
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-signing-material

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/silentsuite-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"; then
            echo "Refusing to sign: the encoded keystore secret is not valid base64" >&2
            exit 1
          fi
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Refusing to sign: the decoded keystore is missing or empty" >&2
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Verify the release keystore before signing
        env:
          KSTOREPWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/verify-android-release-keystore.sh"

      - name: Sign the admitted APK and AAB
        env:
          KSTOREPWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          UNSIGNED_DIR="$GITHUB_WORKSPACE/unsigned" \
          OUTPUT_DIR="$GITHUB_WORKSPACE/signed" \
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar" \
          bash "$GITHUB_WORKSPACE/scripts/sign-android-release.sh"

      - name: Verify the signed native libraries
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/android/scripts/verify-native-16kb.py" \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            --require-android-ndk-major libetebase_android.so=28 \
            --require-android-ndk-major libconscrypt_jni.so=28 \
            "$GITHUB_WORKSPACE/signed/app-release.apk" \
            "$GITHUB_WORKSPACE/signed/app-release.aab"

      - name: Verify the signed native debug symbols
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/android/scripts/verify-native-debug-symbols.py" \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            --require-symbol arm64-v8a/libetebase_android.so \
            --require-symbol x86_64/libetebase_android.so \
            --bundle "$GITHUB_WORKSPACE/signed/app-release.aab" \
            --symbols "$GITHUB_WORKSPACE/unsigned/native-debug-symbols.zip"

      - name: Revalidate the release identity before publishing signed artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-signed-artifact-egress

      - name: Upload signed split evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-release-${{ inputs.source_sha }}
          path: signed/signed-release.apks
          if-no-files-found: error
          retention-days: 30

      # Same six versioned filenames the umbrella readiness contract expects.
      - name: Stage the closed release-asset set
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp signed/app-release.apk "release-assets/silentsuite-android-${RELEASE_TAG}.apk"
          cp signed/app-release.aab "release-assets/silentsuite-android-${RELEASE_TAG}.aab"
          cp unsigned/native-debug-symbols.zip \
            "release-assets/silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip"
          cd release-assets
          sha256sum "silentsuite-android-${RELEASE_TAG}.apk" \
            > "silentsuite-android-${RELEASE_TAG}-installer.sha256"
          sha256sum "silentsuite-android-${RELEASE_TAG}.aab" \
            > "silentsuite-android-${RELEASE_TAG}-bundle.sha256"
          sha256sum "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip" \
            > "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.sha256"
          ls -l

      # The last gate in this job: past this point the closed asset set is
      # available to `attach-release-assets`, which holds contents: write.
      - name: Revalidate the release identity before the attachment handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-attachment-handoff

      - name: Publish the closed release-asset set to the attachment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-android-release-assets-${{ inputs.source_sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

  # ─────────────────────────────────────────────────────────────────────
  # Release attachment — the only Android job that can write a release.
  #
  # It has contents:write and no signing material: no `android-release`
  # environment, no keystore, no signing secrets, no Gradle. All it does is
  # download the closed asset set the signed job produced, re-assert that the
  # inventory is exactly what was promised, and hand it to the hardened
  # attachment helper checked out from the protected controller revision.
  #
  # The helper — not a marketplace release action — is what writes. It
  # revalidates the live tag and both rulesets on either side of the upload,
  # refuses a published release outright, never deletes or replaces an asset,
  # preserves siblings, and reads every upload back.
  # ─────────────────────────────────────────────────────────────────────
  attach-release-assets:
    name: Attach Android assets to the draft release
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared tag-scoped domain with the Bridge and self-host attachment jobs, so
    # the three components never append to the same umbrella draft at once.
    # Never cancel: a cancelled attachment silently drops a component.
    #
    # queue: max is load-bearing, not decoration. Under the default (single) the
    # scheduler keeps only one pending job per group and replaces it, so with
    # three components one attachment would be cancelled while merely waiting —
    # the umbrella draft would come out a component short with nothing failing.
    # max holds them in FIFO instead. It cannot be combined with
    # cancel-in-progress: true, which is fine: never cancelling is the point.
    #
    # The group reads the dispatch payload rather than an input because a job's
    # concurrency group is evaluated as the job is queued; the payload tag is
    # the same string the controller admitted, and no attachment job can run
    # until that admission has passed.
    concurrency:
      group: umbrella-release-${{ github.event.client_payload.release_tag }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Download the closed release-asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsuite-android-release-assets-${{ inputs.source_sha }}
          path: release-assets

      # The signed job promised exactly six files. Anything else here means the
      # artifact is not what was built, and nothing is uploaded.
      - name: Re-assert the closed asset inventory
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s\n' \
            "silentsuite-android-${RELEASE_TAG}-bundle.sha256" \
            "silentsuite-android-${RELEASE_TAG}-installer.sha256" \
            "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.sha256" \
            "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip" \
            "silentsuite-android-${RELEASE_TAG}.aab" \
            "silentsuite-android-${RELEASE_TAG}.apk" | LC_ALL=C sort)"
          ACTUAL="$(find release-assets -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Refusing attachment: the release-asset set is not the closed inventory" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi
          echo "Closed inventory confirmed for ${RELEASE_TAG}"

      - name: Attach the Android assets to the shared draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/attach-umbrella-release-assets.sh" \
            --tag "$RELEASE_TAG" \
            --expected-commit "$SOURCE_SHA" \
            --directory release-assets \
            --asset "silentsuite-android-${RELEASE_TAG}.apk" \
            --asset "silentsuite-android-${RELEASE_TAG}-installer.sha256" \
            --asset "silentsuite-android-${RELEASE_TAG}.aab" \
            --asset "silentsuite-android-${RELEASE_TAG}-bundle.sha256" \
            --asset "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip" \
            --asset "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.sha256"
