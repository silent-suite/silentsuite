name: Build Bridge Binaries

# The one definition of how a bridge binary is built.
#
# Two ways in, one of them privileged and one not:
#   * release-bridge.yml calls it with the admitted (tag, commit) pair, and that
#     call resolves this file at the protected controller revision;
#   * an owner may dispatch it to check the five-platform matrix still builds
#     without tagging anything.
#
# It cannot release. There is no tag trigger, no repository write, no
# environment, and no credential of any kind — the umbrella attachment lives in
# release-bridge.yml, which is reachable only through the controller.

on:
  workflow_call:
    inputs:
      release_tag:
        description: The admitted immutable release tag, stamped into the binary.
        required: true
        type: string
      source_sha:
        description: The admitted 40-hex source commit.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to stamp into the binaries. Blank uses pyproject.
        required: false
        default: ''
        type: string
      source_sha:
        description: Commit to build. Blank uses the selected ref.
        required: false
        default: ''
        type: string
      packaged_update_check:
        description: Also run the packaged --check-update characterization on the macOS lanes (one public GitHub read; never self-update).
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.os-label }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # The release version is stamped into the binary from the admitted tag. The
    # spec file (silentsuite-bridge.spec) reads this and freezes it into
    # _version.py. A bare dispatch leaves it empty, which is what makes the
    # binary fall back to the pyproject version instead of claiming a release.
    env:
      SILENTSUITE_BRIDGE_VERSION: ${{ inputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - runner: ubuntu-22.04
            os-label: linux-x86_64
            etebase-version: "0.31.5"
            asset-name: silentsuite-bridge-linux-x86_64
            exe-suffix: ""
            qemu: false
            rust-toolchain: "1.63.0"

          # Linux arm64 via QEMU
          - runner: ubuntu-22.04
            os-label: linux-arm64
            etebase-version: "0.31.5"
            asset-name: silentsuite-bridge-linux-arm64
            exe-suffix: ""
            qemu: true
            qemu-arch: aarch64
            rust-toolchain: "1.63.0"

          # macOS x86_64 (Intel)
          - runner: macos-15-intel
            os-label: macos-x86_64
            etebase-version: "0.31.5"
            asset-name: silentsuite-bridge-macos-x86_64
            exe-suffix: ""
            qemu: false
            rust-toolchain: "1.63.0"

          # macOS arm64 (Apple Silicon)
          # PyPI etebase 0.31.5 has no macOS arm64 wheel, and its sdist is
          # missing build.rs, so it fails with `OUT_DIR not defined`. Use the
          # upstream commit that includes build.rs and builds with Rust 1.96.0.
          - runner: macos-15
            os-label: macos-arm64
            etebase-version: "0.31.9"
            asset-name: silentsuite-bridge-macos-arm64
            exe-suffix: ""
            qemu: false
            rust-toolchain: "1.96.0"

          # Windows x86_64
          - runner: windows-latest
            os-label: windows-x86_64
            etebase-version: "0.31.5"
            asset-name: silentsuite-bridge-windows-x86_64.exe
            exe-suffix: ".exe"
            qemu: false
            rust-toolchain: "1.63.0"

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout the admitted commit
      # -----------------------------------------------------------------------
      # An empty `ref` is how actions/checkout is told "the ref that triggered
      # this run", so a dispatch builds what the operator selected while a
      # controller call builds exactly the admitted commit.
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 2. Set up QEMU (arm64 Linux only)
      # -----------------------------------------------------------------------
      # The binfmt image is pinned by digest (the action defaults to :latest).
      # The Actions image cache is off so every run pulls exactly that digest.
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: ${{ matrix.qemu-arch }}
          cache-image: false

      # -----------------------------------------------------------------------
      # 3. Python 3.10
      # -----------------------------------------------------------------------
      # etebase-py 0.31.5 uses cpython 0.7.x which doesn't support Python 3.12+
      - name: Set up Python 3.10
        if: "!matrix.qemu"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      # -----------------------------------------------------------------------
      # 4. Rust (required to build etebase from source if wheels unavailable)
      # -----------------------------------------------------------------------
      # Most lanes stay on Rust 1.63.0 because PyPI etebase 0.31.5 depends on
      # socket2 0.3.12, which fails on Rust >= 1.64. macOS arm64 uses upstream
      # etebase-py instead, whose lockfile requires modern Cargo.
      - name: Install Rust toolchain
        if: "!matrix.qemu"
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust-toolchain }}

      # -----------------------------------------------------------------------
      # 5. Install bridge + PyInstaller (native builds)
      # -----------------------------------------------------------------------
      - name: Install OpenSSL (macOS, non-arm64)
        if: runner.os == 'macOS' && matrix.os-label != 'macos-arm64'
        shell: bash
        run: |
          # etebase-py 0.31.5 uses openssl-sys 0.9.58 which only supports OpenSSL 1.x.
          brew install openssl@1.1 || brew install openssl@1.1 --build-from-source
          echo "OPENSSL_DIR=$(brew --prefix openssl@1.1)" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@1.1)/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@1.1)/include" >> $GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - name: Install dependencies (native)
        if: "!matrix.qemu"
        working-directory: bridge
        shell: bash
        run: |
          # pip and PyInstaller come from the hash-pinned build requirements.
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt
          # The bridge's dependencies (dev and tray extras included) and its build
          # backend come from the hash-locked requirements-lock.txt, which covers
          # every platform this matrix builds. Nothing is resolved from a range.
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-lock.txt
          if [[ "${{ matrix.os-label }}" == "macos-arm64" ]]; then
            # The lock leaves PyPI etebase out on this platform. The pinned
            # upstream commit is built into a wheel in a throwaway virtualenv
            # holding only its hash-locked build tools, so neither an isolated
            # build environment nor the newer setuptools it needs reaches the
            # environment PyInstaller bundles. Its one dependency, msgpack, is
            # already installed from the lock.
            ETEBASE_BUILD="$RUNNER_TEMP/etebase-build"
            python -m venv "$ETEBASE_BUILD/venv"
            "$ETEBASE_BUILD/venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-etebase-build.txt
            "$ETEBASE_BUILD/venv/bin/python" -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --check-build-dependencies -w "$ETEBASE_BUILD/wheel" "git+https://github.com/etesync/etebase-py.git@c5afd1a546b8f030d1b97bcecfc5e8bf9799827b"
            python -m pip install --disable-pip-version-check --no-deps --no-index "$ETEBASE_BUILD"/wheel/etebase-*.whl
          fi
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation --check-build-dependencies -e .
          python -m pip check
          # The binary embeds etebase, the crypto core, so the release must use the
          # reviewed version, never whatever PyPI resolves on the day.
          python -c "import importlib.metadata as m, sys; v = m.version('etebase'); print('etebase', v); sys.exit(0 if v == '${{ matrix.etebase-version }}' else 'ERROR: etebase ' + v + ' is not the reviewed ${{ matrix.etebase-version }}')"

      # -----------------------------------------------------------------------
      # 6. Run PyInstaller (native builds)
      # -----------------------------------------------------------------------
      - name: Build binary (native)
        if: "!matrix.qemu"
        working-directory: bridge
        shell: bash
        run: |
          pyinstaller silentsuite-bridge.spec --clean --noconfirm \
            --distpath dist/ \
            --workpath build/

      # -----------------------------------------------------------------------
      # 7. Smoke test (native builds)
      # -----------------------------------------------------------------------
      - name: Smoke test (native)
        if: "!matrix.qemu"
        working-directory: bridge
        shell: bash
        run: |
          BINARY="dist/silentsuite-bridge${{ matrix.exe-suffix }}"
          echo "--- Smoke test: $BINARY --version ---"
          OUT="$(env -u SILENTSUITE_BRIDGE_VERSION "$BINARY" --version)"
          echo "$OUT"
          EXPECTED_VERSION="${SILENTSUITE_BRIDGE_VERSION#v}"
          if [[ -n "$EXPECTED_VERSION" && "$OUT" != *"$EXPECTED_VERSION"* ]]; then
            echo "ERROR: bridge did not report release version $EXPECTED_VERSION" >&2
            exit 1
          fi
          case "$OUT" in
            *0.1.0*)
              echo "ERROR: bridge reported the stale 0.1.0 version" >&2
              exit 1
              ;;
          esac
          echo "Smoke test passed."

      # -----------------------------------------------------------------------
      # 8. Packaged autostart acceptance (macOS native lanes)
      # -----------------------------------------------------------------------
      # Drives the just-built frozen binary through its real
      # --install-autostart / --remove-autostart lifecycle on a fresh hosted
      # runner, before the binary is renamed below. Only the two native macOS
      # lanes run it; Linux, QEMU and Windows lanes are untouched.
      - name: Packaged autostart acceptance (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        env:
          SILENTSUITE_PACKAGED_BINARY: ${{ github.workspace }}/bridge/dist/silentsuite-bridge
          SILENTSUITE_PACKAGED_ARCH: ${{ matrix.os-label == 'macos-arm64' && 'arm64' || 'x86_64' }}
        run: |
          # The dev extra provides pytest; fail closed here instead of silently
          # skipping the packaged case if it is ever missing.
          if ! python -m pytest --version >/dev/null 2>&1; then
            echo "ERROR: pytest is not available in this build environment; packaged autostart acceptance cannot run." >&2
            exit 1
          fi
          export SILENTSUITE_PACKAGED_VERSION="${SILENTSUITE_BRIDGE_VERSION#v}"
          python -m pytest tests/test_autostart_macos_packaged.py -v --tb=short

      # -----------------------------------------------------------------------
      # 8b. Optional packaged update-check characterization (macOS, manual)
      # -----------------------------------------------------------------------
      # Off unless an operator dispatches this workflow with
      # packaged_update_check=true. Release calls (workflow_call) never define
      # that input, so it is always off for them. One unauthenticated read of
      # the public releases list; --self-update is never run.
      - name: Packaged update-check characterization (macOS, manual)
        if: runner.os == 'macOS' && inputs.packaged_update_check == true
        timeout-minutes: 10
        working-directory: bridge
        shell: bash
        env:
          SILENTSUITE_PACKAGED_UPDATE_CHECK: "1"
          SILENTSUITE_PACKAGED_BINARY: ${{ github.workspace }}/bridge/dist/silentsuite-bridge
          SILENTSUITE_PACKAGED_ARCH: ${{ matrix.os-label == 'macos-arm64' && 'arm64' || 'x86_64' }}
        run: |
          if ! python -m pytest --version >/dev/null 2>&1; then
            echo "ERROR: pytest is not available in this build environment; packaged update check cannot run." >&2
            exit 1
          fi
          export SILENTSUITE_PACKAGED_VERSION="${SILENTSUITE_BRIDGE_VERSION#v}"
          export SILENTSUITE_PACKAGED_SOURCE_SHA="$(git rev-parse HEAD)"
          python -m pytest tests/test_update_macos_packaged.py -v --tb=short -s

      # -----------------------------------------------------------------------
      # 9. QEMU arm64 container build (Linux arm64 only)
      # -----------------------------------------------------------------------
      - name: Build + smoke test (QEMU arm64)
        if: matrix.qemu
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: arm64v8/python:3.10.22-slim-trixie@sha256:92479346bd9cc169c573d3f71b95978521189349051ef1edb56a907a6d8c6ea7
          options: >-
            --platform linux/arm64
            -v ${{ github.workspace }}:/workspace
            -e SILENTSUITE_BRIDGE_VERSION=${{ env.SILENTSUITE_BRIDGE_VERSION }}
          run: |
            set -e
            echo "=== Installing system deps ==="
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              curl build-essential pkg-config libssl-dev git
            echo "=== Installing Rust ==="
            # Pinned rustup-init release, checked against its published sha256
            # before it runs. rustup then verifies the 1.63.0 toolchain itself.
            RUSTUP_VERSION=1.29.3
            RUSTUP_INIT_SHA256=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
            curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/aarch64-unknown-linux-gnu/rustup-init"
            echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --default-toolchain 1.63.0
            rm -f /tmp/rustup-init
            . "$HOME/.cargo/env"
            echo "=== Installing Python deps ==="
            cd /workspace/bridge
            python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt
            python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-lock.txt
            python -m pip install --disable-pip-version-check --no-deps --no-build-isolation --check-build-dependencies -e .
            python -m pip check
            python -c "import importlib.metadata as m, sys; v = m.version('etebase'); print('etebase', v); sys.exit(0 if v == '${{ matrix.etebase-version }}' else 'ERROR: etebase ' + v + ' is not the reviewed ${{ matrix.etebase-version }}')"
            echo "=== Running PyInstaller ==="
            pyinstaller silentsuite-bridge.spec --clean --noconfirm \
              --distpath dist/ \
              --workpath build/
            echo "=== Smoke test ==="
            OUT="$(env -u SILENTSUITE_BRIDGE_VERSION dist/silentsuite-bridge --version)"
            echo "$OUT"
            EXPECTED_VERSION="${SILENTSUITE_BRIDGE_VERSION#v}"
            if [ -n "$EXPECTED_VERSION" ] && ! printf '%s' "$OUT" | grep -F "$EXPECTED_VERSION" >/dev/null; then
              echo "ERROR: bridge did not report release version $EXPECTED_VERSION" >&2
              exit 1
            fi
            case "$OUT" in
              *0.1.0*)
                echo "ERROR: bridge reported the stale 0.1.0 version" >&2
                exit 1
                ;;
            esac
            echo "=== Rename + checksum (inside container to avoid permission issues) ==="
            mv dist/silentsuite-bridge dist/${{ matrix.asset-name }}
            (cd dist && sha256sum "${{ matrix.asset-name }}" > "${{ matrix.asset-name }}.sha256")
            cat dist/${{ matrix.asset-name }}.sha256
            echo "Smoke test passed."

      # -----------------------------------------------------------------------
      # 10. Rename artifact to final asset name (skip for QEMU — done inside container)
      # -----------------------------------------------------------------------
      - name: Rename binary
        if: "!matrix.qemu"
        shell: bash
        run: |
          SRC="bridge/dist/silentsuite-bridge${{ matrix.exe-suffix }}"
          DST="bridge/dist/${{ matrix.asset-name }}"
          mv "$SRC" "$DST"
          echo "Renamed: $SRC → $DST"

      # -----------------------------------------------------------------------
      # 11. Compute SHA256
      # -----------------------------------------------------------------------
      - name: Compute SHA256
        if: "!matrix.qemu"
        shell: bash
        working-directory: bridge/dist
        run: |
          ASSET="${{ matrix.asset-name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            # macOS / Windows fallback
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          cat "${ASSET}.sha256"

      # -----------------------------------------------------------------------
      # 12. Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset-name }}
          path: |
            bridge/dist/${{ matrix.asset-name }}
            bridge/dist/${{ matrix.asset-name }}.sha256
          if-no-files-found: error
          retention-days: 14
