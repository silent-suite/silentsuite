name: Test Bridge desktop tracers (source)

# Source tests for the #171 desktop work, one tracer at a time.
#   T1a: one Bridge server per data directory (bridge/tests/test_instance_lock.py)
#   T3 server URL: settings API default server URL (bridge/tests/test_desktop_settings_api.py)
#   T3 network policy: network field metadata and read-only refusal (bridge/tests/test_desktop_network_settings.py)
#   T2 first window: real native desktop window journey (bridge/tests/test_desktop_shell.py)
#     plus the desktop-flavor updater refusal (bridge/tests/test_desktop_flavor.py)
#   T1b legacy gate: CLI registration / occupied port migration prompt (bridge/tests/test_desktop_migration.py)
#   T2 startup DNS: desktop loopback bind without reverse DNS (bridge/tests/test_desktop_startup_dns.py)
#   T2 IPC: second launch reopens the owner; lock before legacy (bridge/tests/test_desktop_ipc.py)
#   T4 windowed stdio (source simulation): no stdio, default DATA_DIR logs (bridge/tests/test_desktop_windowed.py)
#   T4 start-at-login: registration-only desktop entry, stable-install gate (bridge/tests/test_desktop_autostart.py)
#   T2 lifecycle: close/hide, --background, reopen, native Quit (bridge/tests/test_desktop_lifecycle.py)
#   T3 server-URL UI: dashboard control for the new-sign-in default (bridge/tests/test_desktop_server_url_ui.py)
#   T4 start-at-login UI: dashboard toggle over the desktop registration API (bridge/tests/test_desktop_autostart_ui.py)
# No build, installer, release, credential, account, network sync or autostart state.

on:
  push:
    branches: [feat/bridge-gui-171]
    paths:
      - 'bridge/src/silentsuite_bridge/**'
      - 'bridge/tests/test_instance_lock.py'
      - 'bridge/tests/test_desktop_settings_api.py'
      - 'bridge/tests/test_desktop_network_settings.py'
      - 'bridge/tests/settings_lock_holder.py'
      - 'bridge/tests/test_desktop_shell.py'
      - 'bridge/tests/test_desktop_flavor.py'
      - 'bridge/tests/desktop_smoke/product_probe.py'
      - 'bridge/tests/test_desktop_migration.py'
      - 'bridge/tests/desktop_smoke/migration_probe.py'
      - 'bridge/tests/test_desktop_startup_dns.py'
      - 'bridge/tests/desktop_smoke/startup_dns_probe.py'
      - 'bridge/tests/test_desktop_ipc.py'
      - 'bridge/tests/desktop_smoke/ipc_probe.py'
      - 'bridge/tests/test_desktop_windowed.py'
      - 'bridge/tests/desktop_smoke/windowed_probe.py'
      - 'bridge/tests/test_desktop_autostart.py'
      - 'bridge/tests/desktop_smoke/autostart_probe.py'
      - 'bridge/tests/test_desktop_lifecycle.py'
      - 'bridge/tests/desktop_smoke/lifecycle_probe.py'
      - 'bridge/tests/test_desktop_server_url_ui.py'
      - 'bridge/tests/desktop_smoke/server_url_ui_probe.py'
      - 'bridge/tests/test_desktop_autostart_ui.py'
      - 'bridge/tests/desktop_smoke/autostart_ui_probe.py'
      - 'bridge/tests/desktop_smoke/requirements.txt'
      - 'bridge/tests/conftest.py'
      - 'bridge/pyproject.toml'
      - '.github/workflows/test-bridge-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-desktop-tracers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t1a:
    name: Desktop tracers (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: linux-x86_64
            rust: "1.63.0"
            etebase_git: false
          - runner: macos-15
            label: macos-arm64
            rust: "1.96.0"
            etebase_git: true
          - runner: windows-latest
            label: windows-x86_64
            rust: "1.63.0"
            etebase_git: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # etebase-py 0.31.5 uses cpython 0.7.x which doesn't support Python 3.12+
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install dependencies
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.etebase_git }}" = "true" ]; then
            # Mirrors test-bridge-macos.yml: no PyPI etebase arm64 wheel.
            pip install "git+https://github.com/etesync/etebase-py.git@c5afd1a546b8f030d1b97bcecfc5e8bf9799827b"
          fi
          pip install -e ".[dev]" || pip install -e .
          pip install pytest

      # A failure here is a missing prerequisite, not a behavioural RED.
      - name: Check test prerequisites
        id: prereq
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          python -c "import pytest, radicale, appdirs; import silentsuite_bridge.__main__, silentsuite_bridge.config; print('prerequisites ok')"

      - name: Run T1a instance-lock tests
        timeout-minutes: 10
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t1a"
          python -m pytest tests/test_instance_lock.py -v --tb=long -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/t1a/junit.xml" 2>&1 | tee "$RUNNER_TEMP/t1a/pytest.txt"
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t1a/pytest.txt"
          exit "$status"

      # Runs even when T1a failed, so each tracer reports its own result, but
      # never after a prerequisite failure (that is not a behavioural RED).
      - name: Run T3 server-URL settings tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t3-server-url"
          python -m pytest tests/test_desktop_settings_api.py -v --tb=long -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/t3-server-url/junit.xml" 2>&1 | tee "$RUNNER_TEMP/t3-server-url/pytest.txt"
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t3-server-url/pytest.txt"
          exit "$status"

      - name: Upload T3 server-URL receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t3-server-url-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t3-server-url/junit.xml
            ${{ runner.temp }}/t3-server-url/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload T1a receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1a-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t1a/junit.xml
            ${{ runner.temp }}/t1a/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      # Real headless CLI starts on loopback; no Qt. Its own step and receipt.
      - name: Run T3 network settings policy tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t3-network-policy"
          python -m pytest tests/test_desktop_network_settings.py -v --tb=long -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/t3-network-policy/junit.xml" 2>&1 | tee "$RUNNER_TEMP/t3-network-policy/pytest.txt"
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t3-network-policy/pytest.txt"
          exit "$status"

      - name: Upload T3 network settings policy receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t3-network-policy-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t3-network-policy/junit.xml
            ${{ runner.temp }}/t3-network-policy/pytest.txt
          if-no-files-found: warn
          retention-days: 14

  # Required native job: a missing PySide6 or display fails here, it never skips.
  # macOS x86_64 is not in this matrix; T0 covered it for framework feasibility only.
  t2-native:
    name: T2 desktop window (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: linux-x86_64
            rust: "1.63.0"
            etebase_git: false
          - runner: macos-15
            label: macos-arm64
            rust: "1.96.0"
            etebase_git: true
          - runner: windows-latest
            label: windows-x86_64
            rust: "1.63.0"
            etebase_git: false
    env:
      # Same probe-only rendering flag T0 used; the Chromium sandbox stays on.
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      SILENTSUITE_REQUIRE_DESKTOP_NATIVE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Linux display and Qt runtime libraries (runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Same list the T0 probe workflow proved on this runner image.
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libegl1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libasound2

      - name: Install dependencies
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.etebase_git }}" = "true" ]; then
            pip install "git+https://github.com/etesync/etebase-py.git@c5afd1a546b8f030d1b97bcecfc5e8bf9799827b"
          fi
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
          # PySide6 pin shared with the T0 probe.
          pip install -r tests/desktop_smoke/requirements.txt

      # A failure here is a missing prerequisite, not a behavioural RED.
      - name: Check native test prerequisites
        id: prereq
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          python -c "import pytest, radicale, PySide6; from PySide6.QtWebEngineWidgets import QWebEngineView; import silentsuite_bridge.__main__; print('PySide6', PySide6.__version__)"

      - name: Run T2 desktop window and flavor tests
        if: ${{ steps.prereq.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t2-window"
          cmd=(python -m pytest tests/test_desktop_shell.py tests/test_desktop_flavor.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t2-window/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t2-window/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t2-window/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t2-window/pytest.txt"
          exit "$status"

      - name: Upload T2 receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-window-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t2-window/junit.xml
            ${{ runner.temp }}/t2-window/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      # Runs even when T2 failed, so each tracer reports its own result, but
      # never after a prerequisite failure (that is not a behavioural RED).
      - name: Run T1b legacy-gate tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t1b-migration"
          cmd=(python -m pytest tests/test_desktop_migration.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t1b-migration/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t1b-migration/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t1b-migration/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t1b-migration/pytest.txt"
          exit "$status"

      - name: Upload T1b receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1b-migration-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t1b-migration/junit.xml
            ${{ runner.temp }}/t1b-migration/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      # Its own step and receipt, so its result reads apart from T2 and T1b.
      - name: Run T2 startup-DNS tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t2-startup-dns"
          cmd=(python -m pytest tests/test_desktop_startup_dns.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t2-startup-dns/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t2-startup-dns/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t2-startup-dns/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t2-startup-dns/pytest.txt"
          exit "$status"

      - name: Upload T2 startup-DNS receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-startup-dns-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t2-startup-dns/junit.xml
            ${{ runner.temp }}/t2-startup-dns/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      # Its own step and receipt, so its result reads apart from the other tracers.
      - name: Run T2 IPC tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t2-ipc"
          cmd=(python -m pytest tests/test_desktop_ipc.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t2-ipc/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t2-ipc/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t2-ipc/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t2-ipc/pytest.txt"
          exit "$status"

      - name: Upload T2 IPC receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-ipc-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t2-ipc/junit.xml
            ${{ runner.temp }}/t2-ipc/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      # Its own step and receipt, so its result reads apart from the other tracers.
      - name: Run T4 windowed-stdio tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t4-windowed"
          cmd=(python -m pytest tests/test_desktop_windowed.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t4-windowed/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t4-windowed/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t4-windowed/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t4-windowed/pytest.txt"
          exit "$status"

      - name: Upload T4 windowed-stdio receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t4-windowed-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/t4-windowed/junit.xml
            ${{ runner.temp }}/t4-windowed/pytest.txt
          if-no-files-found: warn
          retention-days: 14

      # Linux only: an EMPTY, inert file at the planned installed path, owned by
      # the runner user. Refuses if anything already exists there; never executed.
      - name: Create inert Linux installed-path fixture (T4 start-at-login)
        id: t4_opt
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          dir=/opt/silentsuite-bridge
          file="$dir/silentsuite-bridge-desktop"
          if [ -e "$dir" ] || [ -L "$dir" ]; then
            echo "::error::$dir already exists on this runner; refusing to touch it"
            exit 1
          fi
          # mkdir fails if anything appeared meanwhile; record ownership the moment it succeeds.
          sudo mkdir "$dir"
          echo "dir_created=1" >> "$GITHUB_OUTPUT"
          echo "dir_inode=$(stat -c %i "$dir")" >> "$GITHUB_OUTPUT"
          sudo chown "$(id -u):$(id -g)" "$dir"
          sudo chmod 0755 "$dir"
          # O_EXCL-style: refuse if the file exists; empty, never executed.
          ( set -o noclobber; : > "$file" )
          echo "file_created=1" >> "$GITHUB_OUTPUT"
          echo "file_inode=$(stat -c %i "$file")" >> "$GITHUB_OUTPUT"
          chmod 0755 "$file"

      # Its own step and receipt, so its result reads apart from the other tracers.
      - name: Run T4 desktop start-at-login tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t4-autostart"
          cmd=(python -m pytest tests/test_desktop_autostart.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t4-autostart/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t4-autostart/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t4-autostart/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t4-autostart/pytest.txt"
          exit "$status"

      # Same owned inert /opt fixture lifetime as the step above (created and
      # inode-recorded by t4_opt, removed by the guarded cleanup step below);
      # the probe only lstat()s it and checks the recorded inode, never writes it.
      - name: Run T4 start-at-login UI tests
        if: ${{ !cancelled() && steps.prereq.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: bridge
        shell: bash
        env:
          T4_OPT_FILE_INODE: ${{ steps.t4_opt.outputs.file_inode }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/t4-autostart-ui"
          cmd=(python -m pytest tests/test_desktop_autostart_ui.py -v --tb=long -p no:cacheprovider
               --junitxml="$RUNNER_TEMP/t4-autostart-ui/junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t4-autostart-ui/pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$RUNNER_TEMP/t4-autostart-ui/pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$RUNNER_TEMP/t4-autostart-ui/pytest.txt"
          exit "$status"

      # Removes only what the create step recorded as its own, after checking
      # identity. Never rm -rf; any mismatch or leftover fails this step.
      - name: Remove inert Linux installed-path fixture
        if: ${{ always() && steps.t4_opt.outputs.dir_created == '1' }}
        shell: bash
        env:
          FILE_CREATED: ${{ steps.t4_opt.outputs.file_created }}
          FILE_INODE: ${{ steps.t4_opt.outputs.file_inode }}
          DIR_INODE: ${{ steps.t4_opt.outputs.dir_inode }}
        run: |
          set -uo pipefail
          dir=/opt/silentsuite-bridge
          file="$dir/silentsuite-bridge-desktop"
          status=0
          if [ "${FILE_CREATED:-}" = "1" ]; then
            if [ -f "$file" ] && [ ! -L "$file" ] && [ ! -s "$file" ] \
               && [ "$(stat -c %i "$file")" = "${FILE_INODE:-}" ] && [ "$(stat -c %u "$file")" = "$(id -u)" ]; then
              rm -- "$file" || status=1
            else
              echo "::error::$file is not the inert file this job created; left in place"
              status=1
            fi
          fi
          if [ -d "$dir" ] && [ ! -L "$dir" ] && [ "$(stat -c %i "$dir")" = "${DIR_INODE:-}" ]; then
            sudo rmdir -- "$dir" || { echo "::error::$dir is not empty; left in place"; status=1; }
          else
            echo "::error::$dir is not the directory this job created; left in place"
            status=1
          fi
          exit "$status"

