name: Preview Docs (main)

# Runs only for main: its Cloudflare token lives in the docs-preview
# environment, whose branch policy admits main only, so branch pushes never
# receive it. Branch docs changes are previewed after they reach main.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'apps/web/**'
      - 'docs/**'
      - 'android/**'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-billing-copy*.mjs'
      - '.github/workflows/**'
      - '.github/workflows/preview-docs.yml'

concurrency:
  group: preview-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # docs-preview admits main only; the production docs token lives only in
    # docs-production.
    environment: docs-preview
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce annual billing copy
        run: pnpm run check:billing-copy

      - name: Test Android distribution documentation
        run: pnpm --filter @silentsuite/docs test:android-distribution

      - name: Build docs
        run: pnpm run build --filter=@silentsuite/docs

      - name: Deploy to preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: '4'
          command: deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The URL goes to the run summary, not a PR comment: each new bot
      # comment emails the PR's participants on every routine success.
      - name: Record preview URL in the run summary
        run: echo "**Docs preview deployed** to https://silentsuite-docs-preview.workers.dev (commit \`${GITHUB_SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
