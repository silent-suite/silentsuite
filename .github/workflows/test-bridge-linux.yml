name: Test Bridge (Linux x86_64)

on:
  workflow_dispatch:
    inputs:
      baseline_red_sha:
        description: >-
          Optional full commit SHA of pre-fix base source. When set, the
          candidate's tests/test_autostart_clean_shell_cli.py is run against
          that base's bridge/src (git archive into a temp dir) and must FAIL
          with an assertion mismatch, proving behavioural RED for #658.
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - 'bridge/**'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'

jobs:
  test:
    name: Bridge Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.63.0"

      - name: Install dependencies
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest

      - name: Run tests
        working-directory: bridge
        run: python -m pytest tests/ -v --tb=short

      - name: Baseline RED proof for #658 (dispatch-only)
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_red_sha != ''
        env:
          BASE_SHA: ${{ inputs.baseline_red_sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          base="$(mktemp -d)"
          git archive "$BASE_SHA" bridge/src | tar -x -C "$base"
          mkdir -p "$base/bridge/tests"
          cp bridge/tests/test_autostart_clean_shell_cli.py "$base/bridge/tests/"
          cd "$base/bridge"
          set +e
          PYTHONPATH="$base/bridge/src" python -m pytest tests/test_autostart_clean_shell_cli.py \
            -k remote-with-persisted-permission -p no:cacheprovider -v --tb=long 2>&1 | tee red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::base $BASE_SHA passed the remote persistence test; RED proof failed"; exit 1
          fi
          grep -q "1 failed" red.log || { echo "::error::expected exactly one behavioural failure, not a collection/import error"; exit 1; }
          grep -Eq "assert '127.0.0.1' == '0.0.0.0'|AssertionError" red.log || { echo "::error::failure was not an assertion mismatch"; exit 1; }
          grep -Eq "ImportError|ModuleNotFoundError|ERROR collecting" red.log && { echo "::error::collection/import failure, not behavioural RED"; exit 1; }
          echo "Behavioural RED confirmed on base $BASE_SHA"

  build:
    name: Build linux-x86_64
    runs-on: ubuntu-22.04
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # etebase-py 0.31.5 uses cpython 0.7.x which doesn't support Python 3.12+
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.63.0"

      - name: Install dependencies
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[dev,tray]" || pip install -e ".[tray]" || pip install -e .

      - name: Build binary
        working-directory: bridge
        run: |
          pyinstaller silentsuite-bridge.spec --clean --noconfirm \
            --distpath dist/ \
            --workpath build/

      - name: Smoke test
        working-directory: bridge
        run: |
          dist/silentsuite-bridge --version
          dist/silentsuite-bridge --help

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-bridge-linux-x86_64-test
          path: bridge/dist/silentsuite-bridge
          if-no-files-found: error
          retention-days: 7
