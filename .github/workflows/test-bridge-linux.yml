name: Test Bridge (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'

# A newer push to the same pull request cancels its superseded run. Every other
# event gets a group of its own run, so main pushes and manual dispatches are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Bridge Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest

      - name: Run tests
        working-directory: bridge
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Build linux-x86_64
    runs-on: ubuntu-22.04
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same hash-locked install as the release build, so a pull request that
      # changes the lock also proves it installs.
      - name: Install dependencies
        working-directory: bridge
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation --check-build-dependencies -e .
          python -m pip check

      - name: Build binary
        working-directory: bridge
        run: |
          pyinstaller silentsuite-bridge.spec --clean --noconfirm \
            --distpath dist/ \
            --workpath build/

      - name: Smoke test
        working-directory: bridge
        run: |
          dist/silentsuite-bridge --version
          dist/silentsuite-bridge --help
          SILENTSUITE_DATA_DIR="$(mktemp -d)" dist/silentsuite-bridge --list-accounts | grep -F "No accounts configured."
          python scripts/check_frozen_etebase.py dist/silentsuite-bridge

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-bridge-linux-x86_64-test
          path: bridge/dist/silentsuite-bridge
          if-no-files-found: error
          retention-days: 7
