name: Test Bridge (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'bridge/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'bridge/**'

jobs:
  test:
    name: Bridge Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.63.0"

      - name: Install dependencies
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest

      - name: Run tests
        working-directory: bridge
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Build linux-x86_64
    runs-on: ubuntu-22.04
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # etebase-py 0.31.5 uses cpython 0.7.x which doesn't support Python 3.12+
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.63.0"

      - name: Install dependencies
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[dev,tray]" || pip install -e ".[tray]" || pip install -e .

      - name: Build binary
        working-directory: bridge
        run: |
          pyinstaller silentsuite-bridge.spec --clean --noconfirm \
            --distpath dist/ \
            --workpath build/

      - name: Smoke test
        working-directory: bridge
        run: |
          dist/silentsuite-bridge --version
          dist/silentsuite-bridge --help

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-bridge-linux-x86_64-test
          path: bridge/dist/silentsuite-bridge
          if-no-files-found: error
          retention-days: 7
