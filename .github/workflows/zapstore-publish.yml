name: Zapstore Publication

# Dormant publication lane for the Android app on Zapstore. See
# runbooks/zapstore-automation.md for the surface map, activation checklist,
# retry and rollback procedures.
#
# This is not a second GitHub-release control plane. The release controller
# remains the only `repository_dispatch` workflow. Triggers:
#   * schedule — default-branch load; enumerates exact published release ids
#     (covers GITHUB_TOKEN-suppressed events and late APK attachment)
#   * release published/edited — default-branch YAML; owner sender id compared
#     before the release id is used. Exact on-demand retry. Every checkout is
#     `refs/heads/main`, never `github.sha` or `github.workflow_sha` (those name
#     the tag on release events). `workflow_dispatch` is not used (selected-ref
#     load). Controller integration is not used (would re-run Android signing).
#
# Disabled by default: the repository variable ZAPSTORE_AUTOMATION_ENABLED does
# not exist. Creating it, the zapstore-production environment, and its two
# secrets are separate owner actions.

on:
  schedule:
    - cron: '17 4 * * *'
  release:
    types: [published, edited]

# One group for the whole publisher/app: two releases must never publish
# concurrently. Never cancels; a pending run GitHub discards is picked up by the
# next scheduled reconciliation.
concurrency:
  group: zapstore-publish-io-silentsuite-android
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: '22'

jobs:
  admit:
    name: Admit the trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      active: ${{ steps.admit.outputs.active }}
      rehearsal: ${{ steps.admit.outputs.rehearsal }}
      mode: ${{ steps.admit.outputs.mode }}
      release_id: ${{ steps.admit.outputs.release_id }}
      release_tag: ${{ steps.admit.outputs.release_tag }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - name: Check out the protected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide activation, sender and payload
        id: admit
        env:
          ZAPSTORE_AUTOMATION_ENABLED: ${{ vars.ZAPSTORE_AUTOMATION_ENABLED }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          SENDER_ID: ${{ github.event.sender.id }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: node scripts/zapstore/cli.mjs admit

  enumerate:
    name: Enumerate exact releases
    needs: admit
    if: needs.admit.outputs.active == 'true' || needs.admit.outputs.rehearsal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      count: ${{ steps.enumerate.outputs.count }}
      matrix: ${{ steps.enumerate.outputs.matrix }}
    steps:
      - name: Check out the protected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: List and classify published releases by exact id
        id: enumerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.admit.outputs.mode }}
          RELEASE_ID: ${{ needs.admit.outputs.release_id }}
        run: node scripts/zapstore/cli.mjs enumerate --mode "$MODE" --release-id "$RELEASE_ID" --out "$RUNNER_TEMP/candidates.json"

  publish:
    name: Reconcile and publish ${{ matrix.tag }}
    needs: [admit, enumerate]
    if: needs.admit.outputs.active == 'true' && needs.enumerate.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: zapstore-production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.enumerate.outputs.matrix) }}
    steps:
      - name: Check out the protected workflow revision with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the isolated verification package
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/zapstore

      - name: Fetch and pin the official publisher
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/zsp" \
            https://github.com/zapstore/zsp/releases/download/v0.4.17/zsp-0.4.17-linux-amd64
          echo "3f241da6a5dc7a85fe851d3b42b77790b651bd36c7029382a701262bda832d20  $RUNNER_TEMP/zsp" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/zsp"
          "$RUNNER_TEMP/zsp" --version

      - name: Install apksigner from the fixed build-tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ] \
            || { echo "fixed Android sdkmanager is missing or not executable" >&2; exit 1; }
          # Not an infinite yes-pipe into sdkmanager licenses: sdkmanager stops
          # reading once the prompts are answered, the producer takes SIGPIPE,
          # and under pipefail the pipeline returns 141 and kills the step. A
          # regular file has no writer to signal, so the acceptance is deterministic.
          for _ in $(seq 100); do echo y; done > /tmp/sdk-license-acceptance
          "$SDKMANAGER" --licenses < /tmp/sdk-license-acceptance > /dev/null
          "$SDKMANAGER" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Bind the exact release, tag commit and assets
        id: bind
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ matrix.release_id }}
          RELEASE_TAG: ${{ matrix.tag }}
          TRIGGER_TAG: ${{ needs.admit.outputs.release_tag }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "$TRIGGER_TAG" ]; then EXTRA+=(--tag "$TRIGGER_TAG"); fi
          node scripts/zapstore/cli.mjs bind --release-id "$RELEASE_ID" "${EXTRA[@]}" \
            --git-ancestry "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/binding.json"

      - name: Download the bound APK and check all three digests
        id: apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/zapstore/cli.mjs fetch-apk --binding "$RUNNER_TEMP/binding.json" --out-dir "$RUNNER_TEMP/apk"

      - name: Verify the APK signature with apksigner
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs -v "$APK_PATH" > "$RUNNER_TEMP/apksigner.txt"
          node scripts/zapstore/cli.mjs verify-apksigner --output "$RUNNER_TEMP/apksigner.txt"

      - name: Generate the exact-release configuration and expected events
        id: prepare
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          node scripts/zapstore/cli.mjs prepare \
            --binding "$RUNNER_TEMP/binding.json" --apk "$APK_PATH" \
            --zsp "$RUNNER_TEMP/zsp" --source-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/prepare"

      - name: Reconcile against the relay before signing
        id: reconcile
        env:
          MODE: ${{ needs.admit.outputs.mode }}
        run: node scripts/zapstore/cli.mjs reconcile --mode "$MODE" --expected "$RUNNER_TEMP/prepare/expected-events.jsonl" --out "$RUNNER_TEMP/reconcile.json"

      - name: Revalidate the release identity immediately before signing
        if: steps.reconcile.outputs.action == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: node scripts/zapstore/cli.mjs revalidate --binding "$RUNNER_TEMP/binding.json" --apk "$APK_PATH" --git-ancestry "$GITHUB_WORKSPACE"

      # The only step that can see signer credentials. Raw signer output goes to
      # the runner temp directory; the client key is written 0600 and removed in
      # a finally block inside the script and again by the trap below.
      - name: Sign and publish with the pinned publisher
        id: sign
        if: steps.reconcile.outputs.action == 'publish'
        env:
          ZAPSTORE_SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          ZAPSTORE_BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          CONFIG_PATH: ${{ steps.prepare.outputs.config_path }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/publish/xdg"' EXIT
          node scripts/zapstore/cli.mjs publish --binding "$RUNNER_TEMP/binding.json" --config "$CONFIG_PATH" --zsp "$RUNNER_TEMP/zsp" --work-dir "$RUNNER_TEMP/publish"

      - name: Read back the published events
        id: readback
        if: always() && (steps.sign.outcome == 'success' || steps.sign.outcome == 'failure')
        run: node scripts/zapstore/cli.mjs reconcile --readback --expected "$RUNNER_TEMP/prepare/expected-events.jsonl" --out "$RUNNER_TEMP/readback.json"

      - name: Verify CDN bytes on complete-match
        id: cdn
        if: always() && (steps.reconcile.outputs.outcome == 'complete-match' || steps.readback.outputs.outcome == 'complete-match')
        run: node scripts/zapstore/cli.mjs verify-cdn --expected "$RUNNER_TEMP/prepare/expected-events.jsonl" --out "$RUNNER_TEMP/cdn.json"

      - name: Record candidate outcome
        if: always()
        env:
          RELEASE_ID: ${{ matrix.release_id }}
          RELEASE_TAG: ${{ matrix.tag }}
          PUBLISH_ATTEMPTED: ${{ steps.sign.outcome == 'success' || steps.sign.outcome == 'failure' }}
          SIGN_EXIT: ${{ steps.sign.outputs.sign_exit }}
        run: |
          set -euo pipefail
          node scripts/zapstore/cli.mjs record-result \
            --binding "$RUNNER_TEMP/binding.json" \
            --reconcile "$RUNNER_TEMP/reconcile.json" \
            --readback "$RUNNER_TEMP/readback.json" \
            --out "$RUNNER_TEMP/result.json"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zapstore-evidence-${{ matrix.release_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/binding.json
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/readback.json
            ${{ runner.temp }}/cdn.json
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/prepare/release-manifest.json
            ${{ runner.temp }}/prepare/expected-events.jsonl

  notify:
    name: Open a failure issue
    needs: [admit, enumerate, publish]
    if: always() && needs.admit.outputs.active == 'true' && (needs.enumerate.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check out the protected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download candidate evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zapstore-evidence-*
          merge-multiple: false
          path: ${{ runner.temp }}/evidence
      - name: Create and read back the issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.admit.outputs.release_id }}
          RELEASE_TAG: ${{ needs.admit.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          FAILED_PHASE: ${{ needs.publish.result == 'failure' && 'publish' || 'enumerate' }}
          OUTCOME: failure
          DETAIL: See the run for the redacted step output and the uploaded reconciliation evidence.
        run: node scripts/zapstore/cli.mjs notify --results-dir "$RUNNER_TEMP/evidence"
