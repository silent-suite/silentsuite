name: Test Bridge desktop relinking control (receipts only)

# Q7 relinking control for #171 (qt assessment.r2.md section 4). Per platform:
# build the canonical desktop bundle as the frozen workflow does; rebuild one
# Qt library L from the held, SHA256-verified qt-everywhere-src-6.12.0 with the
# publisher's recorded qtbase configure options and one source change (a
# load-time constructor writing this run's nonce to SILENTSUITE_RELINK_WITNESS);
# pack the bundle into a package-shaped archive and extract it twice; swap L
# into one extraction; run the unchanged frozen startup tests against it; then
# require the witness line and the OS loaded-module record (L at its bundle path
# with the modified SHA256), with the unmodified extraction as the negative
# control. This is the pre-admission compatibility evidence; the caller's package
# job runs the same control on its exact archive before any upload.
# L: libQt6XcbQpa.so.6 (linux-x86_64), qwindows.dll (windows-x86_64).
# Only text receipts are uploaded. No bundle, library, binary or source archive
# leaves the job; nothing is signed, released or published. No secrets.

on:
  push:
    branches: [feat/bridge-gui-171]
    paths:
      - '.github/workflows/test-bridge-desktop-relink.yml'
      - 'bridge/dev-build/relink_control.py'
      - 'bridge/entrypoint_desktop.py'
      - 'bridge/silentsuite-bridge-desktop.spec'
      - 'bridge/tests/test_desktop_frozen.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      caller:
        description: Name of the calling workflow; keeps called and standalone runs in separate concurrency groups.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bridge-desktop-relink-${{ inputs.caller || 'standalone' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_SOURCE_URL: https://download.qt.io/official_releases/qt/6.12/6.12.0/single/qt-everywhere-src-6.12.0.tar.xz
  QT_SOURCE_SHA256: 98ff4f44bac6ec3e1e62ee2a4316ae0e3d15badb015d753cc0268a20db52f165

jobs:
  relink:
    name: Relinking control (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: linux-x86_64
            sdk_url: https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346qtbase-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z
            sdk_sha256: 943023b929d0c08eafe7341700b5ed7601284410b7afd6093f950be291d1d7cd
          - runner: windows-latest
            label: windows-x86_64
            sdk_url: https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64/qt.qt6.6120.win64_msvc2022_64/6.12.0-0-202609280346qtbase-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z
            sdk_sha256: 219d1b86def3be418e31d704572bc4acc91b2ec373c65595c9fb12b42bf098dc
    env:
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      SILENTSUITE_REQUIRE_DESKTOP_FROZEN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.63.0"

      - name: Install Linux display and Qt runtime libraries (runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Same list as the frozen workflow; the qtbase build inputs come after the bundle build.
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libegl1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libasound2

      - name: Install dependencies
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest ninja==1.13.0
          pip install -r tests/desktop_smoke/requirements.txt
          pip install pyinstaller

      - name: Build bundler control and canonical desktop app
        id: build
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/frozen"
          q7="$RUNNER_TEMP/q7"
          rm -rf "$out" "$q7"
          mkdir -p "$out" "$q7"
          python -m PyInstaller --version > "$out/pyinstaller-version.txt"
          python -m PyInstaller --noconfirm --onedir --name t0-probe \
            --distpath "$out/t0-dist" --workpath "$out/t0-build" --specpath "$out/t0-spec" \
            bridge/tests/desktop_smoke/probe.py > "$out/t0-build.log" 2>&1
          echo $? > "$out/t0-build.rc"
          (cd bridge && python -m PyInstaller silentsuite-bridge-desktop.spec --noconfirm --clean \
            --distpath "$out/dist" --workpath "$out/build") > "$out/canonical-build.log" 2>&1
          echo $? > "$out/canonical-build.rc"
          name=$(cd "$out/dist" && ls)
          [ "$(echo "$name" | wc -l)" = "1" ] || { echo "expected one bundle in dist"; exit 1; }
          echo "bundle=$name" >> "$GITHUB_OUTPUT"
          site=$(python -c "import os, PySide6; print(os.path.dirname(PySide6.__file__))")
          echo "pyside=$site" >> "$GITHUB_OUTPUT"
          python -c "import secrets; print('nonce=' + secrets.token_hex(16))" >> "$GITHUB_OUTPUT"

      - name: Fetch and extract the held Qt source, add the witness constructor
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/qt-src.tar.xz" "$QT_SOURCE_URL"
          python bridge/dev-build/relink_control.py extract --archive "$RUNNER_TEMP/qt-src.tar.xz" \
            --sha256 "$QT_SOURCE_SHA256" --dest "$RUNNER_TEMP/qs" --receipt "$q7/extract.json"
          rm -f "$RUNNER_TEMP/qt-src.tar.xz"
          python bridge/dev-build/relink_control.py patch --qtbase "$RUNNER_TEMP/qs/qt-everywhere-src-6.12.0/qtbase" \
            --platform "${{ matrix.label }}" --nonce "${{ steps.build.outputs.nonce }}" --receipt "$q7/patch.json"

      # The publisher's qtbase options and the build of L live in relink_control.py
      # (CONFIGURE, LINUX_BUILD_PACKAGES), shared with the caller's package job.
      - name: Configure qtbase and build L
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends $(python bridge/dev-build/relink_control.py apt-packages)
          fi
          python bridge/dev-build/relink_control.py build --qtbase "$RUNNER_TEMP/qs/qt-everywhere-src-6.12.0/qtbase" \
            --build-dir "$RUNNER_TEMP/qb" --platform "${{ matrix.label }}" --prefix "$RUNNER_TEMP/qt-prefix" \
            --log "$q7/build.log" --receipt "$q7/build.json" || { tail -80 "$q7/build.log"; exit 1; }

      # Evidence only: the generated Qt config headers against the publisher SDK's.
      - name: Compare generated config headers with the publisher SDK
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sdk.7z" "${{ matrix.sdk_url }}"
          echo "${{ matrix.sdk_sha256 }}  $RUNNER_TEMP/sdk.7z" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/sdk" "$RUNNER_TEMP/sdk.7z" > /dev/null
          header=$(find "$RUNNER_TEMP/sdk" -type f -path "*/include/QtCore/qtcore-config.h" | head -1)
          [ -n "$header" ] || { echo "no qtcore-config.h in the SDK archive"; exit 1; }
          python bridge/dev-build/relink_control.py configdiff --sdk-include "$(dirname "$(dirname "$header")")" \
            --build-include "$RUNNER_TEMP/qb/include" --receipt "$q7/configdiff.json"

      # A package-shaped archive (program folder beside a NOTICES folder, tar.gz on Linux,
      # zip on Windows, as the caller's archive step writes) goes through the same
      # extraction the caller's package job uses on its exact archive.
      - name: Swap L into an extraction of a package-shaped archive
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          bundle="${{ steps.build.outputs.bundle }}"
          root="$RUNNER_TEMP/pkg-root"
          rm -rf "$RUNNER_TEMP/relink" "$root" "$RUNNER_TEMP/pkg-out"
          mkdir -p "$root/NOTICES" "$RUNNER_TEMP/pkg-out"
          echo "package-shaped archive for the standalone Q7 control" > "$root/NOTICES/README.txt"
          cp -R "$RUNNER_TEMP/frozen/dist/$bundle" "$root/$bundle"
          if [ "$RUNNER_OS" = "Linux" ]; then
            archive="$RUNNER_TEMP/pkg-out/q7-package.tar.gz"
            tar -czf "$archive" -C "$root" .
          else
            python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', sys.argv[2])" \
              "$RUNNER_TEMP/pkg-out/q7-package" "$root"
            archive="$RUNNER_TEMP/pkg-out/q7-package.zip"
          fi
          python bridge/dev-build/relink_control.py package --archive "$archive" --frozen-out "$RUNNER_TEMP/frozen" \
            --dest "$RUNNER_TEMP/relink" --receipt "$q7/package.json"
          if [ "$RUNNER_OS" = "Linux" ]; then
            member="${{ steps.build.outputs.pyside }}/Qt/lib/libQt6XcbQpa.so.6"
          else
            member="${{ steps.build.outputs.pyside }}/plugins/platforms/qwindows.dll"
          fi
          python bridge/dev-build/relink_control.py swap \
            --bundle "$RUNNER_TEMP/relink/modified/frozen/dist/$bundle" \
            --platform "${{ matrix.label }}" \
            --modified "$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['output_path'])" "$q7/build.json")" \
            --wheel-member "$member" --receipt "$q7/swap.json"

      - name: Run the unchanged frozen startup tests against the modified bundle
        timeout-minutes: 25
        working-directory: bridge
        shell: bash
        env:
          SILENTSUITE_FROZEN_OUT: ${{ runner.temp }}/relink/modified/frozen
        run: |
          set -uo pipefail
          q7="$RUNNER_TEMP/q7"
          cmd=(python -m pytest tests/test_desktop_frozen.py -v --tb=long -p no:cacheprovider
               --junitxml="$q7/frozen-modified-junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$q7/frozen-modified-pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$q7/frozen-modified-pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$q7/frozen-modified-pytest.txt"
          exit "$status"

      - name: Load witness (modified) and negative control (unmodified)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          bundle="${{ steps.build.outputs.bundle }}"
          wrap=()
          if [ "$RUNNER_OS" = "Linux" ]; then wrap=(xvfb-run -a -s "-screen 0 1280x800x24"); fi
          modified_sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['modified_sha256'])" "$q7/swap.json")
          original_sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['original_sha256'])" "$q7/swap.json")
          status=0
          "${wrap[@]}" python bridge/dev-build/relink_control.py witness --bundle "$RUNNER_TEMP/relink/modified/frozen/dist/$bundle" \
            --platform "${{ matrix.label }}" --root "$RUNNER_TEMP/w-modified" --expect-sha256 "$modified_sha" \
            --nonce "${{ steps.build.outputs.nonce }}" --receipt "$q7/witness-modified.json" || status=1
          "${wrap[@]}" python bridge/dev-build/relink_control.py witness --bundle "$RUNNER_TEMP/relink/original/$bundle" \
            --platform "${{ matrix.label }}" --root "$RUNNER_TEMP/w-original" --expect-sha256 "$original_sha" \
            --negative-control --receipt "$q7/witness-negative.json" || status=1
          echo "nonce ${{ steps.build.outputs.nonce }}" >> "$q7/recipe.txt"
          exit "$status"

      # Receipts only: JSON, text and logs. Never the bundle or the modified L.
      - name: Upload relinking control receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q7-relink-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/q7/*.json
            ${{ runner.temp }}/q7/*.txt
            ${{ runner.temp }}/q7/*.xml
            ${{ runner.temp }}/q7/*.log
          if-no-files-found: warn
          retention-days: 14
