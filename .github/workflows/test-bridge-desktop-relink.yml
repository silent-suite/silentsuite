name: Test Bridge desktop relinking control (receipts only)

# Q7 relinking control for #171 (qt assessment.r2.md section 4). Per platform:
# build the canonical desktop bundle as the frozen workflow does; rebuild one
# Qt library L from the held, SHA256-verified qt-everywhere-src-6.12.0 with the
# publisher's recorded qtbase configure options and one source change (a
# load-time constructor writing this run's nonce to SILENTSUITE_RELINK_WITNESS);
# swap L into a tar round-trip copy of the build; run the unchanged frozen
# startup tests against that copy; then require the witness line and the OS
# loaded-module record (L at its bundle path with the modified SHA256), with
# the unmodified bundle as the negative control.
# L: libQt6XcbQpa.so.6 (linux-x86_64), qwindows.dll (windows-x86_64).
# Only text receipts are uploaded. No bundle, library, binary or source archive
# leaves the job; nothing is signed, released or published. No secrets.

on:
  push:
    branches: [feat/bridge-gui-171]
    paths:
      - '.github/workflows/test-bridge-desktop-relink.yml'
      - 'bridge/dev-build/relink_control.py'
      - 'bridge/entrypoint_desktop.py'
      - 'bridge/silentsuite-bridge-desktop.spec'
      - 'bridge/tests/test_desktop_frozen.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      caller:
        description: Name of the calling workflow; keeps called and standalone runs in separate concurrency groups.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bridge-desktop-relink-${{ inputs.caller || 'standalone' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_SOURCE_URL: https://download.qt.io/official_releases/qt/6.12/6.12.0/single/qt-everywhere-src-6.12.0.tar.xz
  QT_SOURCE_SHA256: 98ff4f44bac6ec3e1e62ee2a4316ae0e3d15badb015d753cc0268a20db52f165

jobs:
  relink:
    name: Relinking control (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: linux-x86_64
            sdk_url: https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346qtbase-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z
            sdk_sha256: 943023b929d0c08eafe7341700b5ed7601284410b7afd6093f950be291d1d7cd
          - runner: windows-latest
            label: windows-x86_64
            sdk_url: https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64/qt.qt6.6120.win64_msvc2022_64/6.12.0-0-202609280346qtbase-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z
            sdk_sha256: 219d1b86def3be418e31d704572bc4acc91b2ec373c65595c9fb12b42bf098dc
    env:
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      SILENTSUITE_REQUIRE_DESKTOP_FROZEN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.63.0"

      # Runtime list as in the frozen workflow, plus the qtbase build inputs for
      # the publisher's Linux feature set (config_qtbase.summary).
      - name: Install Linux runtime and qtbase build libraries (runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libegl1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libasound2
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libicu-dev zlib1g-dev libzstd-dev libdbus-1-dev libfreetype-dev libfontconfig1-dev \
            libegl-dev libgl-dev libvulkan-dev libdrm-dev libgbm-dev libsm-dev libice-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev

      - name: Install dependencies
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest ninja==1.13.0
          pip install -r tests/desktop_smoke/requirements.txt
          pip install pyinstaller

      - name: Build bundler control and canonical desktop app
        id: build
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/frozen"
          q7="$RUNNER_TEMP/q7"
          rm -rf "$out" "$q7"
          mkdir -p "$out" "$q7"
          python -m PyInstaller --version > "$out/pyinstaller-version.txt"
          python -m PyInstaller --noconfirm --onedir --name t0-probe \
            --distpath "$out/t0-dist" --workpath "$out/t0-build" --specpath "$out/t0-spec" \
            bridge/tests/desktop_smoke/probe.py > "$out/t0-build.log" 2>&1
          echo $? > "$out/t0-build.rc"
          (cd bridge && python -m PyInstaller silentsuite-bridge-desktop.spec --noconfirm --clean \
            --distpath "$out/dist" --workpath "$out/build") > "$out/canonical-build.log" 2>&1
          echo $? > "$out/canonical-build.rc"
          name=$(cd "$out/dist" && ls)
          [ "$(echo "$name" | wc -l)" = "1" ] || { echo "expected one bundle in dist"; exit 1; }
          echo "bundle=$name" >> "$GITHUB_OUTPUT"
          site=$(python -c "import os, PySide6; print(os.path.dirname(PySide6.__file__))")
          echo "pyside=$site" >> "$GITHUB_OUTPUT"
          python -c "import secrets; print('nonce=' + secrets.token_hex(16))" >> "$GITHUB_OUTPUT"

      - name: Fetch and extract the held Qt source, add the witness constructor
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/qt-src.tar.xz" "$QT_SOURCE_URL"
          python bridge/dev-build/relink_control.py extract --archive "$RUNNER_TEMP/qt-src.tar.xz" \
            --sha256 "$QT_SOURCE_SHA256" --dest "$RUNNER_TEMP/qs" --receipt "$q7/extract.json"
          rm -f "$RUNNER_TEMP/qt-src.tar.xz"
          python bridge/dev-build/relink_control.py patch --qtbase "$RUNNER_TEMP/qs/qt-everywhere-src-6.12.0/qtbase" \
            --platform "${{ matrix.label }}" --nonce "${{ steps.build.outputs.nonce }}" --receipt "$q7/patch.json"

      # Publisher options from the SDK's config_qtbase.opt; omitted only build
      # infrastructure (sccache, SBOM generation, install prefix, debug info,
      # headersclean checks); build only L and what it needs.
      - name: Configure qtbase and build L (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          mkdir -p "$RUNNER_TEMP/qb"
          cd "$RUNNER_TEMP/qb"
          options=(-prefix "$RUNNER_TEMP/qt-prefix" -release -nomake examples -nomake tests
                   -qt-libjpeg -qt-libpng -qt-pcre -qt-harfbuzz -qt-doubleconversion -no-libudev
                   -no-feature-liburing -bundled-xcb-xinput
                   -- -DOpenGL_GL_PREFERENCE=LEGACY -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
                   -DQT_BUILD_TESTS=OFF)
          printf '%s\n' "configure ${options[*]}" "cmake --build . --target XcbQpaPrivate --parallel" > "$q7/recipe.txt"
          { gcc --version | head -1; cmake --version | head -1; echo "ninja $(ninja --version)"; } >> "$q7/recipe.txt"
          "$RUNNER_TEMP/qs/qt-everywhere-src-6.12.0/qtbase/configure" "${options[@]}" > "$q7/configure.log" 2>&1 \
            || { tail -50 "$q7/configure.log"; exit 1; }
          cp config.summary "$q7/config.summary.txt" 2>/dev/null || true
          cmake --build . --target XcbQpaPrivate --parallel > "$q7/build.log" 2>&1 || { tail -80 "$q7/build.log"; exit 1; }
          ls -l lib/libQt6XcbQpa.so* | tee -a "$q7/recipe.txt"
          echo "$RUNNER_TEMP/qb/lib/libQt6XcbQpa.so.6.12.0" > "$q7/modified-path.txt"

      - name: Configure qtbase and build L (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 120
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          mkdir "%RUNNER_TEMP%\qb"
          cd /d "%RUNNER_TEMP%\qb" || exit /b 1
          echo configure -prefix %RUNNER_TEMP%\qt-prefix -release -nomake examples -nomake tests -qt-zlib -- -DQT_BUILD_TESTS=OFF> "%RUNNER_TEMP%\q7\recipe.txt"
          echo cmake --build . --target QWindowsIntegrationPlugin --parallel>> "%RUNNER_TEMP%\q7\recipe.txt"
          cl 2>> "%RUNNER_TEMP%\q7\recipe.txt"
          cmake --version >> "%RUNNER_TEMP%\q7\recipe.txt"
          call "%RUNNER_TEMP%\qs\qt-everywhere-src-6.12.0\qtbase\configure.bat" -prefix "%RUNNER_TEMP%\qt-prefix" -release -nomake examples -nomake tests -qt-zlib -- -DQT_BUILD_TESTS=OFF > "%RUNNER_TEMP%\q7\configure.log" 2>&1 || (powershell -Command "Get-Content -Tail 50 $env:RUNNER_TEMP\q7\configure.log" & exit /b 1)
          copy config.summary "%RUNNER_TEMP%\q7\config.summary.txt"
          cmake --build . --target QWindowsIntegrationPlugin --parallel > "%RUNNER_TEMP%\q7\build.log" 2>&1 || (powershell -Command "Get-Content -Tail 80 $env:RUNNER_TEMP\q7\build.log" & exit /b 1)
          dir plugins\platforms >> "%RUNNER_TEMP%\q7\recipe.txt"
          echo %RUNNER_TEMP%\qb\plugins\platforms\qwindows.dll> "%RUNNER_TEMP%\q7\modified-path.txt"

      # Evidence only: the generated Qt config headers against the publisher SDK's.
      - name: Compare generated config headers with the publisher SDK
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sdk.7z" "${{ matrix.sdk_url }}"
          echo "${{ matrix.sdk_sha256 }}  $RUNNER_TEMP/sdk.7z" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/sdk" "$RUNNER_TEMP/sdk.7z" > /dev/null
          header=$(find "$RUNNER_TEMP/sdk" -type f -path "*/include/QtCore/qtcore-config.h" | head -1)
          [ -n "$header" ] || { echo "no qtcore-config.h in the SDK archive"; exit 1; }
          python bridge/dev-build/relink_control.py configdiff --sdk-include "$(dirname "$(dirname "$header")")" \
            --build-include "$RUNNER_TEMP/qb/include" --receipt "$q7/configdiff.json"

      - name: Swap L into a tar round-trip copy of the build
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          rm -rf "$RUNNER_TEMP/relink"
          python bridge/dev-build/relink_control.py copy --source "$RUNNER_TEMP/frozen" \
            --dest "$RUNNER_TEMP/relink" --receipt "$q7/copy.json"
          if [ "$RUNNER_OS" = "Linux" ]; then
            member="${{ steps.build.outputs.pyside }}/Qt/lib/libQt6XcbQpa.so.6"
          else
            member="${{ steps.build.outputs.pyside }}/plugins/platforms/qwindows.dll"
          fi
          python bridge/dev-build/relink_control.py swap \
            --bundle "$RUNNER_TEMP/relink/frozen/dist/${{ steps.build.outputs.bundle }}" \
            --platform "${{ matrix.label }}" --modified "$(cat "$q7/modified-path.txt" | tr -d '\r')" \
            --wheel-member "$member" --receipt "$q7/swap.json"

      - name: Run the unchanged frozen startup tests against the modified bundle
        timeout-minutes: 25
        working-directory: bridge
        shell: bash
        env:
          SILENTSUITE_FROZEN_OUT: ${{ runner.temp }}/relink/frozen
        run: |
          set -uo pipefail
          q7="$RUNNER_TEMP/q7"
          cmd=(python -m pytest tests/test_desktop_frozen.py -v --tb=long -p no:cacheprovider
               --junitxml="$q7/frozen-modified-junit.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "${cmd[@]}" 2>&1 | tee "$q7/frozen-modified-pytest.txt"
          else
            "${cmd[@]}" 2>&1 | tee "$q7/frozen-modified-pytest.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status" | tee -a "$q7/frozen-modified-pytest.txt"
          exit "$status"

      - name: Load witness (modified) and negative control (unmodified)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          q7="$RUNNER_TEMP/q7"
          bundle="${{ steps.build.outputs.bundle }}"
          wrap=()
          if [ "$RUNNER_OS" = "Linux" ]; then wrap=(xvfb-run -a -s "-screen 0 1280x800x24"); fi
          modified_sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['modified_sha256'])" "$q7/swap.json")
          original_sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['original_sha256'])" "$q7/swap.json")
          status=0
          "${wrap[@]}" python bridge/dev-build/relink_control.py witness --bundle "$RUNNER_TEMP/relink/frozen/dist/$bundle" \
            --platform "${{ matrix.label }}" --root "$RUNNER_TEMP/w-modified" --expect-sha256 "$modified_sha" \
            --nonce "${{ steps.build.outputs.nonce }}" --receipt "$q7/witness-modified.json" || status=1
          "${wrap[@]}" python bridge/dev-build/relink_control.py witness --bundle "$RUNNER_TEMP/frozen/dist/$bundle" \
            --platform "${{ matrix.label }}" --root "$RUNNER_TEMP/w-original" --expect-sha256 "$original_sha" \
            --negative-control --receipt "$q7/witness-negative.json" || status=1
          echo "nonce ${{ steps.build.outputs.nonce }}" >> "$q7/recipe.txt"
          exit "$status"

      # Receipts only: JSON, text and logs. Never the bundle or the modified L.
      - name: Upload relinking control receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q7-relink-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/q7/*.json
            ${{ runner.temp }}/q7/*.txt
            ${{ runner.temp }}/q7/*.xml
            ${{ runner.temp }}/q7/*.log
          if-no-files-found: warn
          retention-days: 14
