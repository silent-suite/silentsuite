name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-privacy-guardrails:
    name: Android Privacy Guardrail Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tracker scanner and UID network evidence fixtures
        run: python3 -m unittest tests.test_android_tracker_scan -v

  analytics-boundary:
    name: Public Analytics Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Baseline signup pageviews are independent of the commercial event flag, so the
      # emitted signup layout transport is verified in the disabled build mode too. The
      # enabled build below then overwrites .next for the final enabled-mode check.
      - name: Verify disabled-mode web analytics artifacts
        run: |
          NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED=false pnpm --filter @silentsuite/web build
          node scripts/check-public-analytics.mjs
      - name: Build public surfaces
        run: |
          NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED=true pnpm --filter @silentsuite/web build
          SILENTSUITE_HOSTED_DOCS_ANALYTICS=1 pnpm --filter @silentsuite/docs exec vitepress build --outDir .vitepress/dist-hosted
          pnpm --filter @silentsuite/docs exec vitepress build --outDir .vitepress/dist-self
          node scripts/verify-docs-analytics-build.mjs --dir apps/docs/.vitepress/dist-hosted --mode enabled
          node scripts/verify-docs-analytics-build.mjs --dir apps/docs/.vitepress/dist-self --mode disabled
      - name: Verify docs Turbo analytics cache isolation
        run: |
          rm -rf .turbo apps/docs/.vitepress/dist
          SILENTSUITE_HOSTED_DOCS_ANALYTICS=1 pnpm run build:docs
          node scripts/verify-docs-analytics-build.mjs --dir apps/docs/.vitepress/dist --mode enabled
          pnpm run build:docs
          node scripts/verify-docs-analytics-build.mjs --dir apps/docs/.vitepress/dist --mode disabled
          SILENTSUITE_HOSTED_DOCS_ANALYTICS=1 pnpm run build:docs
          node scripts/verify-docs-analytics-build.mjs --dir apps/docs/.vitepress/dist --mode enabled
      - name: Test Android distribution documentation
        run: pnpm --filter @silentsuite/docs test:android-distribution
      - name: Enforce source and bundle analytics boundary
        run: PUBLIC_ANALYTICS_ENABLED_BUILD=true pnpm run check:public-analytics

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce public analytics boundary
        run: pnpm run check:public-analytics

      - name: Enforce annual billing copy
        run: pnpm run check:billing-copy

      - name: Test closed annual-only public Stage A to Stage B handshake
        run: pnpm run check:annual-public-handshake

      - name: Run tests
        run: pnpm run test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: |
          set -o pipefail
          pnpm run audit:security | tee audit-summary.txt
          {
            echo "## Dependency Audit"
            echo ""
            cat audit-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build web Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: silentsuite-web:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_ETEBASE_SERVER_URL=https://server.silentsuite.io
            NEXT_PUBLIC_BILLING_API_URL=https://api.silentsuite.io
          cache-from: type=gha
          cache-to: type=gha,mode=max
