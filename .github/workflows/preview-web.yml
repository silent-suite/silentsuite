name: Preview Web App (protected-main shared deploy + PR builds)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'Dockerfile.web'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'README.md'
      - 'docs/**'
      - 'apps/docs/**'
      - 'android/**'
      - 'scripts/check-billing-copy*.mjs'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'Dockerfile.web'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'README.md'
      - 'docs/**'
      - 'apps/docs/**'
      - 'android/**'
      - 'scripts/check-billing-copy*.mjs'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number whose exact head should be previewed
        required: true
        type: string
      expected_sha:
        description: Exact lowercase 40-character PR head SHA to preview
        required: true
        type: string

jobs:
  build-preview:
    name: Build Preview (no deploy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce annual billing copy
        run: pnpm run check:billing-copy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build preview image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: |
            silentsuite-web:pr-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_ETEBASE_SERVER_URL=https://server.silentsuite.io
            NEXT_PUBLIC_BILLING_API_URL=https://api.silentsuite.io
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=
            NEXT_PUBLIC_BTCPAY_CHECKOUT_ENABLED=true
            NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED=false
          cache-from: type=gha

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = `**Preview build completed**\n\nThe shared preview updates from protected \`main\` only. This PR built the web image locally but did not publish the shared preview tag or SSH deploy. A manually dispatched exact-head preview is a separate, identified operation.\n\nBranch: \`${context.payload.pull_request.head.ref}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview build completed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  resolve-trusted-target:
    name: Resolve trusted preview target
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      cache_scope: ${{ steps.resolve.outputs.cache_scope }}

    steps:
      - name: Resolve push or manually requested exact PR head
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || { echo "push must be from main" >&2; exit 1; }
            target_sha="$PUSH_SHA"
            cache_scope="main"
          else
            [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || { echo "manual preview must be dispatched from refs/heads/main" >&2; exit 1; }
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "pr_number must be a positive decimal integer" >&2; exit 1; }
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be lowercase 40-character hexadecimal" >&2; exit 1; }
            pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            jq -e \
              --arg expected_sha "$EXPECTED_SHA" \
              --argjson repository_id "$REPOSITORY_ID" \
              '.state == "open" and .base.ref == "main" and .head.repo.id == $repository_id and .head.sha == $expected_sha' \
              <<<"$pr" >/dev/null || { echo "PR must be open, target main, belong to this repository, and match expected_sha" >&2; exit 1; }
            target_sha="$EXPECTED_SHA"
            cache_scope="pr-$PR_NUMBER"
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "cache_scope=$cache_scope" >> "$GITHUB_OUTPUT"

  build-shared-preview-image:
    name: Build Shared Preview Image
    needs: resolve-trusted-target
    if: needs.resolve-trusted-target.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-trusted-target.outputs.target_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce annual billing copy
        run: pnpm run check:billing-copy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build preview image without registry or deployment credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: silentsuite-web:preview-${{ needs.resolve-trusted-target.outputs.target_sha }}
          outputs: type=docker,dest=${{ runner.temp }}/preview-image.tar
          build-args: |
            NEXT_PUBLIC_ETEBASE_SERVER_URL=https://server.silentsuite.io
            NEXT_PUBLIC_BILLING_API_URL=https://api.silentsuite.io
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BTCPAY_CHECKOUT_ENABLED=true
            NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED=false
          cache-from: type=gha,scope=preview-${{ needs.resolve-trusted-target.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=preview-${{ needs.resolve-trusted-target.outputs.cache_scope }}

      - name: Upload exact preview image for the credentialed publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-image-${{ needs.resolve-trusted-target.outputs.target_sha }}
          path: ${{ runner.temp }}/preview-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-and-deploy-preview:
    name: Publish & Deploy Shared Preview
    needs: [resolve-trusted-target, build-shared-preview-image]
    if: needs.build-shared-preview-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-web-shared-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Download exact preview image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-image-${{ needs.resolve-trusted-target.outputs.target_sha }}
          path: ${{ runner.temp }}

      - name: Load exact preview image
        run: docker load --input "$RUNNER_TEMP/preview-image.tar"

      - name: Revalidate trusted target immediately before publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_SHA: ${{ needs.resolve-trusted-target.outputs.target_sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            live_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            [[ "$live_main" == "$TARGET_SHA" ]] || { echo "main advanced; refusing stale preview publication" >&2; exit 1; }
          else
            pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            jq -e \
              --arg expected_sha "$TARGET_SHA" \
              --argjson repository_id "$REPOSITORY_ID" \
              '.state == "open" and .base.ref == "main" and .head.repo.id == $repository_id and .head.sha == $expected_sha' \
              <<<"$pr" >/dev/null || { echo "PR identity changed; refusing preview deployment" >&2; exit 1; }
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact and shared preview tags
        env:
          TARGET_SHA: ${{ needs.resolve-trusted-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          source_image="silentsuite-web:preview-$TARGET_SHA"
          exact_image="ghcr.io/silent-suite/silentsuite-web:preview-$TARGET_SHA"
          shared_image="ghcr.io/silent-suite/silentsuite-web:preview"
          docker tag "$source_image" "$exact_image"
          docker tag "$source_image" "$shared_image"
          docker push "$exact_image"
          docker push "$shared_image"

      - name: Deploy preview to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/silent-suite/silentsuite-web:preview
            cd ~/etebase
            docker compose -f docker-compose.preview.yml up -d --force-recreate web-preview
            echo "Preview deployed: https://previewapp.silentsuite.io (SHA: ${{ needs.resolve-trusted-target.outputs.target_sha }})"
