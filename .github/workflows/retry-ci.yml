# /retry-ci: intigenesis (user id 313311150) comments exactly `/retry-ci` on
# his own open fork pull request to main, and this reruns the failed jobs of
# that head commit's CI runs (and the jobs GitHub reruns with them, which can
# include the read-only policy checks inside those workflows). He may do it as
# often as he likes, once every run on the commit has finished. Owner-approved
# scope: no other user, no preview, deploy, signing or release workflow, no
# other repository access.
#
# issue_comment runs this file and the script from the default branch; the
# pull request's code is never checked out or executed here, and the comment
# body reaches the script only through the environment. The reruns themselves
# keep their original fork `pull_request` context: read-only token, no
# secrets. One concurrency group for every /retry-ci, so two comments are
# never evaluated at once. Concurrency group names are repository-wide, so a
# fork PR whose own workflow claims `retry-ci` can cancel a queued or running
# /retry-ci; commenting again retries. Rules and allowlist:
# scripts/retry-ci/retry-ci.mjs. The result is in this run's summary in the
# Actions tab; a refusal fails the run.
name: Retry CI

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  retry:
    name: Retry failed CI
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.id == 313311150 &&
      github.event.issue.user.id == 313311150 &&
      startsWith(github.event.comment.body, '/retry-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: retry-ci
      cancel-in-progress: false
    steps:
      - name: Checkout the default-branch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/retry-ci

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Retry failed CI jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_USER_ID: ${{ github.event.comment.user.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: node scripts/retry-ci/retry-ci.mjs
