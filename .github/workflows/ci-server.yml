name: CI Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile.server'
      - 'Dockerfile.web'
      - 'scripts/umbrel-candidate-*'
      - '.dockerignore'
      - 'self-host/**'
      - 'contracts/self-host-server-image.schema.json'
      - 'contracts/umbrel-images.schema.json'
      - 'scripts/umbrel_release_contract.py'
      - 'docs/self-hosting/**'
      - 'apps/docs/self-hosting/**'
      - 'scripts/build-self-host-bundle.py'
      - 'scripts/verify-self-host-bundle.py'
      - 'scripts/selfhost_release_contract.py'
      - 'scripts/self-host-image-smoke.sh'
      - 'scripts/self-host-image-smoke-probe.py'
      - 'scripts/self-host-compose-effective-check.sh'
      - 'scripts/verify-server-image-release.sh'
      - 'scripts/attach-umbrella-release-assets.sh'
      - 'scripts/verify-release-identity.sh'
      - 'scripts/verify-umbrella-release-readiness.py'
      - 'scripts/umbrella_release_contract.py'
      - 'scripts/check-server-image-dependencies.py'
      - 'scripts/lock-server-requirements.py'
      - 'scripts/pip-audit-requirements.in'
      - 'scripts/pip-audit-requirements.txt'
      - 'scripts/stage-bridge-release-assets.sh'
      - 'tests/test_self_host_*.py'
      - 'tests/fixtures/self-host-backup/**'
      - 'integrations/libre-workspace/**'
      - 'LICENSE'
      - 'apps/docs/public/logo.svg'
      - 'tests/test_umbrella_release_*.py'
      - 'tests/test_server_image_verifier.py'
      - 'tests/test_reusable_workflow_caller_permissions.py'
      - 'tests/test_annual_cutover_admission_preflight.py'
      # Any checked-in workflow can be, or become, a local reusable caller or
      # callee, so the caller/callee permission-subset contract this job runs
      # is only truthfully enforced by watching the whole directory. This also
      # subsumes the release-controller/android/bridge/server-image/readiness
      # entries this replaced.
      - '.github/workflows/**'
      - '.github/trivy/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile.server'
      - 'Dockerfile.web'
      - 'scripts/umbrel-candidate-*'
      - '.dockerignore'
      - 'self-host/**'
      - 'contracts/self-host-server-image.schema.json'
      - 'contracts/umbrel-images.schema.json'
      - 'scripts/umbrel_release_contract.py'
      - 'docs/self-hosting/**'
      - 'apps/docs/self-hosting/**'
      - 'scripts/build-self-host-bundle.py'
      - 'scripts/verify-self-host-bundle.py'
      - 'scripts/selfhost_release_contract.py'
      - 'scripts/self-host-image-smoke.sh'
      - 'scripts/self-host-image-smoke-probe.py'
      - 'scripts/self-host-compose-effective-check.sh'
      - 'scripts/verify-server-image-release.sh'
      - 'scripts/attach-umbrella-release-assets.sh'
      - 'scripts/verify-release-identity.sh'
      - 'scripts/verify-umbrella-release-readiness.py'
      - 'scripts/umbrella_release_contract.py'
      - 'scripts/check-server-image-dependencies.py'
      - 'scripts/lock-server-requirements.py'
      - 'scripts/pip-audit-requirements.in'
      - 'scripts/pip-audit-requirements.txt'
      - 'scripts/stage-bridge-release-assets.sh'
      - 'tests/test_self_host_*.py'
      - 'tests/fixtures/self-host-backup/**'
      - 'integrations/libre-workspace/**'
      - 'LICENSE'
      - 'apps/docs/public/logo.svg'
      - 'tests/test_umbrella_release_*.py'
      - 'tests/test_server_image_verifier.py'
      - 'tests/test_reusable_workflow_caller_permissions.py'
      - 'tests/test_annual_cutover_admission_preflight.py'
      # Any checked-in workflow can be, or become, a local reusable caller or
      # callee, so the caller/callee permission-subset contract this job runs
      # is only truthfully enforced by watching the whole directory. This also
      # subsumes the release-controller/android/bridge/server-image/readiness
      # entries this replaced.
      - '.github/workflows/**'
      - '.github/trivy/**'

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Server Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      DJANGO_SETTINGS_MODULE: etebase_server.settings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12, the same interpreter the release image runs and the same one both
      # requirement files were compiled for. On 3.10 this job asked PyPI for a
      # cp310 wheel, which the hash lock does not record and must not: the lock
      # names the exact bytes of three environments, and a fourth would be an
      # unreviewed one.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # This runner is glibc, so pip selects the reviewed manylinux x86_64 wheels
      # from the same lock the Alpine image installs its musllinux ones from.
      # The flags are explicit rather than implied: --require-hashes is what pip
      # infers anyway once any hash is present, and stating it means a lock that
      # lost its hashes fails here instead of silently resolving live.
      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary=:all: -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        working-directory: server
        run: |
          python -m py_compile manage.py
          python -m py_compile etebase_server/settings.py
          python -m py_compile etebase_server/urls.py
          python -m py_compile etebase_server/utils.py
          python -m py_compile etebase_server/myauth/tests.py

      - name: Verify Django app loads
        working-directory: server
        run: python -c "import django; django.setup(); print('Django loaded OK')"

      - name: Run FastAPI route contract tests
        working-directory: server
        run: |
          python -m pytest \
            etebase_server/fastapi/test_collection_route_contracts.py \
            etebase_server/fastapi/test_item_list_queryset.py \
            etebase_server/fastapi/test_authentication.py \
            etebase_server/fastapi/test_request_body_limits.py \
            -v --tb=short

      - name: Verify Docker secret exclusions
        run: |
          grep -Fx 'secret.txt' .dockerignore
          grep -Fx '**/secret.txt' .dockerignore
          grep -Fx '/secret.txt' server/.dockerignore
          grep -Fx '**/secret.txt' server/.dockerignore

      - name: Lint with ruff
        working-directory: server
        run: ruff check . --select=E,F,I --ignore=E501
        continue-on-error: true

      - name: Run tests
        working-directory: server
        run: python -m pytest etebase_server/ -v --tb=short

      # Dependency audit of both Python locks. The audit tool is hash-locked
      # separately and installed into its own virtualenv so the test environment
      # stays untouched. Each audit step fails on pip-audit's own exit status;
      # a nonzero exit means vulnerabilities or an audit error, and its log says
      # which. These steps run from the repository root.
      - name: Install the hash-locked audit tool into an isolated virtualenv
        if: ${{ !cancelled() }}
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes --only-binary=:all: -r scripts/pip-audit-requirements.txt

      - name: Audit the runtime lock
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/runtime-audit.json"
          "$RUNNER_TEMP/audit/bin/pip-audit" -r server/requirements.txt --require-hashes --disable-pip --strict \
            -s osv -f json -o "$RUNNER_TEMP/runtime-audit.json" --progress-spinner off

      - name: Audit the development lock
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/dev-audit.json"
          "$RUNNER_TEMP/audit/bin/pip-audit" -r server/requirements-dev.txt --no-deps --disable-pip --strict \
            -s osv -f json -o "$RUNNER_TEMP/dev-audit.json" --progress-spinner off

      - name: Print the audited dependency inventories and vulnerability IDs
        if: ${{ !cancelled() }}
        run: |
          for report in "$RUNNER_TEMP/runtime-audit.json" "$RUNNER_TEMP/dev-audit.json"; do
            echo "== $(basename "$report")"
            if [ -f "$report" ]; then
              jq -r '.dependencies[] | "\(.name)==\(.version // ("SKIPPED " + (.skip_reason // ""))) \([.vulns[]?.id] | join(","))"' "$report"
            else
              echo "no report was produced"
            fi
          done

  self-host-contracts:
    name: Self-Host Release Contracts
    runs-on: ubuntu-latest
    # The materials contract resolves the hash lock three times against PyPI —
    # once per install environment — on a cold runner cache.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML==6.0.3

      # The materials contract is excluded here and run once below instead: it
      # resolves the hash lock against PyPI three times, and the dedicated step
      # runs it under the stricter contract that turns a network skip into a
      # failure. Running it twice would only pay for those downloads twice.
      - name: Run self-host release contract tests
        run: |
          python -m pytest -q \
            --ignore=tests/test_self_host_server_image_materials.py \
            --ignore=tests/test_self_host_web_image_materials.py \
            tests/test_self_host_*.py \
            tests/test_umbrella_release_*.py \
            tests/test_server_image_verifier.py

      - name: Check reusable-workflow caller/callee permission subsets
        run: python -m pytest -q tests/test_reusable_workflow_caller_permissions.py

      - name: Check the annual Stage B cutover admission preflight and outcome contract
        run: python -m pytest -q tests/test_annual_cutover_admission_preflight.py

      - name: Verify the effective self-host Compose configuration
        run: scripts/self-host-compose-effective-check.sh

      - name: Check release and self-host shell syntax
        run: |
          for script in \
            self-host/install.sh \
            self-host/update.sh \
            self-host/verify.sh \
            self-host/backup.sh \
            tests/fixtures/self-host-backup/harness.sh \
            self-host/close-signups.sh \
            scripts/self-host-image-smoke.sh \
            scripts/self-host-compose-effective-check.sh \
            scripts/verify-server-image-release.sh \
            scripts/attach-umbrella-release-assets.sh \
            scripts/verify-release-identity.sh \
            scripts/stage-bridge-release-assets.sh \
            scripts/umbrel-candidate-smoke.sh; do
            bash -n "$script"
          done

      # Runs the real add-on setup/update/remove/build scripts against isolated
      # fixtures with stubbed docker, caddy and systemctl, and builds the .deb.
      - name: Run the Libre Workspace add-on lifecycle tests
        run: integrations/libre-workspace/tests/lifecycle.test.sh

      - name: Compile the release control-plane Python helpers
        run: |
          python -m py_compile \
            scripts/check-android-signing-boundary.py \
            scripts/check-server-image-dependencies.py \
            scripts/lock-server-requirements.py \
            scripts/selfhost_release_contract.py \
            scripts/umbrella_release_contract.py \
            scripts/umbrel_release_contract.py \
            scripts/verify-umbrella-release-readiness.py \
            scripts/umbrel-candidate-effective-compose.py \
            scripts/umbrel-candidate-probe.py

      - name: Enforce the release control-plane boundary
        run: python scripts/check-android-signing-boundary.py

      # Base image identity, and the three-environment hash lock resolved the
      # way each environment's pip would. The env var turns "network was
      # unavailable, so we skipped" into a failure.
      - name: Verify the pinned base image and the hash lock against live indexes
        env:
          SILENTSUITE_REQUIRE_REGISTRY_CONTRACT: '1'
        run: |
          python -m pytest tests/test_self_host_server_image_materials.py -q
          python -m pytest tests/test_self_host_web_image_materials.py -q

  self-host-backup-behaviour:
    name: Self-Host Backup Behaviour (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only, credential-free, GitHub-hosted. The fixture starts throwaway
    # Compose stacks from the PostgreSQL digest this repository already pins,
    # and removes every container and volume it created. Nothing is pushed,
    # published or deployed.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Proves the properties a static test cannot: the physical volume is
      # resolved from the live container under a default and a custom Compose
      # project name, the backup is exact and checksummed over real sentinel
      # data, the old guessed-name volumes are untouched, unchanged-manifest
      # corruption and concurrent drift are detected, the unauthenticated
      # manifest boundary is explicit, and invalid identities are refused before
      # any backup directory exists.
      - name: Run the self-host backup behaviour fixture
        run: tests/fixtures/self-host-backup/harness.sh

  self-host-image:
    name: Self-Host Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            trivy_asset: trivy_0.76.2_Linux-64bit.tar.gz
            trivy_sha256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            trivy_asset: trivy_0.76.2_Linux-ARM64.tar.gz
            trivy_sha256: ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Native build only: no registry credentials, no push, no environment.
      # This is the same image content the release workflow publishes, built and
      # smoked here before any tag exists.
      - name: Build the server image for ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.server
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: silentsuite-server:ci-${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=ci-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-server-${{ matrix.arch }}

      # The native half of the hash-locked materials proof: the wheels the
      # Dockerfile installed have to be importable on this architecture, with no
      # Alpine package providing libpq, libffi or libsodium behind them.
      - name: Prove the hash-locked dependency set imports natively
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD/scripts/check-server-image-dependencies.py:/check.py:ro" \
            -v "$PWD/server/requirements.txt:/requirements.txt:ro" \
            "silentsuite-server:ci-${{ matrix.arch }}" \
            /check.py --requirements /requirements.txt

      - name: Run the self-host image smoke contract
        run: |
          scripts/self-host-image-smoke.sh \
            --image "silentsuite-server:ci-${{ matrix.arch }}" \
            --platform "${{ matrix.platform }}" \
            --expect-revision "${{ github.sha }}"

      # Vulnerability audit of the image built above. Trivy is fetched from its
      # release and checked against this lane's literal digest. One scan writes a
      # full-severity inventory; every finding is printed, installed Python
      # coverage is compared with the image's own metadata, and the HIGH/CRITICAL
      # gate reads the same report. Only the gate reads the reviewed, expiring
      # exceptions in .github/trivy/server-image-exceptions.yaml. Each step fails
      # on the tool's own exit status.
      - name: Install Trivy v0.76.2 (digest-checked)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/${{ matrix.trivy_asset }}" \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/${{ matrix.trivy_asset }}"
          echo "${{ matrix.trivy_sha256 }}  $RUNNER_TEMP/${{ matrix.trivy_asset }}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/${{ matrix.trivy_asset }}" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan the built image (all severities, OS and library packages)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          rm -f "$RUNNER_TEMP/trivy-image.json" "$RUNNER_TEMP/server-image.tar"
          docker save "silentsuite-server:ci-${{ matrix.arch }}" -o "$RUNNER_TEMP/server-image.tar"
          trivy image --input "$RUNNER_TEMP/server-image.tar" --scanners vuln --pkg-types os,library \
            --list-all-pkgs --format json --output "$RUNNER_TEMP/trivy-image.json" \
            --ignorefile "" --cache-dir "$RUNNER_TEMP/trivy-cache"

      - name: Print every image finding
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: trivy convert --format table --ignorefile "" "$RUNNER_TEMP/trivy-image.json"

      - name: Prove the scan covered the installed Python distributions and OS packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          report="$RUNNER_TEMP/trivy-image.json"
          jq -e '.Metadata.OS.Family == "alpine" and any(.Results[]?; .Class == "os-pkgs" and ((.Packages // []) | length > 0))' "$report" > /dev/null
          docker run --rm --network none --entrypoint python3 "silentsuite-server:ci-${{ matrix.arch }}" -I -c '
          import importlib.metadata, re
          names = {re.sub(r"[-_.]+", "-", d.metadata["Name"]).lower() + "==" + d.version for d in importlib.metadata.distributions()}
          print("\n".join(sorted(names)))
          ' > "$RUNNER_TEMP/image-installed.txt"
          jq -r '[.Results[]? | select(.Class == "lang-pkgs" and .Type == "python-pkg") | .Packages[]? | ((.Name | ascii_downcase | gsub("[-_.]+"; "-")) + "==" + .Version)] | unique[]' "$report" > "$RUNNER_TEMP/trivy-installed.txt"
          test -s "$RUNNER_TEMP/image-installed.txt"
          diff -u "$RUNNER_TEMP/image-installed.txt" "$RUNNER_TEMP/trivy-installed.txt"
          echo "installed Python distributions covered: $(wc -l < "$RUNNER_TEMP/image-installed.txt")"

      - name: HIGH/CRITICAL image vulnerability gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 --ignorefile .github/trivy/server-image-exceptions.yaml "$RUNNER_TEMP/trivy-image.json"
