name: CI Umbrel Candidate

# Native DEVELOPMENT candidates only: no registry publication, release or deployment.
on:
  pull_request:
    paths:
      - "self-host/umbrel/**"
      - "scripts/umbrel-candidate-*"
      - "tests/test_self_host_umbrel_release.py"
      - "tests/test_self_host_web_image_materials.py"
      - ".github/workflows/ci-umbrel-candidate.yml"
      - "Dockerfile.web"
      - "Dockerfile.server"
      - ".dockerignore"
      - "apps/web/**"
      - "packages/**"
      - "server/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: umbrel-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Umbrel development candidate (${{ matrix.arch }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      WEB_IMAGE: 127.0.0.1:5000/silentsuite-web:dev-${{ github.event.pull_request.head.sha }}-${{ matrix.arch }}
      SERVER_IMAGE: 127.0.0.1:5000/silentsuite-server:dev-${{ github.event.pull_request.head.sha }}-${{ matrix.arch }}

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert checked-out revision
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked renderer dependency
        run: |
          cat > "$RUNNER_TEMP/umbrel-renderer-requirements.txt" <<'REQUIREMENTS'
          PyYAML==6.0.3 \
              --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
              --hash=sha256:9149cad251584d5fb4981be1ecde53a1ca46c891a79788c0df828d2f166bda28
          REQUIREMENTS
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/umbrel-renderer-requirements.txt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build owner-enabled self-host web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha }}
            NEXT_PUBLIC_SELF_HOSTED=true
            NEXT_PUBLIC_ETEBASE_SERVER_URL=
            NEXT_PUBLIC_OWNER_REGISTRATION=true
            NEXT_PUBLIC_BTCPAY_CHECKOUT_ENABLED=false
            NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_LOCAL_CACHE_ENABLED=false

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.server
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.SERVER_IMAGE }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha }}

      - name: Inspect image identities and revisions
        run: |
          for image in "$WEB_IMAGE" "$SERVER_IMAGE"; do
            test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$HEAD_SHA"
            test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image")" = "$PLATFORM"
            docker image inspect -f '{{.Id}} {{.Architecture}}' "$image"
          done
          echo "WEB_ID=$(docker image inspect -f '{{.Id}}' "$WEB_IMAGE")" >> "$GITHUB_ENV"
          echo "SERVER_ID=$(docker image inspect -f '{{.Id}}' "$SERVER_IMAGE")" >> "$GITHUB_ENV"

      - name: Effective-stack smoke test
        run: |
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" \
            bash scripts/umbrel-candidate-smoke.sh "$WEB_ID" "$SERVER_ID" \
              --platform "$PLATFORM" --expect-revision "$HEAD_SHA"

      - name: Assemble development package archive
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/umbrel-candidate-$ARCH"
          test ! -e "$out"
          mkdir -p "$out/images" "$out/package"
          test "$(docker image inspect -f '{{.Id}}' "$WEB_IMAGE")" = "$WEB_ID"
          test "$(docker image inspect -f '{{.Id}}' "$SERVER_IMAGE")" = "$SERVER_ID"
          docker save -o "$out/images/silentsuite-web.tar" "$WEB_IMAGE"
          docker save -o "$out/images/silentsuite-server.tar" "$SERVER_IMAGE"
          cp -R self-host/umbrel/silentsuite "$out/package/silentsuite"
          package="$out/package/silentsuite"
          python scripts/umbrel-candidate-effective-compose.py \
            "$package/docker-compose.yml" "$package/.rendered-compose.yml" 18080 \
            --web-image "$WEB_IMAGE" --server-image "$SERVER_IMAGE" \
            --app-data-dir "$package" --mode archive
          mv "$package/.rendered-compose.yml" "$package/docker-compose.yml"
          export CANDIDATE_OUTPUT="$out"
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path
          env = os.environ
          for component in ("web", "server"):
              with tarfile.open(Path(env["CANDIDATE_OUTPUT"], "images", f"silentsuite-{component}.tar")) as archive:
                  manifests = json.load(archive.extractfile("manifest.json"))
                  assert len(manifests) == 1
                  record = manifests[0]
                  assert record["RepoTags"] == [env[f"{component.upper()}_IMAGE"]]
                  config = archive.extractfile(record["Config"]).read()
                  assert "sha256:" + hashlib.sha256(config).hexdigest() == env[f"{component.upper()}_ID"]
                  image = json.loads(config)
                  assert image["architecture"] == env["ARCH"] and image["os"] == "linux"
                  assert image["config"]["Labels"]["org.opencontainers.image.revision"] == env["HEAD_SHA"]
          document = {
              "kind": "silentsuite-umbrel-development-candidate",
              "repository": env["REPOSITORY"],
              "pull_request": int(env["PULL_REQUEST"]),
              "revision": env["HEAD_SHA"],
              "platform": env["PLATFORM"],
              "web": {
                  "image": env["WEB_IMAGE"],
                  "id": env["WEB_ID"],
                  "build_args": {
                      "NEXT_PUBLIC_SELF_HOSTED": "true",
                      "NEXT_PUBLIC_ETEBASE_SERVER_URL": "",
                      "NEXT_PUBLIC_OWNER_REGISTRATION": "true",
                      "NEXT_PUBLIC_BTCPAY_CHECKOUT_ENABLED": "false",
                      "NEXT_PUBLIC_SIGNUP_ANALYTICS_ENABLED": "false",
                      "NEXT_PUBLIC_LOCAL_CACHE_ENABLED": "false",
                  },
              },
              "server": {"image": env["SERVER_IMAGE"], "id": env["SERVER_ID"]},
              "package": "self-host/umbrel/silentsuite",
              "published": False,
          }
          Path(env["CANDIDATE_OUTPUT"], "provenance.json").write_text(
              json.dumps(document, indent=2) + "\n", encoding="utf-8"
          )
          PY
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum --check SHA256SUMS)

      - name: Upload development candidate archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrel-development-candidate-${{ github.event.pull_request.head.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/umbrel-candidate-${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
