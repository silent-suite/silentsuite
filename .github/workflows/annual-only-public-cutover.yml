name: Annual-only Public Cutover (Stage B)

# The only public workflow that can emit Stage B. Stage A is consumed before
# each protected component deployment; Stage C remains private-only.
on:
  workflow_dispatch:
    inputs:
      expected_sha: { description: Exact reviewed live main SHA admitted by Stage A, required: true, type: string }
      private_admission_run_id: { description: Exact private Stage A run ID, required: true, type: string }
      private_admission_run_attempt: { description: Exact private Stage A run attempt, required: true, type: string }
      private_admission_artifact_id: { description: Exact immutable private Stage A artifact ID, required: true, type: string }

concurrency:
  group: annual-only-public-cutover
  cancel-in-progress: false

jobs:
  admission:
    name: Assert every owner approval is armed for the exact live main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      # Each reusable callee gates its own jobs on its own deploy-surface
      # approval variable. Observing only this workflow's variable is what let
      # two armed dispatches conclude `skipped` with zero jobs and zero logs.
      ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA: ${{ vars.ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA }}
      WEB_DEPLOY_APPROVED_SHA: ${{ vars.WEB_DEPLOY_APPROVED_SHA }}
      DOCS_DEPLOY_APPROVED_SHA: ${{ vars.DOCS_DEPLOY_APPROVED_SHA }}
    steps:
      - name: Refuse an unarmed or mismatched cutover with an explicit diagnostic per condition
        shell: bash
        run: |
          set -uo pipefail
          refused=0
          fail() { echo "::error::$1"; refused=1; }
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            fail "Stage B runs only from refs/heads/main; this dispatch ran from $GITHUB_REF"
          fi
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            fail "expected_sha must be a full 40-character lowercase commit SHA"
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            fail "dispatched head $GITHUB_SHA is not the reviewed expected_sha $EXPECTED_SHA"
          fi
          for name in ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA WEB_DEPLOY_APPROVED_SHA DOCS_DEPLOY_APPROVED_SHA; do
            value="${!name}"
            if [ -z "$value" ]; then
              fail "repository variable $name is not armed; arm it to $EXPECTED_SHA for this one dispatch, then clear it after the run"
            elif [ "$value" != "$EXPECTED_SHA" ]; then
              fail "repository variable $name is armed for a different SHA than expected_sha $EXPECTED_SHA"
            fi
          done
          if [ "$refused" -ne 0 ]; then
            echo "Refusing Stage B: the owner-approved exact-SHA admission is incomplete, so no job may run."
            exit 1
          fi
          echo "Admission complete: every owner approval is armed for exact live main $EXPECTED_SHA"

  deploy-web:
    needs: [admission]
    if: github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha && vars.ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA == inputs.expected_sha
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      private_admission_run_id: ${{ inputs.private_admission_run_id }}
      private_admission_run_attempt: ${{ inputs.private_admission_run_attempt }}
      private_admission_artifact_id: ${{ inputs.private_admission_artifact_id }}
    secrets:
      ANNUAL_PRIVATE_ADMISSION_APP_ID: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_APP_ID }}
      ANNUAL_PRIVATE_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_APP_PRIVATE_KEY }}
      ANNUAL_PRIVATE_ADMISSION_HMAC_KEY: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_HMAC_KEY }}
      ANNUAL_PUBLIC_REVIEW_HMAC_KEY: ${{ secrets.ANNUAL_PUBLIC_REVIEW_HMAC_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  deploy-docs:
    needs: [admission]
    if: github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha && vars.ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA == inputs.expected_sha
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      private_admission_run_id: ${{ inputs.private_admission_run_id }}
      private_admission_run_attempt: ${{ inputs.private_admission_run_attempt }}
      private_admission_artifact_id: ${{ inputs.private_admission_artifact_id }}
    secrets:
      ANNUAL_PRIVATE_ADMISSION_APP_ID: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_APP_ID }}
      ANNUAL_PRIVATE_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_APP_PRIVATE_KEY }}
      ANNUAL_PRIVATE_ADMISSION_HMAC_KEY: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_HMAC_KEY }}
      ANNUAL_PUBLIC_REVIEW_HMAC_KEY: ${{ secrets.ANNUAL_PUBLIC_REVIEW_HMAC_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  attest:
    name: Write truthful public-served Stage B after verified Web and Docs
    needs: [deploy-web, deploy-docs]
    if: github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha && vars.ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: annual-public-cutover
    permissions:
      # actions: read lets the default token re-read the finalized artifact record
      # after upload; it grants nothing on the private repository.
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.served-attestation-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.served-attestation-upload.outputs.artifact-digest }}
    env:
      ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA: ${{ vars.ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA }}
    steps:
      - name: Checkout exact approved commit for served attestation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Re-assert exact owner-approved live main after Web and Docs checks
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_SHA" != "$LIVE_MAIN_SHA" ] || [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$LIVE_MAIN_SHA" ] || [ "$ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing public served attestation: exact owner-approved live main identity is no longer present"
            exit 1
          fi
      - name: Mint protected narrow token for the exact private admission artifact
        id: private-admission-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe
        with:
          app-id: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_APP_ID }}
          private-key: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_APP_PRIVATE_KEY }}
          owner: silent-suite
          repositories: silentsuite-internal
          permission-actions: read
      - name: Fetch and verify exact signed timestamp-free Stage A before Stage B
        uses: ./.github/actions/verify-annual-pre-public-admission
        with:
          token: ${{ steps.private-admission-token.outputs.token }}
          private_run_id: ${{ inputs.private_admission_run_id }}
          private_run_attempt: ${{ inputs.private_admission_run_attempt }}
          private_artifact_id: ${{ inputs.private_admission_artifact_id }}
          expected_public_sha: ${{ inputs.expected_sha }}
          private_admission_hmac_key: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_HMAC_KEY }}
          public_review_hmac_key: ${{ secrets.ANNUAL_PUBLIC_REVIEW_HMAC_KEY }}
      - name: Freshly verify exact production Web and Docs served identities before Stage B
        id: served-identities
        shell: bash
        env:
          EXPECTED_PUBLIC_SHA: ${{ inputs.expected_sha }}
        run: node scripts/verify-annual-public-served-identities.mjs
      - name: Sign truthful served attestation before any artifact exists
        id: served-attestation
        shell: bash
        run: node scripts/build-annual-public-served-attestation.mjs
        env:
          ANNUAL_DEPLOYMENT_VERIFIED: 'true'
          ANNUAL_PRE_PUBLIC_ADMISSION: .annual-only/pre-public/annual-only-pre-public-admission.json
          ANNUAL_PRIVATE_ADMISSION_REPOSITORY: silent-suite/silentsuite-internal
          ANNUAL_PRIVATE_ADMISSION_RUN_ID: ${{ inputs.private_admission_run_id }}
          ANNUAL_PRIVATE_ADMISSION_RUN_ATTEMPT: ${{ inputs.private_admission_run_attempt }}
          ANNUAL_PRIVATE_ADMISSION_ARTIFACT_ID: ${{ inputs.private_admission_artifact_id }}
          ANNUAL_PRIVATE_ADMISSION_ARTIFACT_NAME: annual-only-pre-public-admission-${{ inputs.private_admission_run_id }}-${{ inputs.private_admission_run_attempt }}
          ANNUAL_PRIVATE_ADMISSION_HMAC_KEY: ${{ secrets.ANNUAL_PRIVATE_ADMISSION_HMAC_KEY }}
          ANNUAL_PUBLIC_REVIEW_HMAC_KEY: ${{ secrets.ANNUAL_PUBLIC_REVIEW_HMAC_KEY }}
          ANNUAL_PUBLIC_SERVED_HMAC_KEY: ${{ secrets.ANNUAL_PUBLIC_SERVED_HMAC_KEY }}
          ANNUAL_PUBLIC_SERVED_OUTPUT_DIRECTORY: .annual-only/public-served
          ANNUAL_PUBLIC_SERVED_ARTIFACT_NAME: annual-only-public-served-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          ANNUAL_PUBLIC_SERVED_CLIENT_SERVED_AT: ${{ steps.served-identities.outputs.client_served_at }}
          EXPECTED_PUBLIC_SHA: ${{ inputs.expected_sha }}
      - name: Upload exactly the signed served attestation through the pinned official artifact action
        id: served-attestation-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: annual-only-public-served-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .annual-only/public-served/annual-only-public-served-attestation.json
          if-no-files-found: error
          include-hidden-files: false
      - name: Verify the finalized Stage B artifact record binds this exact run and head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ARTIFACT_ID: ${{ steps.served-attestation-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.served-attestation-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::official upload returned no finalized artifact ID'; exit 1; }
          digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::official upload returned no finalized artifact digest'; exit 1; }
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .id <<<"$artifact")" = "$ARTIFACT_ID"
          test "$(jq -r .name <<<"$artifact")" = "annual-only-public-served-attestation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "$GITHUB_RUN_ID"
          test "$(jq -r .workflow_run.head_sha <<<"$artifact")" = "$EXPECTED_SHA"
          test "$(jq -r .expired <<<"$artifact")" = false
          test "$(jq -r '.digest | ltrimstr("sha256:")' <<<"$artifact")" = "$digest"
          echo "Stage B finalized: public artifact $ARTIFACT_ID sha256:$digest for run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT. Dispatch private Stage C with exactly these identities."

  cutover-outcome:
    name: Refuse a silent cutover that executed no admitted work
    needs: [admission, deploy-web, deploy-docs, attest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      ADMISSION_RESULT: ${{ needs['admission'].result }}
      DEPLOY_WEB_RESULT: ${{ needs['deploy-web'].result }}
      DEPLOY_DOCS_RESULT: ${{ needs['deploy-docs'].result }}
      ATTEST_RESULT: ${{ needs['attest'].result }}
    steps:
      - name: Report every admitted job result and fail unless Stage B actually completed
        shell: bash
        run: |
          set -uo pipefail
          refused=0
          for pair in "admission:$ADMISSION_RESULT" "deploy-web:$DEPLOY_WEB_RESULT" "deploy-docs:$DEPLOY_DOCS_RESULT" "attest:$ATTEST_RESULT"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            echo "$job: $result"
            if [ "$result" != 'success' ]; then
              echo "::error::$job concluded $result; Stage B did not complete"
              refused=1
            fi
          done
          if [ "$refused" -ne 0 ]; then
            echo "Stage B produced no truthful public-served attestation. Clear ANNUAL_PUBLIC_CUTOVER_APPROVED_SHA, WEB_DEPLOY_APPROVED_SHA, and DOCS_DEPLOY_APPROVED_SHA before any remediation."
            exit 1
          fi
