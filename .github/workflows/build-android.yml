name: Build Android APK and AAB

on:
  push:
    branches: [dev, main]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'tests/test_android_*.py'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'android/**'
      - 'tests/test_android_*.py'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # PR / dev / main builds — unsigned, no signing secrets accessible.
  # Validates that the Android project compiles and assembles.
  # ─────────────────────────────────────────────────────────────────────
  build-pr:
    name: Build (unsigned, PR/dev/main)
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python for static Android contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Android static Python contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest ../tests/test_android_*.py -q

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK r28
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 16 KB-aligned Etebase client AAR
        run: scripts/build-etebase-client-16kb.sh

      - name: Run debug unit tests, lint, and assemble instrumentation APKs
        # Assemble each Android module's androidTest APK so AGP merges and
        # validates its instrumentation manifest. Runtime coverage stays
        # focused on the app test below (API 21 and API 35).
        run: >-
          ./gradlew
          app:testDebugUnitTest
          app:lintDebug
          app:assembleDebugAndroidTest
          verifyDebugAndroidTestDesugarRuntime
          cert4android:assembleDebugAndroidTest
          ical4android:assembleDebugAndroidTest
          vcard4android:assembleDebugAndroidTest
          --continue --no-daemon -PrequireEtebase16Kb=true

      - name: Upload unit test reports and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-test-results-${{ github.sha }}
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-reports-${{ github.sha }}
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Capture debug and release runtime dependency graphs
        run: |
          mkdir -p build/privacy-evidence/dependencies
          ./gradlew app:dependencies --configuration debugRuntimeClasspath --no-daemon \
            > build/privacy-evidence/dependencies/debug-runtime.txt
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > build/privacy-evidence/dependencies/release-runtime.txt

      - name: Build debug APK and unsigned release APK/AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon -PrequireEtebase16Kb=true

      - name: Generate universal split set from unsigned AAB
        env:
          BUNDLETOOL_VERSION: '1.18.1'
          BUNDLETOOL_SHA256: '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c'
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --output build/privacy-evidence/unsigned-release.apks \
            --mode universal
          unzip -q build/privacy-evidence/unsigned-release.apks \
            -d build/privacy-evidence/unsigned-release-splits

      - name: Scan dependency, manifest, mapping, resources, APK, AAB, splits, DEX, and native payloads
        run: |
          set -euo pipefail
          mkdir -p build/privacy-evidence/build-metadata
          test -s app/build/outputs/mapping/release/mapping.txt
          mkdir -p build/privacy-evidence/build-metadata/app/build/outputs/mapping/release
          cp app/build/outputs/mapping/release/mapping.txt \
            build/privacy-evidence/build-metadata/app/build/outputs/mapping/release/mapping.txt
          find app/build/intermediates -type f \
            \( -iname '*manifest*.xml' -o -iname '*mapping*.txt' -o -iname 'resources*.txt' -o -iname 'resources*.arsc' \) \
            -exec cp --parents {} build/privacy-evidence/build-metadata/ \;
          sha256sum app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            build/privacy-evidence/unsigned-release.apks \
            > build/privacy-evidence/artifact-sha256.txt
          python3 scripts/scan-tracker-signatures.py \
            --manifest security/tracker-signatures.json \
            --summary build/privacy-evidence/tracker-scan-summary.json \
            build/privacy-evidence/dependencies \
            build/privacy-evidence/build-metadata \
            app/build/outputs/apk/debug \
            app/build/outputs/apk/release \
            app/build/outputs/bundle/release \
            build/privacy-evidence/unsigned-release.apks \
            build/privacy-evidence/unsigned-release-splits

      - name: Verify debug native library alignment
        run: |
          python3 scripts/verify-native-16kb.py \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            app/build/outputs/apk/debug/*.apk

      - name: Upload tracker verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tracker-scan-${{ github.sha }}
          path: android/build/privacy-evidence/
          retention-days: 14

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: silentsuite-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  account-recreation-runtime:
    name: Account recreation (API ${{ matrix.api-level }}, ${{ matrix.arch }})
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 21
            arch: x86
          - api-level: 35
            arch: x86_64
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK r28
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 16 KB-aligned Etebase client AAR
        run: scripts/build-etebase-client-16kb.sh

      - name: Enable KVM for the emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run focused launcher and setup recreation contracts
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          disable-animations: true
          script: cd android && ./gradlew app:connectedDebugAndroidTest --no-daemon -PrequireEtebase16Kb=true -Pandroid.testInstrumentationRunnerArguments.class=io.silentsuite.sync.ui.AccountActivityRecreationTest,io.silentsuite.sync.ui.AccountDrawerSignOutRuntimeTest,io.silentsuite.sync.ui.AccountDashboardRuntimeTest,io.silentsuite.sync.ui.PostLoginSetupRuntimeTest,io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest,io.silentsuite.sync.utils.TaskProviderHandlingRuntimeTest,io.silentsuite.sync.syncadapter.SyncStatusRuntimeTest,io.silentsuite.sync.ui.SettingsRuntimeTest,io.silentsuite.sync.ui.SiblingRoutesRuntimeTest

      - name: Upload focused androidTest reports and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-recreation-androidTest-api${{ matrix.api-level }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Assert focused runtime methods executed
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          from collections import Counter
          expected={
            ('io.silentsuite.sync.ui.AccountActivityRecreationTest','recreationKeepsTheExactAccountRouteAndDeliversModelStateToTheRecreatedUi'),
            ('io.silentsuite.sync.ui.AccountActivityRecreationTest','readyDoneCompletesOnlyTheExactGeneratedAccount'),
            ('io.silentsuite.sync.ui.AccountActivityRecreationTest','replacementGenerationCannotCompleteThePreviouslyValidatedSetupRoute'),
            ('io.silentsuite.sync.ui.AccountDrawerSignOutRuntimeTest','oneAccountSwitcherExposesAddRowAndCurrentSemanticsAfterRecreation'),
            ('io.silentsuite.sync.ui.AccountDrawerSignOutRuntimeTest','delayedRemovalFailureSurvivesRecreationAndDuplicateTapStartsOnce'),
            ('io.silentsuite.sync.ui.AccountDrawerSignOutRuntimeTest','actualTwoAccountSignOutRemovesExactMainAndChildAndActivatesSibling'),
            ('io.silentsuite.sync.ui.AccountDrawerSignOutRuntimeTest','adapterRefusesToRemoveSameNameReplacementGeneration'),
            ('io.silentsuite.sync.ui.AccountDrawerSignOutRuntimeTest','delayedSuccessfulRemovalAfterRecreationRoutesRetainedSibling'),
            ('io.silentsuite.sync.ui.AccountDashboardRuntimeTest','truthfulDashboardTransitionsUseDurableEvidenceAndDedupeAcrossRecreation'),
            ('io.silentsuite.sync.ui.AccountDashboardRuntimeTest','serviceModulesAndCompleteActionsPreserveMetadataAndExactAccountRouting'),
            ('io.silentsuite.sync.ui.AccountDashboardRuntimeTest','retainedLoadRejectsSameNameReplacementBeforePublication'),
            ('io.silentsuite.sync.ui.AccountDashboardRuntimeTest','initialLoadFailurePublishesTerminalErrorAndRefreshFailureRetainsValidDashboard'),
            ('io.silentsuite.sync.ui.AccountDashboardRuntimeTest','retainedSurfaceRejectsReplacementBeforePrivateActionsAndRoutes'),
            ('io.silentsuite.sync.ui.AccountDashboardRuntimeTest','dashboardExportCompletionPreservesExactDashboardAfterRecreation'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','noNetworkDashboardShellRoutesExactAccountAfterReadyDone'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','recoveryRemovalConfirmedRoutesCleanLoginAndPreservesSibling'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','permissionsRecoveryBlocksActionsAndLimitedSkipReachesReady'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','pendingRecoveryRemovalSurvivesRecreationAndCleansExactOwner'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','missingCreationIdShowsSettingsOnlyResolution'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','readOnlyLimitedTasksUseNormalContinueAndReachReady'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','generationMismatchShowsSettingsOnlyAcrossRecreation'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','accountCreatedSyncConfigurationEnablesCoreAuthoritiesWithoutRecovery'),
            ('io.silentsuite.sync.ui.PostLoginSetupRuntimeTest','accountCreatedSyncFailureKeepsExactRowAndOffersContinueRetry'),
            ('io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest','controllerLiveResultCancellationDuplicatesAndRestoreAreExactOnce'),
            ('io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest','cleanInstallBootstrapPublishesMarkerAfterReconciliation'),
            ('io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest','recoverableCreationFailureRestoresCredentialsWithoutFinishingOrCancelling'),
            ('io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest','obsoleteCoordinatorCancelsBeforeNormalLaunch'),
            ('io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest','staleLoginActivityRestorationUsesObsoletePathBeforeController'),
            ('io.silentsuite.sync.ui.setup.AuthenticatorLifecycleRuntimeTest','sameProcessRotationPolicyPreservesAuthenticator'),
            ('io.silentsuite.sync.utils.TaskProviderHandlingRuntimeTest','explicitCreatingTargetOnlyReceivesProviderConfiguration'),
            ('io.silentsuite.sync.syncadapter.SyncStatusRuntimeTest','contactsAttemptExtraRoundTripsAtProviderBoundary'),
            ('io.silentsuite.sync.syncadapter.SyncStatusRuntimeTest','persistedEvidenceIsExactAccountGenerationScopedAndContainsNoAccountName'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','encryptionPasswordCompletionRecreatesAndReturnsToCallerForExactGeneration'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','encryptionPasswordCancelReturnsToCallerAfterRecreation'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','importRecreationAndBackCancelReturnToItsCaller'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','importCompletionShowsResultAndReturnsToCallerForExactCollection'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','fingerprintCopyRevalidatesGenerationBeforeWritingClipboard'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','fingerprintCopyCompletesAfterRecreationForItsExactGeneration'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','fingerprintCancelAfterRecreationReturnsToExactDashboard'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','collectionCreateLaunchRecreateAndBackPreserveExactRoute'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','invitationsLaunchRecreateAndBackKeepsExactGenerationRoute'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','exactGenerationRoutesLaunchRealActivitiesAndRejectReplacement'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','aboutHelpRemainsReadableAndSelectedAcrossRecreation'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','staleSameNameGenerationRoutesFailClosedBeforeRendering'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','collectionExportCompletionReturnsToExactRenderedCollection'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','collectionViewRendersRecreatesAndReturnsForExactCollection'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','collectionCreateCompletionRendersCreatedCollectionAndPreservesReturn'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','collectionEditCompletionReturnsToUpdatedCollection'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','collectionMembersRenderRemoveAndReturnToExactCollection'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','invitationAcceptCompletionReturnsToCallerForExactGeneration'),
            ('io.silentsuite.sync.ui.SiblingRoutesRuntimeTest','invitationRejectCompletionUpdatesListAndReturnsForExactGeneration'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','exactAccountSyncSettingAndCategorySurviveRecreationWithoutChangingSibling'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','staleNotificationAndLegacyRoutesRejectReaddedSameNameAcrossProcessStyleRelaunch'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','loggerNotificationRouteKeepsAdvancedExactGenerationAcrossRecreationAndRejectsReplacement'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','retainedSettingsRejectSameNameReplacementBeforeAccountMutation'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','proxyPortPreferenceAcceptsBoundsAndPreservesPriorValueOnInvalidInput'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','twoStoreMigrationRerunsAfterDefaultAliasCommitFailure'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','migrationRerunsAfterCanonicalStoreCommitFailureWithoutTouchingAliases'),
            ('io.silentsuite.sync.ui.SettingsRuntimeTest','migrationMarkerFailureRerunsAndMarkerIsAlwaysLast'),
          }
          seen=[]
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
            root=ET.parse(path).getroot()
            for case in root.iter('testcase'):
              pair=(case.attrib.get('classname'),case.attrib.get('name')); seen.append(pair)
              if pair in expected and list(case): raise SystemExit(f'failed {pair}')
          counts=Counter(seen)
          missing=expected-set(counts)
          if missing: raise SystemExit(f'missing {sorted(missing)}')
          duplicates={pair: counts[pair] for pair in expected if counts[pair] != 1}
          if duplicates: raise SystemExit(f'expected test count mismatch {duplicates}')
          PY

  # ─────────────────────────────────────────────────────────────────────
  # Release builds — signed, only on version tags.
  # Uses a protected GitHub Environment so signing secrets are not
  # accessible to PRs, forks, or non-tag pushes.
  # ─────────────────────────────────────────────────────────────────────
  build-release:
    name: Build (signed, tag release)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK r28
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 16 KB-aligned Etebase client AAR
        run: scripts/build-etebase-client-16kb.sh

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/silentsuite-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/silentsuite-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          KSTOREPWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PrequireEtebase16Kb=true \
            -PsigningStoreLocation="$KEYSTORE_PATH" \
            -PsigningKeyAlias="$KEY_ALIAS"

      - name: Capture release dependency graph and generate signed-release splits
        env:
          BUNDLETOOL_VERSION: '1.18.1'
          BUNDLETOOL_SHA256: '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c'
          KSTOREPWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p build/privacy-evidence/dependencies build/privacy-evidence/build-metadata
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > build/privacy-evidence/dependencies/release-runtime.txt
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --output build/privacy-evidence/signed-release.apks \
            --mode universal \
            --ks="$KEYSTORE_PATH" --ks-key-alias="$KEY_ALIAS" \
            --ks-pass=env:KSTOREPWD --key-pass=env:KSTOREPWD
          unzip -q build/privacy-evidence/signed-release.apks \
            -d build/privacy-evidence/signed-release-splits
          test -s app/build/outputs/mapping/release/mapping.txt
          mkdir -p build/privacy-evidence/build-metadata/app/build/outputs/mapping/release
          cp app/build/outputs/mapping/release/mapping.txt \
            build/privacy-evidence/build-metadata/app/build/outputs/mapping/release/mapping.txt
          find app/build/intermediates -type f \
            \( -iname '*manifest*.xml' -o -iname '*mapping*.txt' -o -iname 'resources*.txt' -o -iname 'resources*.arsc' \) \
            -exec cp --parents {} build/privacy-evidence/build-metadata/ \;
          sha256sum app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            build/privacy-evidence/signed-release.apks \
            > build/privacy-evidence/artifact-sha256.txt
          python3 scripts/scan-tracker-signatures.py \
            --manifest security/tracker-signatures.json \
            --summary build/privacy-evidence/tracker-scan-summary.json \
            build/privacy-evidence/dependencies \
            build/privacy-evidence/build-metadata \
            app/build/outputs/apk/release \
            app/build/outputs/bundle/release \
            build/privacy-evidence/signed-release.apks \
            build/privacy-evidence/signed-release-splits

      - name: Upload signed tracker verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tracker-scan-${{ github.sha }}
          path: android/build/privacy-evidence/
          retention-days: 30

      - name: Verify release native library alignment
        run: |
          python3 scripts/verify-native-16kb.py \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Verify AAB signature
        run: jarsigner -verify -certs -verbose app/build/outputs/bundle/release/*.aab

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: silentsuite-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Rename Android artifacts for release
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/silentsuite-android-${{ github.ref_name }}.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
             "app/build/outputs/bundle/release/silentsuite-android-${{ github.ref_name }}.aab"
          cd app/build/outputs/apk/release
          sha256sum "silentsuite-android-${{ github.ref_name }}.apk" \
            > "silentsuite-android-${{ github.ref_name }}.apk.sha256"
          cd ../../bundle/release
          sha256sum "silentsuite-android-${{ github.ref_name }}.aab" \
            > "silentsuite-android-${{ github.ref_name }}.aab.sha256"

      - name: Attach Android artifacts to umbrella GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SilentSuite ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/silentsuite-android-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/silentsuite-android-${{ github.ref_name }}.apk.sha256
            android/app/build/outputs/bundle/release/silentsuite-android-${{ github.ref_name }}.aab
            android/app/build/outputs/bundle/release/silentsuite-android-${{ github.ref_name }}.aab.sha256

      - name: Cleanup keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
