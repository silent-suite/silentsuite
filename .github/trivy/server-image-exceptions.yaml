# Reviewed exceptions for the HIGH/CRITICAL gate in ci-server.yml (self-host-image).
# Only the gate step reads this file. The inventory scan and the step that prints
# every finding still run with no ignore file, so these findings stay visible.
#
# krb5-libs 1.22.2-r1 comes from the pinned python:3.12-alpine base image. Alpine
# fixed these in 1.22.3-r0, but no python:3.12-alpine image with the fix has been
# published yet.
#
# By their advisory titles, fourteen of these concern the KDC or kadmind daemons,
# which are packaged in krb5-server and not installed in this image.
# CVE-2026-40355 and CVE-2026-40356 are different: they affect any process that
# accepts GSS-API security contexts (gss_accept_sec_context) with NegoEx
# registered. The server source has no GSS acceptor path. That comes from reading
# the source; there is no binary-level inventory of the image proving it.
#
# Each entry matches only krb5-libs at exactly 1.22.2-r1 and expires on 2026-12-11,
# after which the gate fails again. Remove this file when the base digest moves to
# an image that ships krb5-libs 1.22.3-r0 or later.
vulnerabilities:
  - id: CVE-2026-107364
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1
    expired_at: 2026-12-11
    statement: Fixed in krb5-libs 1.22.3-r0; no python:3.12-alpine image with the fix is published yet. KDC/kadmind issue per the advisory title; krb5-server is not installed.
