{% macro router_conf(values) -%}
# SilentSuite app router: one origin for the web app and the Etebase server.
# Keeps the external Host (including port), binary bodies, POST trailing slashes
# and websocket upgrades. Adds no authorization or registration headers.
worker_processes auto;
pid /tmp/nginx.pid;
# Master/startup diagnostics only; request-level errors are discarded below.
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log off;
    # HTTP error records append the request line; nginx cannot redact it here.
    # Discard request-specific errors, including proxy failures.
    error_log /dev/null;
    server_tokens off;
    client_max_body_size 64m;

    # There is no platform login in front of this app, so the installation-owner
    # login (a long password) gets a per-address rate limit as well.
    limit_req_zone $binary_remote_addr zone=owner_login:1m rate=10r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
{%- if values.network.certificate_id %}
        listen {{ values.consts.router_port }} ssl;
        ssl_certificate     {{ values.consts.ssl_cert_path }};
        ssl_certificate_key {{ values.consts.ssl_key_path }};
        ssl_protocols TLSv1.2 TLSv1.3;
{%- else %}
        listen {{ values.consts.router_port }};
{%- endif %}
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        # Both upstreams are on the app network: fail fast with a 502 when one is down.
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Django admin is disabled in the server; never route to it either.
        location /admin/ {
            return 404;
        }

        location /api/v1/owner/ {
            limit_req zone=owner_login burst=5 nodelay;
            proxy_pass http://{{ values.consts.server_container_name }}:{{ values.consts.server_port }};
        }

        location /api/ {
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://{{ values.consts.server_container_name }}:{{ values.consts.server_port }};
        }

        location / {
            proxy_pass http://{{ values.consts.web_container_name }}:{{ values.consts.web_port }};
        }
    }
}
{%- endmacro %}
