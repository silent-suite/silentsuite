resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

silentsuite:
  # Public CI fixtures only, never real credentials.
  installation_password: ci-fixture-installation-password-0123456789
  db_password: "ci fixture %db password; with 'quotes' and \"double\""
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080
  certificate_id: null
  behind_https_proxy: true
  networks: []

ix_volumes:
  data: /opt/tests/mnt/data
  postgres_data: /opt/tests/mnt/postgres_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true

labels: []
