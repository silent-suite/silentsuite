consts:
  server_container_name: server
  web_container_name: web
  router_container_name: router
  postgres_container_name: postgres
  perms_container_name: permissions
  # The server owns the data storage, so it runs as the TrueNAS apps user (568).
  # The web (nextjs) and router (nginx) images keep their own users; they write no host storage.
  server_user: 568
  server_group: 568
  web_user: 1001
  web_group: 1001
  router_user: 101
  router_group: 101
  db_name: silentsuite
  db_user: silentsuite
  router_port: 8080
  server_port: 3735
  web_port: 3000
  ssl_cert_path: /etc/nginx/certs/cert.pem
  ssl_key_path: /etc/nginx/certs/key.pem
