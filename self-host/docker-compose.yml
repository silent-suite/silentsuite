services:
  postgres:
    # PostgreSQL 16.9-alpine, pinned to its immutable multi-platform OCI index
    # digest rather than the tag. The tag is how the image was found once; the
    # digest is what runs. This container holds the database password and every
    # account and sync row, so "restart the version you have" has to mean the
    # same bytes — a republished or compromised tag must not be able to change
    # them under an unchanged SilentSuite release.
    #
    # Source: docker.io/library/postgres:16.9-alpine
    #   linux/amd64    sha256:b441677c946de564fe88ae4245ba80fe84a69485b22bf560e9c7c3710cd5e21d
    #   linux/arm64/v8 sha256:a833a42d2f60170d90d8fb46b99e80f29b083a173c85ffd1e7e366730dc5529c
    image: postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    container_name: silentsuite-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-silentsuite}
      POSTGRES_USER: ${DATABASE_USER:-silentsuite}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-silentsuite} -d ${DATABASE_NAME:-silentsuite}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 128mb
    command: postgres -c max_connections=200
    networks:
      - silentsuite

  server:
    # The image is release data, never source data. The installer verifies a
    # signed-off release bundle and writes the exact OCI index digest into .env
    # as SILENTSUITE_SERVER_IMAGE, so this file stays valid for every version.
    # There is deliberately no default: an unset value must fail loudly rather
    # than silently start a stale or mutable image.
    image: ${SILENTSUITE_SERVER_IMAGE:?Set by the verified SilentSuite installer or updater}
    container_name: silentsuite-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-3735}:3735"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Django /admin/ superuser. Created on first boot if both are set and the
      # user does not already exist; otherwise the entrypoint silently skips.
      SUPER_USER: ${SUPER_USER:-admin}
      SUPER_PASS: ${SUPER_PASS}
      # Open registration toggle. "true" blocks new signups (use after the
      # operator's admin account is registered). Default "false" allows signup.
      ETEBASE_DISABLE_SIGNUP: ${ETEBASE_DISABLE_SIGNUP:-false}
      # One-time first-admin signup token. When set, the first signup must use
      # https://YOUR_DOMAIN/?bootstrap_token=TOKEN as the server URL.
      ETEBASE_BOOTSTRAP_ADMIN_TOKEN: ${ETEBASE_BOOTSTRAP_ADMIN_TOKEN:-}
      # Hide the advanced Django admin panel unless explicitly re-enabled.
      ETEBASE_DISABLE_DJANGO_ADMIN: ${ETEBASE_DISABLE_DJANGO_ADMIN:-true}
      # Only these reverse proxy IPs may set X-Forwarded-* headers.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
      # Largest accepted request body in bytes for sign-up, login and password
      # change (65536 to 1073741824), and for all other API requests such as
      # sync batches and attachment uploads (1048576 to 1073741824).
      ETEBASE_MAX_AUTH_REQUEST_BYTES: ${ETEBASE_MAX_AUTH_REQUEST_BYTES:-65536}
      ETEBASE_MAX_REQUEST_BYTES: ${ETEBASE_MAX_REQUEST_BYTES:-67108864}
    volumes:
      - server_data:/data
      - ./success.html:/app/etebase_server/templates/success.html:ro
      - ./etebase-server.ini:/etc/etebase-server/etebase-server.ini:ro
    healthcheck:
      # Treat any non-5xx HTTP response as healthy. The server runs behind a
      # TLS-terminating reverse proxy and Django's SECURE_SSL_REDIRECT (enabled
      # when debug=false) 301-redirects this in-container plain-HTTP probe to
      # https://, which urllib would follow and fail against the plaintext port.
      # http.client does not follow redirects, so a 301 here still means "up".
      test: ["CMD-SHELL", "python -c \"import http.client,sys; c=http.client.HTTPConnection('localhost',3735,timeout=5); c.request('GET','/'); sys.exit(0 if c.getresponse().status<500 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - silentsuite

volumes:
  pgdata:
  server_data:

networks:
  silentsuite:
    driver: bridge
