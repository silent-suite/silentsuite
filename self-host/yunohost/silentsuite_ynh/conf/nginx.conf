# Request lines carry collection IDs and sync tokens: no access or error log entries.
# Upstream errors stay here too: YunoHost's own 502 page would log the original request line.
location / {
    access_log off;
    error_log /dev/null;
    error_page 502 503 504 = @__APP__-unavailable;

    proxy_pass http://127.0.0.1:__PORT_WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    access_log off;
    error_log /dev/null;
    error_page 502 503 504 = @__APP__-unavailable;
    client_max_body_size 64m;

    proxy_pass http://127.0.0.1:__PORT_SERVER__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /api/v1/ws/ {
    access_log off;
    error_log /dev/null;
    error_page 502 503 504 = @__APP__-unavailable;

    proxy_pass http://127.0.0.1:__PORT_SERVER__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @__APP__-unavailable {
    access_log off;
    error_log /dev/null;
    return 502;
}
