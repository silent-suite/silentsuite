# SilentSuite StartOS router: one origin for the web app and the Etebase server.
# Keeps the external Host (including port), binary bodies, POST trailing slashes
# and websocket upgrades. Adds no authorization or registration headers.
#
# StartOS strips client X-Forwarded-* headers on both legs of the binding and sets
# X-Forwarded-Proto: https only on its TLS leg. Anything else arrived over the
# plaintext leg: reads are redirected to HTTPS, everything else is refused here
# without being proxied.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $silentsuite_tls_leg {
    default 0;
    https   1;
}

map "$silentsuite_tls_leg:$request_method" $silentsuite_plain_action {
    default    refuse;
    "~^1:"     pass;
    "0:GET"    redirect;
    "0:HEAD"   redirect;
}

server {
    listen 8080;
    server_name _;

    access_log off;
    # HTTP error records append the request line; nginx cannot redact it here.
    # Discard request-specific errors, including proxy failures. Master/startup
    # diagnostics retain the image's main error logger.
    error_log /dev/null;
    client_max_body_size 64m;

    if ($silentsuite_plain_action = redirect) {
        return 308 https://$host$request_uri;
    }
    if ($silentsuite_plain_action = refuse) {
        return 403;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_redirect off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # The Django admin is disabled in the server as well; never expose it here.
    location /admin/ {
        return 404;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3735;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
